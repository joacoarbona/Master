<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyQuest — learn Python by running it</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
:root{
  --ink:#11141b; --ink-2:#1a1f29; --ink-3:#222936;
  --paper:#f4f7fa; --paper-2:#ffffff;
  --line:#e3e8ef; --line-dark:#2b3340;
  --text:#1b2230; --muted:#69748a; --muted-dark:#8b97ab;
  --py-blue:#3b6fb5; --py-blue-2:#2c5a98;
  --py-yellow:#ffd43b; --py-yellow-deep:#cc9f00;
  --green:#2e9e6b; --red:#d65a5a;
  --mono: ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);background:var(--paper);
  -webkit-font-smoothing:antialiased;line-height:1.55}
button{font-family:var(--mono);cursor:pointer;border:none;background:none}
code{font-family:var(--mono);font-size:.86em;background:#eef1f6;padding:1px 5px;border-radius:4px;color:#2c3850}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:18px;height:58px;padding:0 18px;
  background:var(--ink);color:#fff;position:sticky;top:0;z-index:40;
  border-bottom:1px solid var(--line-dark)}
.brand{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand .prompt{color:var(--py-yellow);font-weight:700}
.brand-sub{font-weight:400;font-size:11px;color:var(--muted-dark);letter-spacing:.04em}
.progress-wrap{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.bar{flex:1;max-width:340px;height:7px;background:var(--ink-3);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--py-blue),var(--py-yellow));transition:width .4s ease}
.pmeta{font-family:var(--mono);font-size:12px;color:var(--muted-dark);white-space:nowrap}
.pmeta b{color:#fff;font-weight:600}
.xp{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--py-yellow);padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.topbar-actions{display:flex;gap:8px}
.tb-btn{color:#cdd6e4;font-size:12px;padding:7px 12px;border:1px solid var(--line-dark);border-radius:7px;transition:.15s}
.tb-btn:hover{color:#fff;border-color:#3a455a;background:var(--ink-2)}
.tb-btn.on{color:var(--ink);background:var(--py-yellow);border-color:var(--py-yellow)}
.tb-btn.ai{color:var(--ink);background:var(--py-yellow);border-color:var(--py-yellow);font-weight:700}
.tb-btn.ai:hover{background:var(--py-yellow);filter:brightness(.95)}

/* ---------- layout ---------- */
.layout{display:flex;align-items:flex-start;max-width:1240px;margin:0 auto}
.sidebar{width:268px;flex:0 0 268px;position:sticky;top:58px;height:calc(100vh - 58px);
  overflow-y:auto;padding:18px 12px 60px;border-right:1px solid var(--line);background:var(--paper)}
.track-group{margin-bottom:18px}
.track-label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 6px;display:flex;align-items:center;gap:7px}
.track-label::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--py-blue)}
.track-group.t-Pythonic .track-label::before{background:var(--py-yellow-deep)}
.track-group.t-Projects .track-label::before{background:var(--green)}
.lnav{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:13.5px;color:var(--text);
  padding:8px 10px 8px 34px;border-radius:8px;position:relative;line-height:1.35;transition:.12s}
.lnav:hover{background:#e9eef5}
.lnav.active{background:var(--ink);color:#fff}
.lnav.active .lcode{color:var(--py-yellow)}
.lcode{font-family:var(--mono);font-size:10.5px;color:var(--muted);position:absolute;left:9px;top:9px;font-weight:600}
.lnav .tick{position:absolute;left:11px;top:8px;color:var(--green);font-size:13px;display:none}
.lnav.done .tick{display:block}
.lnav.done .lcode{display:none}
.lnav.done{color:var(--muted)}
.lnav.active.done{color:#fff}

/* ---------- content ---------- */
.content{flex:1;min-width:0;padding:32px 40px 90px;max-width:840px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--py-blue);font-weight:600;display:flex;align-items:center;gap:10px}
.eyebrow .dot{color:var(--muted)}
h1.l-title{font-size:30px;line-height:1.15;margin:10px 0 6px;letter-spacing:-.01em;font-weight:750}
.l-sub{color:var(--muted);font-size:14px;margin-bottom:24px;display:flex;align-items:center;gap:14px}
.mark{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--py-blue);border:1px solid var(--line);padding:6px 12px;border-radius:7px;transition:.15s}
.mark:hover{border-color:var(--py-blue);background:#eef3fa}
.mark.done{background:var(--green);color:#fff;border-color:var(--green)}

.concept{font-size:15.5px;color:#2a3344}
.concept p{margin:0 0 14px}
.concept ul{margin:0 0 14px;padding-left:22px}
.concept li{margin-bottom:5px}
pre.cc{background:var(--ink);color:#e7ecf3;font-family:var(--mono);font-size:13px;line-height:1.6;
  padding:14px 16px;border-radius:10px;overflow-x:auto;margin:0 0 16px;border:1px solid var(--line-dark)}
pre.cc{tab-size:4}

/* ---------- code block (editor) ---------- */
.block{margin:22px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper-2)}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#eef2f7;border-bottom:1px solid var(--line)}
.block-head .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.block-head .tag .prompt{color:var(--py-blue);font-weight:700}
.ex-prompt{padding:14px 16px;font-size:14.5px;color:#27313f}
.ex-prompt code{background:#eaf0fb}
.editor{width:100%;border:none;outline:none;resize:vertical;display:block;
  font-family:var(--mono);font-size:13.5px;line-height:1.55;tab-size:4;
  background:var(--ink);color:#e9eef5;padding:14px 16px;min-height:96px;caret-color:var(--py-yellow)}
.editor::selection{background:#39507a}
.block-actions{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#eef2f7;border-top:1px solid var(--line)}
.run{font-size:13px;font-weight:700;color:#fff;background:var(--py-blue);padding:8px 16px;border-radius:7px;transition:.15s;display:flex;align-items:center;gap:7px}
.run:hover{background:var(--py-blue-2)}
.run:disabled{opacity:.5;cursor:not-allowed}
.run.check{background:var(--green)}
.run.check:hover{filter:brightness(.93)}
.ghost{font-size:12.5px;color:var(--muted);padding:8px 10px;border-radius:7px}
.ghost:hover{color:var(--text);background:#e4eaf2}
.result{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:600}
.result.ok{color:var(--green)}
.result.no{color:var(--red)}
.console{font-family:var(--mono);font-size:13px;line-height:1.5;background:#0d1016;color:#cfe3d6;
  padding:0;max-height:0;overflow:hidden;transition:max-height .25s ease;white-space:pre-wrap;word-break:break-word}
.console.show{padding:13px 16px;max-height:420px;overflow:auto;border-top:1px solid var(--line-dark)}
.console .err{color:#ff9a9a}
.console .sys{color:#7d8aa0}
.hintbox{margin:0 16px 14px;padding:11px 14px;background:#fff8e1;border:1px solid #f0e0a8;border-radius:9px;
  font-size:13.5px;color:#6b5a16;display:none}
.hintbox.show{display:block}
.hintbox code{background:#f6edc8;color:#5a4b12}

/* ---------- footer nav ---------- */
.lfoot{display:flex;justify-content:space-between;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.navbtn{font-family:var(--sans);font-size:13.5px;color:var(--text);padding:11px 18px;border:1px solid var(--line);border-radius:9px;transition:.15s;max-width:46%;text-align:left}
.navbtn:hover{border-color:var(--py-blue);background:#eef3fa}
.navbtn small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn.next{text-align:right;margin-left:auto}

/* ---------- repl drawer ---------- */
.repl-drawer{position:fixed;right:0;bottom:0;width:min(440px,92vw);max-height:62vh;background:var(--ink);
  border-left:1px solid var(--line-dark);border-top:1px solid var(--line-dark);border-top-left-radius:14px;
  box-shadow:0 -10px 40px rgba(8,12,20,.35);transform:translateY(102%);transition:transform .28s ease;z-index:45;
  display:flex;flex-direction:column}
.repl-drawer.open{transform:translateY(0)}
.repl-head{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line-dark);color:#fff;font-family:var(--mono);font-size:12.5px}
.repl-head .prompt{color:var(--py-yellow);font-weight:700}
.repl-head .x{margin-left:auto;color:var(--muted-dark);font-size:16px;padding:2px 8px;border-radius:6px}
.repl-head .x:hover{color:#fff;background:var(--ink-2)}
.repl-out{flex:1;overflow:auto;font-family:var(--mono);font-size:12.5px;color:#cfe3d6;padding:12px 15px;white-space:pre-wrap;word-break:break-word;min-height:60px}
.repl-out .err{color:#ff9a9a}
.repl-out .in{color:#8fb4e6}
.repl-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-dark);background:var(--ink-2)}
.repl-in textarea{flex:1;background:#0d1016;border:1px solid var(--line-dark);border-radius:8px;color:#e9eef5;
  font-family:var(--mono);font-size:13px;padding:9px 11px;resize:none;outline:none;min-height:38px;max-height:120px}
.repl-in button{background:var(--py-yellow);color:var(--ink);font-weight:700;font-size:12px;padding:0 14px;border-radius:8px}

/* ---------- status pill ---------- */
.pystatus{position:fixed;left:14px;bottom:14px;z-index:50;font-family:var(--mono);font-size:11.5px;
  padding:8px 13px;border-radius:99px;background:var(--ink);color:#cdd6e4;border:1px solid var(--line-dark);
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(8,12,20,.25)}
.pystatus .led{width:8px;height:8px;border-radius:99px;background:var(--py-yellow);animation:pulse 1.1s infinite}
.pystatus.ready .led{background:var(--green);animation:none}
.pystatus.error{background:#3a1f22;color:#ffc9c9;border-color:#5a2e2e}
.pystatus.error .led{background:var(--red);animation:none}
.pystatus.ready{opacity:0;pointer-events:none;transition:opacity .6s .8s}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.menu-toggle{display:none}

/* ---------- responsive ---------- */
@media (max-width:880px){
  .layout{flex-direction:column}
  .sidebar{position:fixed;left:0;top:58px;z-index:38;width:284px;height:calc(100vh - 58px);
    transform:translateX(-104%);transition:transform .25s ease;box-shadow:6px 0 30px rgba(8,12,20,.25)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:24px 20px 80px;max-width:100%;width:100%}
  .menu-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
    color:#cdd6e4;border:1px solid var(--line-dark);font-size:16px}
  .menu-toggle:hover{background:var(--ink-2);color:#fff}
  .brand-sub{display:none}
  .bar{max-width:none}
  .pmeta{display:none}
  .tb-btn.opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle lessons">☰</button>
  <div class="brand"><span class="prompt">&gt;&gt;&gt;</span>PyQuest<span class="brand-sub" id="brandSub">learn by running it</span></div>
  <div class="progress-wrap">
    <div class="bar"><i id="barFill"></i></div>
    <span class="pmeta"><b id="doneCount">0</b> / 22 lessons</span>
  </div>
  <span class="xp" id="xpPill">0 XP</span>
  <div class="topbar-actions">
    <button class="tb-btn opt" id="tmplBtn">Templates</button>
    <button class="tb-btn opt" id="refBtn">Reference</button>
    <button class="tb-btn opt" id="dashBtn">Progress</button>
    <button class="tb-btn" id="guideBtn">Guide</button>
    <button class="tb-btn ai" id="aiBtn">✦ AI Pipeline</button>
    <button class="tb-btn" id="replBtn">&gt;&gt;&gt; REPL</button>
    <button class="tb-btn" id="langBtn">ES</button>
    <button class="tb-btn" id="resetBtn">Reset</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content"></main>
</div>

<div class="repl-drawer" id="replDrawer">
  <div class="repl-head"><span class="prompt">&gt;&gt;&gt;</span> Scratch REPL — run any Python <span class="x" id="replClose">×</span></div>
  <div class="repl-out" id="replOut"><span class="sys"># Type Python below and press Run (Ctrl/Cmd+Enter). State persists while this tab is open.</span></div>
  <div class="repl-in">
    <textarea id="replInput" placeholder="e.g.  sum(range(101))" spellcheck="false"></textarea>
    <button id="replRun">Run</button>
  </div>
</div>

<div class="pystatus" id="pyStatus"><span class="led"></span><span id="pyStatusText">Booting Python…</span></div>

<script>
/* ============ CURRICULUM (injected) ============ */
// PyQuest curriculum — 22 lessons across 3 tracks.
// Each lesson: { id, track, title, min (minutes), concept (HTML), example (py code),
//   exercises: [{ prompt, starter, hint, check }] }
// check kinds:
//   { kind:'output', match:(out)=>bool }      // checks captured stdout
//   { kind:'py', test:`assert ...` }          // runs after user code in same namespace; __output__ holds stdout

const CURRICULUM = [
/* ================= TRACK A — FOUNDATIONS ================= */
{
  id:'a1', track:'Foundations', title:'Running Python & print()', min:25,
  concept:`<p>Python runs top to bottom. The workhorse for showing results is <code>print()</code>.</p>
  <p>You can print several values at once — they're joined with a space — and you can change the separator and the line ending.</p>
  <pre class="cc">print("Hello", "Python")        # Hello Python
print(1, 2, 3, sep="-")         # 1-2-3
print("no newline", end=" ")    # stays on the same line
print("...continued")</pre>
  <p>Anything after <code>#</code> is a comment and is ignored. There's no semicolon needed at the end of a line.</p>`,
  example:`print("Hello, Python!")
print("Today's lesson:", "running code")
print("a", "b", "c", sep=", ")`,
  exercises:[
    { prompt:'Print exactly: <code>Hello, world!</code>', starter:'# Write one print statement\n',
      hint:'print("Hello, world!")', check:{kind:'output', match:o=>o.trim()==='Hello, world!'} },
    { prompt:'Print the three values <code>3</code>, <code>2</code>, <code>1</code> on one line separated by an arrow, like <code>3->2->1</code>',
      starter:'', hint:'Use sep="->" with print(3, 2, 1, sep="->")',
      check:{kind:'output', match:o=>o.trim()==='3->2->1'} },
  ]
},
{
  id:'a2', track:'Foundations', title:'Variables & types', min:30,
  concept:`<p>A variable is a name bound to a value. No declaration keyword — just assign.</p>
  <pre class="cc">name = "Ada"      # str
age  = 36         # int
pi   = 3.14       # float
ok   = True       # bool</pre>
  <p>Python is dynamically typed: the same name can later point to a different type. Inspect a type with <code>type(x)</code>, and convert with <code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code>.</p>
  <pre class="cc">x = "42"
n = int(x) + 1     # 43  (str -> int)
s = str(n)         # "43"</pre>`,
  example:`name = "Ada"
age = 36
print(name, "is", age)
print(type(age))
print(int("10") + int("5"))`,
  exercises:[
    { prompt:'Create a variable <code>celsius = 25</code>, convert it to Fahrenheit (C*9/5 + 32), store it in <code>f</code>, and print <code>f</code>.',
      starter:'celsius = 25\n# compute f and print it\n',
      hint:'f = celsius * 9/5 + 32 ; print(f)',
      check:{kind:'py', test:`assert abs(f - 77.0) < 1e-9, "f should be 77.0 for 25C"`} },
    { prompt:'Given the string <code>qty = "8"</code>, turn it into a number and print double its value (an integer 16).',
      starter:'qty = "8"\n',
      hint:'print(int(qty) * 2)',
      check:{kind:'output', match:o=>o.trim()==='16'} },
  ]
},
{
  id:'a3', track:'Foundations', title:'Numbers & arithmetic', min:25,
  concept:`<p>Operators: <code>+ - * /</code>, plus <code>//</code> (floor division), <code>%</code> (remainder) and <code>**</code> (power).</p>
  <pre class="cc">7 / 2     # 3.5   (always float)
7 // 2    # 3     (floor)
7 % 2     # 1     (remainder)
2 ** 10   # 1024
round(3.14159, 2)   # 3.14</pre>
  <p>Normal math precedence applies; parentheses override it.</p>`,
  example:`print(7 / 2, 7 // 2, 7 % 2)
print(2 ** 8)
print(round(22/7, 3))`,
  exercises:[
    { prompt:'A circle has radius <code>r = 5</code>. Print its area rounded to 2 decimals (use 3.14159 for π).',
      starter:'r = 5\n',
      hint:'print(round(3.14159 * r ** 2, 2))',
      check:{kind:'output', match:o=>o.trim()==='78.54'} },
    { prompt:'You have <code>97</code> minutes. Print how many whole hours and leftover minutes, like <code>1 h 37 m</code>.',
      starter:'mins = 97\n',
      hint:'Use // for hours and % for minutes; print(mins//60, "h", mins%60, "m")',
      check:{kind:'output', match:o=>o.trim()==='1 h 37 m'} },
  ]
},
{
  id:'a4', track:'Foundations', title:'Strings', min:40,
  concept:`<p>Strings support indexing and slicing. Indices start at 0; negative indices count from the end.</p>
  <pre class="cc">s = "python"
s[0]      # 'p'
s[-1]     # 'n'
s[0:3]    # 'pyt'   (start inclusive, stop exclusive)
s[::-1]   # 'nohtyp' (reversed)</pre>
  <p>Build strings with <strong>f-strings</strong> and use methods freely:</p>
  <pre class="cc">name = "ada"
f"Hi {name.title()}, len={len(name)}"   # 'Hi Ada, len=3'
"  trim  ".strip()                       # 'trim'
"a,b,c".split(",")                       # ['a','b','c']
"one two".replace(" ", "_")              # 'one_two'</pre>`,
  example:`s = "python"
print(s[0], s[-1], s[:3], s[::-1])
name = "ada lovelace"
print(f"Hello, {name.title()}!")
print("a,b,c".split(","))`,
  exercises:[
    { prompt:'Given <code>email = "Ada@Example.COM"</code>, print it fully lowercased.',
      starter:'email = "Ada@Example.COM"\n',
      hint:'print(email.lower())',
      check:{kind:'output', match:o=>o.trim()==='ada@example.com'} },
    { prompt:'Given <code>word = "level"</code>, print <code>True</code> if it is a palindrome (reads the same backwards), else <code>False</code>.',
      starter:'word = "level"\n',
      hint:'print(word == word[::-1])',
      check:{kind:'output', match:o=>o.trim()==='True'} },
    { prompt:'Given <code>full = "Joaquin Garcia"</code>, build and print initials with dots: <code>J.G.</code>',
      starter:'full = "Joaquin Garcia"\n',
      hint:'parts = full.split(); print(parts[0][0] + "." + parts[1][0] + ".")',
      check:{kind:'output', match:o=>o.trim()==='J.G.'} },
  ]
},
{
  id:'a5', track:'Foundations', title:'Booleans & comparisons', min:25,
  concept:`<p>Comparisons return <code>True</code>/<code>False</code>: <code>== != &lt; &gt; &lt;= &gt;=</code>. Combine with <code>and</code>, <code>or</code>, <code>not</code>.</p>
  <pre class="cc">3 &lt; 5 and 5 &lt;= 5     # True
not (1 == 2)         # True
"a" in "cat"         # True (membership)</pre>
  <p><strong>Truthiness:</strong> empty things are falsy — <code>0</code>, <code>""</code>, <code>[]</code>, <code>{}</code>, <code>None</code> — everything else is truthy. Python also allows chained comparisons: <code>0 &lt; x &lt; 10</code>.</p>`,
  example:`x = 7
print(0 < x < 10)
print(bool(""), bool("hi"), bool([]), bool([0]))
print("py" in "python")`,
  exercises:[
    { prompt:'Set <code>age = 20</code>. Print <code>True</code> if age is between 18 and 65 inclusive, else <code>False</code>. Use a chained comparison.',
      starter:'age = 20\n',
      hint:'print(18 <= age <= 65)',
      check:{kind:'output', match:o=>o.trim()==='True'} },
    { prompt:'Given <code>s = ""</code>, print <code>"empty"</code> using truthiness in one line (no <code>==</code>). It should print <code>empty</code>.',
      starter:'s = ""\n',
      hint:'print("empty" if not s else "full")',
      check:{kind:'output', match:o=>o.trim()==='empty'} },
  ]
},
{
  id:'a6', track:'Foundations', title:'Conditionals: if / elif / else', min:30,
  concept:`<p>Blocks are defined by <strong>indentation</strong> (4 spaces), not braces. The colon starts a block.</p>
  <pre class="cc">score = 82
if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
else:
    grade = "C"
print(grade)   # B</pre>
  <p>A compact one-line form (ternary): <code>label = "pass" if score >= 60 else "fail"</code>.</p>`,
  example:`for score in (95, 82, 50):
    if score >= 90:
        print(score, "A")

  concept:`<p>Interactive <code>input()</code> isn't ideal in the browser, so we model a game as a pure function — a clean design pattern you can reuse anywhere.</p>

/* ===== PYTHON "HOW IT WORKS" DEEP DIVES (merged into CURRICULUM) ===== */
const PY_DEEP = {
a1:`<p><b>What actually happens when you run code.</b> Python reads your file top to bottom, compiles it to intermediate <em>bytecode</em>, and a virtual machine executes that bytecode one instruction at a time. There is no separate "compile then run" step you manage — it's automatic. In a script, statements run in order; in the interactive REPL, each line is run as you press Enter and the result is echoed. <code>print()</code> is an ordinary <em>function</em> (in Python 3 — it was a statement in Python 2), which is why it needs parentheses.</p>
<p><b>How print really works.</b> <code>print</code> takes any number of arguments, converts each to text by calling <code>str()</code> on it, joins them with the <code>sep</code> string (default a single space), writes the result to the output stream <code>sys.stdout</code>, then writes the <code>end</code> string (default a newline). So <code>print("a","b")</code> is really "str('a') + ' ' + str('b') + '\\n'". Knowing this explains every behaviour: why numbers print without quotes (str of 5 is "5"), how to suppress the newline (<code>end=""</code>), and how to change the separator. <code>print</code> returns <code>None</code> — it's used for its side effect, not its value. A <code>#</code> starts a comment that the compiler discards entirely.</p>`,
a2:`<p><b>Names are labels, not boxes.</b> The single most important mental model in Python: a variable is not a container that holds a value — it is a <em>name bound to an object</em> that lives elsewhere in memory. <code>x = 5</code> creates an integer object <code>5</code> and points the name <code>x</code> at it. <code>y = x</code> doesn't copy anything; it points <code>y</code> at the <em>same</em> object. Every value is an object with three things: a type, a value, and an identity (its address, visible via <code>id()</code>). <code>type(x)</code> asks the object what it is.</p>
<p><b>Dynamic typing and rebinding.</b> The <em>name</em> has no type; the <em>object</em> does. So <code>x = 5</code> then <code>x = "hi"</code> simply re-points <code>x</code> at a different object of a different type — nothing about the original is "changed". This is "dynamic typing". Conversions like <code>int("42")</code> never mutate the original; they build a brand-new object and return it. <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code> are themselves classes, and calling them constructs an instance. Use <code>isinstance(x, int)</code> rather than comparing <code>type(x)==int</code> when you want to respect subclasses.</p>`,
a3:`<p><b>Two different number worlds.</b> Python's <code>int</code> has <em>arbitrary precision</em> — it grows to as many digits as memory allows, so <code>2**1000</code> is exact with no overflow. <code>float</code> is a 64-bit IEEE-754 double, the same hardware format used everywhere, which stores numbers in binary. Because 0.1 has no exact binary representation, <code>0.1 + 0.2</code> is <code>0.30000000000000004</code>, not <code>0.3</code> — this is not a Python bug, it's how floats work in every language. For money, use <code>round()</code> for display or the <code>decimal</code> module for exactness.</p>
<p><b>The division operators, precisely.</b> <code>/</code> always produces a float (<code>6/2</code> is <code>3.0</code>). <code>//</code> is floor division — it rounds toward negative infinity, so <code>-7 // 2</code> is <code>-4</code>, not <code>-3</code>. <code>%</code> returns the remainder, and its sign follows the <em>divisor</em>, so <code>-7 % 2</code> is <code>1</code>. These two are linked: <code>a == (a // b) * b + (a % b)</code> always holds. <code>**</code> is exponentiation. Normal precedence applies (<code>**</code> before <code>* /</code> before <code>+ -</code>); use parentheses to be explicit. <code>x += 1</code> is augmented assignment — shorthand for <code>x = x + 1</code>.</p>`,
a4:`<p><b>Strings are immutable sequences of Unicode.</b> A Python 3 string is a sequence of Unicode code points (so emoji and accents are first-class). Crucially it is <em>immutable</em>: you can never change a character in place. Every "modifying" method — <code>.upper()</code>, <code>.replace()</code>, <code>.strip()</code> — returns a <em>new</em> string and leaves the original untouched. Indexing (<code>s[0]</code>) returns a length-1 string (Python has no separate char type); slicing (<code>s[1:4]</code>) builds a new string with start inclusive, stop exclusive. The step in <code>s[::-1]</code> walks backwards to reverse.</p>
<p><b>Why this matters for performance and f-strings.</b> Because strings are immutable, building one by repeated <code>+=</code> in a loop is O(n²) — each <code>+=</code> copies the whole string so far. The idiom is to collect pieces in a list and <code>"".join(parts)</code> once. <em>f-strings</em> (<code>f"{name} is {age}"</code>) are the modern way to format: the expressions inside the braces are evaluated and converted to text, and the compiler turns the whole thing into efficient formatting calls. You can add format specs (<code>f"{x:.2f}"</code>) and even debug with <code>f"{x=}"</code>.</p>`,
a5:`<p><b>Booleans are integers, and truthiness is everywhere.</b> <code>bool</code> is a subclass of <code>int</code>: <code>True</code> is literally <code>1</code> and <code>False</code> is <code>0</code>, so <code>True + True == 2</code>. Every object has a "truthiness": Python calls <code>__bool__</code> (or falls back to <code>__len__</code>) to decide. The falsy values are <code>False</code>, <code>0</code>, <code>0.0</code>, <code>""</code>, <code>[]</code>, <code>{}</code>, <code>()</code>, <code>None</code> — everything else is truthy. This is why <code>if items:</code> is the idiomatic test for "is this list non-empty".</p>
<p><b>and/or return operands; is vs ==.</b> <code>and</code> and <code>or</code> <em>short-circuit</em> and return one of their operands, not necessarily a bool: <code>a or b</code> returns <code>a</code> if it's truthy else <code>b</code> (the basis of the <code>x = config or default</code> idiom), and <code>a and b</code> returns <code>a</code> if falsy else <code>b</code>. <code>==</code> compares <em>values</em>; <code>is</code> compares <em>identity</em> (same object). Use <code>is</code> only for singletons like <code>None</code>. Chained comparisons such as <code>0 &lt; x &lt; 10</code> are not magic: they desugar to <code>0 &lt; x and x &lt; 10</code>, evaluating <code>x</code> only once.</p>`,
a6:`<p><b>Indentation is the syntax.</b> Where other languages use braces, Python uses <em>indentation</em> to define blocks — this is enforced by the compiler, not just style. The colon ends the header line and opens a block; everything indented by the same amount (use 4 spaces, never mix tabs) belongs to it. This forces readable structure but means a stray space is a real error. <code>if</code> / <code>elif</code> / <code>else</code> test conditions in order and run the first truthy branch; only one branch runs.</p>
<p><b>Expressions vs statements, and the alternatives.</b> The conditional <em>expression</em> <code>"pass" if score &gt;= 60 else "fail"</code> produces a value (useful inside assignments and comprehensions), whereas an <code>if</code> <em>statement</em> directs control flow. Conditions reuse truthiness, so <code>if name:</code> works without an explicit comparison. <code>pass</code> is a do-nothing placeholder for an empty block. Since 3.10 Python also has structural <code>match/case</code> for pattern matching, but <code>if/elif/else</code> remains the everyday tool.</p>`,
a7:`<p><b>What a list is, mechanically.</b> A list is a dynamic array of <em>references</em> to objects, stored contiguously and over-allocated so that <code>append</code> is O(1) on average (occasionally it copies to a bigger buffer). Because it stores references, a list can hold mixed types and the same object can appear twice. <code>insert(0, x)</code> and <code>remove</code>/<code>pop(0)</code> at the front are O(n) because every later element shifts — for queue-like work use <code>collections.deque</code>.</p>
<p><b>Aliasing is the classic trap.</b> Lists are <em>mutable</em>, and assignment never copies. <code>b = a</code> makes <code>b</code> another name for the same list, so <code>b.append(1)</code> also changes <code>a</code>. To copy, use <code>a[:]</code> or <code>list(a)</code> (a shallow copy — the outer list is new but the elements are still shared) or <code>copy.deepcopy</code> for full independence. Slicing always returns a new list. <code>sorted(xs)</code> returns a new sorted list; <code>xs.sort()</code> sorts in place and returns <code>None</code> — a frequent source of "why is my list None?" bugs.</p>`,
a8:`<p><b>for is really iteration over an iterator.</b> <code>for x in thing</code> doesn't use indices — Python calls <code>iter(thing)</code> to get an <em>iterator</em>, then repeatedly calls <code>next()</code> on it until it raises <code>StopIteration</code>. This is why the same <code>for</code> loop works over lists, strings, files, dicts and generators alike. <code>range(start, stop, step)</code> is not a list — it's a lazy sequence object that computes numbers on demand, so <code>range(10**9)</code> uses almost no memory.</p>
<p><b>The useful extras.</b> <code>enumerate(xs)</code> yields <code>(index, value)</code> pairs so you rarely need manual counters; <code>zip(a, b)</code> walks several sequences in lockstep and stops at the shortest. <code>break</code> exits the loop entirely; <code>continue</code> skips to the next iteration. Loops can have an <code>else</code> clause that runs only if the loop finished <em>without</em> a <code>break</code> — handy for search-and-not-found logic. A real pitfall: never add to or remove from a list while iterating over it; iterate over a copy (<code>for x in xs[:]</code>) or build a new list instead.</p>`,
a9:`<p><b>Tuples: immutable, hashable, meaningful.</b> A tuple is like a list you cannot change after creation. Immutability buys two things: it signals "this is a fixed record" (e.g. a coordinate), and — if all its elements are themselves hashable — it can be used as a dictionary key or set element, which a list never can. Tuple <em>packing</em> and <em>unpacking</em> power multiple assignment (<code>x, y = point</code>) and the clean swap <code>a, b = b, a</code> (the right side is built as a tuple first, then unpacked).</p>
<p><b>Sets are hash tables.</b> A set stores only <em>unique, hashable</em> elements in a hash table, giving average O(1) membership tests — vastly faster than scanning a list with <code>in</code>. Sets are unordered (don't rely on iteration order) and support real set algebra: union <code>|</code>, intersection <code>&amp;</code>, difference <code>-</code>, symmetric difference <code>^</code>. The most common everyday use is de-duplication: <code>set(xs)</code> removes repeats. <code>frozenset</code> is the immutable, hashable version you can nest inside other sets or use as a key.</p>`,
a10:`<p><b>The dictionary is Python's powerhouse.</b> A dict maps <em>keys</em> to <em>values</em> using a hash table: it computes <code>hash(key)</code> to find a slot, giving average O(1) insertion and lookup regardless of size. This is why dicts are everywhere — objects' attributes, namespaces and JSON are all dict-like under the hood. Keys must be <em>hashable</em> (immutable-ish): strings, numbers and tuples work; lists and dicts cannot be keys because their contents (and hash) could change.</p>
<p><b>Access patterns and ordering.</b> <code>d[k]</code> raises <code>KeyError</code> if the key is missing; <code>d.get(k, default)</code> returns a fallback instead — the safe choice when a key may be absent. <code>d.setdefault</code> and <code>collections.defaultdict</code> help build nested structures. The counting idiom <code>d[w] = d.get(w, 0) + 1</code> is the manual version of <code>Counter</code>. Iterating a dict yields its keys; use <code>.items()</code> for key/value pairs and <code>.values()</code> for values. Since Python 3.7 dicts preserve <em>insertion order</em>, which you can rely on.</p>`,
a11:`<p><b>def builds an object; arguments pass by reference.</b> <code>def f(...)</code> creates a function <em>object</em> and binds it to the name <code>f</code> — functions are first-class values you can pass around and store. Arguments are passed "by object reference" (sometimes called pass-by-assignment): the parameter name inside the function points at the <em>same</em> object the caller passed. So mutating a passed-in list is visible to the caller, but rebinding the parameter (<code>x = something</code>) only changes the local name. A function with no <code>return</code> returns <code>None</code>.</p>
<p><b>Parameters, and the mutable-default trap.</b> Parameters can be positional or keyword, with defaults (<code>greeting="Hello"</code>); <code>*args</code> collects extra positional arguments into a tuple and <code>**kwargs</code> collects extra keyword arguments into a dict. A famous gotcha: default values are evaluated <em>once, when the function is defined</em>, not on each call — so <code>def f(items=[])</code> shares one list across all calls. The fix is <code>def f(items=None): items = items or []</code>. Names assigned inside a function are <em>local</em>; lookup follows the LEGB rule (Local, Enclosing, Global, Built-in).</p>`,
a12:`<p><b>Comprehensions are compiled loops, not just sugar.</b> A list comprehension <code>[expr for x in it if cond]</code> builds the list with a tight, optimised loop that runs faster than manually appending in a Python <code>for</code> loop, and reads as one declarative line: "the expr, for each x in it, where cond". The same shape makes set comprehensions <code>{...}</code> and dict comprehensions <code>{k: v for ...}</code>. In Python 3 the loop variable does <em>not</em> leak into the surrounding scope (it did in Python 2).</p>
<p><b>Lazy cousins: generator expressions.</b> Swap the brackets for parentheses and you get a <em>generator expression</em> — <code>sum(x*x for x in range(1000000))</code> — which computes values one at a time instead of building a giant list, so it uses almost no memory. Reach for a comprehension when the result is a small/medium collection you'll reuse, and a generator expression when you're streaming through a large or infinite sequence once. Don't over-nest: if a comprehension needs two <code>for</code> clauses and a condition, a plain loop is often clearer.</p>`,
a13:`<p><b>Exceptions are objects that travel up the stack.</b> When something goes wrong Python creates an exception <em>object</em> and "raises" it; that exception propagates up through the calling functions until some <code>except</code> catches it, or it reaches the top and stops the program with a traceback. <code>try</code> guards a block; <code>except SomeError</code> handles a matching type (catch specific types, not bare <code>except</code>); <code>else</code> runs only if no exception occurred; <code>finally</code> always runs (cleanup), even if an exception or <code>return</code> happened. Exceptions form a hierarchy under <code>BaseException</code>, so <code>except ValueError</code> also catches its subclasses.</p>
<p><b>EAFP — the Pythonic style.</b> Python favours "Easier to Ask Forgiveness than Permission": just try the operation and handle the exception, rather than checking everything first (LBYL — "Look Before You Leap"). So <code>try: return int(s) except ValueError: return -1</code> is idiomatic. <code>raise ValueError("message")</code> signals your own errors; you can define custom exception classes by subclassing <code>Exception</code>. Use exceptions for genuinely exceptional conditions, and keep <code>try</code> blocks small so you catch only what you mean to.</p>`,
b14:`<p><b>What import actually does.</b> The first time you <code>import math</code>, Python finds the module, <em>executes its top-level code once</em>, builds a module object, and caches it in <code>sys.modules</code>. Every later import of the same module just hands back the cached object — so imports are cheap after the first and module-level side effects run only once. <code>import math</code> binds the name <code>math</code> (you then write <code>math.sqrt</code>); <code>from math import sqrt</code> binds <code>sqrt</code> directly into your namespace. Each module is its own namespace, which prevents name clashes.</p>
<p><b>Batteries included.</b> The standard library is huge and worth knowing: <code>math</code> and <code>random</code>, <code>datetime</code> for dates, <code>collections</code> (<code>Counter</code>, <code>defaultdict</code>, <code>deque</code>), <code>itertools</code> for iterator algebra, <code>json</code>, <code>os</code>/<code>pathlib</code>, <code>re</code> for regex. Reaching for the stdlib before writing your own is a hallmark of good Python. The <code>if __name__ == "__main__":</code> guard lets a file act both as an importable module and as a runnable script, because <code>__name__</code> is <code>"__main__"</code> only when the file is run directly.</p>`,
b15:`<p><b>A class is a factory for objects.</b> <code>class Account:</code> defines a new <em>type</em>. Calling it (<code>Account("Ada")</code>) creates an <em>instance</em>; Python allocates the object and calls <code>__init__</code> to set it up. <code>self</code> is just the instance, passed explicitly as the first parameter of every method — there's no hidden "this". Instance data lives in the object's own <code>__dict__</code>; methods are functions stored on the class. When you access <code>obj.x</code>, Python looks on the instance first, then the class, then its base classes following the Method Resolution Order (MRO).</p>
<p><b>Inheritance and dunder methods.</b> A subclass (<code>class Puppy(Dog)</code>) inherits and can override behaviour; <code>super().__init__(...)</code> calls the parent's version. The real power is "dunder" (double-underscore) methods that hook into language syntax: <code>__init__</code> for construction, <code>__str__</code>/<code>__repr__</code> for printing, <code>__len__</code>, <code>__eq__</code>, <code>__add__</code> for <code>+</code>, <code>__getitem__</code> for indexing, and so on. Implementing them makes <em>your</em> objects behave like built-in ones. This is why "everything is an object" is literally true in Python — even functions and classes are objects with types.</p>`,
b16:`<p><b>The iterator protocol underneath every loop.</b> An <em>iterable</em> is anything with <code>__iter__</code> that returns an <em>iterator</em>; an iterator has <code>__next__</code> that returns the next item or raises <code>StopIteration</code>. <code>for</code>, <code>list()</code>, <code>sum()</code> and unpacking all speak this protocol. Iterators are one-shot: once exhausted, they're empty. Understanding this explains why a file or a <code>zip</code> can be looped only once, and why <code>list(it)</code> "uses up" a generator.</p>
<p><b>Generators: pausable functions.</b> A function containing <code>yield</code> is a <em>generator function</em>: calling it doesn't run the body, it returns a generator object. Each <code>next()</code> runs the body until the next <code>yield</code>, hands back that value, and <em>freezes the function's entire state</em> (local variables, position) until resumed. This makes generators lazy and memory-light — you can model an infinite sequence (<code>while True: yield n; n += 1</code>) because values are produced on demand, never all at once. Generator <em>expressions</em> are the inline form, and the <code>itertools</code> module is a toolbox of ready-made iterators.</p>`,
b17:`<p><b>Functions are objects; closures capture variables.</b> Because functions are first-class, you can define one inside another and return it. The inner function "remembers" variables from the enclosing scope even after the outer function has returned — that bundle is a <em>closure</em>, and Python stores those captured variables in special <em>cell</em> objects (referenced by name, not copied by value, which causes the classic late-binding loop pitfall where all closures see the final loop value). <code>multiplier(2)</code> returning a <code>mult</code> that uses <code>factor</code> is a closure over <code>factor</code>.</p>
<p><b>Decorators are functions that wrap functions.</b> A decorator takes a function and returns a replacement — usually a <em>wrapper</em> that adds behaviour before/after calling the original. The <code>@decorator</code> line above a <code>def</code> is pure syntax sugar for <code>f = decorator(f)</code>. Use <code>*args, **kwargs</code> in the wrapper so it works for any signature, and <code>functools.wraps</code> to copy the original's name and docstring onto the wrapper. Decorators power logging, timing, caching (<code>functools.lru_cache</code>), access control and route registration in frameworks — anywhere you want to add a cross-cutting concern without editing the function itself.</p>`,
b18:`<p><b>Lambdas and functions as arguments.</b> <code>lambda x: x*2</code> is a small anonymous function written as a single expression — handy when you need a throwaway function to pass somewhere. Because functions are first-class, many built-ins take a function argument: <code>sorted(xs, key=fn)</code> sorts by the value <code>fn</code> returns (Python decorates each item with its key, sorts, then undecorates — and the sort, Timsort, is <em>stable</em>, preserving the order of equal keys). <code>map(fn, xs)</code> and <code>filter(pred, xs)</code> return lazy iterators that apply a function across a sequence.</p>
<p><b>When to use which.</b> <code>map</code>/<code>filter</code> are fine, but a comprehension is usually more readable for the same job (<code>[f(x) for x in xs]</code> vs <code>map(f, xs)</code>); reach for <code>map</code>/<code>filter</code> when you already have a named function. <code>zip</code> pairs sequences; <code>any()</code> and <code>all()</code> short-circuit over a boolean iterable. A common, powerful pattern is <code>sorted(records, key=lambda r: r[1])</code> to sort tuples or objects by a field. Keep lambdas tiny — if it needs a statement or is reused, write a real <code>def</code>.</p>`,
b19:`<p><b>JSON is text; Python objects are not.</b> The <code>json</code> module bridges the two: <code>json.dumps(obj)</code> <em>serialises</em> a Python value (dicts, lists, strings, numbers, booleans, None) into a JSON <em>string</em>, and <code>json.loads(text)</code> <em>parses</em> a JSON string back into Python objects. The type mapping is direct (dict⇄object, list⇄array, None⇄null, True⇄true). Round-tripping is lossy for types JSON can't express (tuples become lists, sets and custom objects need custom encoders). This is how programs exchange structured data over files and the network.</p>
<p><b>Context managers guarantee cleanup.</b> The <code>with</code> statement manages a resource's lifetime: <code>with open("f") as fh:</code> calls the object's <code>__enter__</code> on entry and — crucially — its <code>__exit__</code> on exit, <em>even if an exception is raised</em>. For files this guarantees the handle is closed and buffers flushed, which matters because relying on garbage collection to close files is non-deterministic. Any object can be a context manager by implementing those two dunder methods, or you can build one quickly with <code>contextlib.contextmanager</code>. The pattern generalises to locks, database transactions and timers — anything with a "set up, then always tear down" shape.</p>`,
c20:`<p><b>Why this design.</b> A text analyser is the first place several tools combine: string methods to normalise and split, a loop or comprehension to process tokens, and a dictionary to accumulate counts. Lowercasing first (<code>text.lower()</code>) folds "The" and "the" together; <code>split()</code> with no argument splits on any run of whitespace and discards empties, which is more robust than <code>split(" ")</code>. The manual counting idiom is <code>counts[w] = counts.get(w, 0) + 1</code>.</p>
<p><b>How Counter helps.</b> <code>collections.Counter</code> is a dict subclass purpose-built for this: <code>Counter(words)</code> tallies in one line, missing keys return <code>0</code> instead of raising, and <code>.most_common(n)</code> returns the top items already sorted by frequency (it uses a heap internally). It also supports arithmetic between counters. Reaching for <code>Counter</code> instead of hand-rolling a dict is the Pythonic move once you recognise a "count the things" problem — and it scales cleanly to word frequencies, log analysis, or tallying categories.</p>`,
c21:`<p><b>Modelling state as pure functions.</b> A "state machine" tracks where you are and how inputs move you between states. The cleanest, most testable way to express one step is a <em>pure function</em>: given the current state and an input, return the result with no side effects. <code>step(secret, guess)</code> returning "low"/"high"/"correct" is pure — same inputs always give the same output — so it's trivial to unit-test, exactly how the checker here verifies it.</p>
<p><b>Why avoid input() here, and what to do instead.</b> Interactive <code>input()</code> blocks waiting for the keyboard and behaves awkwardly in a browser sandbox, so we design the logic as functions that take their "inputs" as arguments and a driver that feeds a list of moves (<code>play(secret, guesses)</code>). This separation — pure logic from I/O — is a broadly valuable habit: it keeps the testable core independent of how data arrives (keyboard, file, web request), which is the same principle behind clean architecture in larger systems.</p>`,
c22:`<p><b>Parsing and accumulating by hand.</b> Before reaching for pandas it's worth doing a small data job in plain Python, because it shows what the libraries do for you. <code>raw.splitlines()</code> breaks text into rows; <code>line.split(",")</code> breaks a row into fields; tuple unpacking <code>name, dept, salary = ...</code> names them; <code>int(salary)</code> converts the text to a number. You then <em>accumulate</em> into a dict with the <code>totals[dept] = totals.get(dept, 0) + value</code> idiom — the universal group-and-sum pattern.</p>
<p><b>From hand-rolled to libraries.</b> This is exactly the "split, parse, aggregate" loop that <code>csv</code>, <code>collections.Counter</code> and ultimately pandas <code>groupby</code> automate. Recognising the pattern in raw form means that when you later write <code>df.groupby("dept")["salary"].sum()</code> you understand it's doing the same accumulation, just vectorised and faster. Building it once by hand also makes you appreciate edge cases the libraries handle for you: quoted fields, missing values, type coercion and headers.</p>`,
d23:`<p><b>Why NumPy is fast: the ndarray.</b> A Python list holds pointers to separate, boxed objects scattered in memory. A NumPy <code>ndarray</code> instead stores a single, contiguous block of <em>raw, same-type</em> values (the <code>dtype</code>, e.g. float64) described by a <code>shape</code> and <code>strides</code>. Operations like <code>a * 2</code> or <code>a.mean()</code> run as compiled C loops over that block — "vectorised" — with no per-element Python overhead, so they're often 10–100× faster than a Python loop and use far less memory.</p>
<p><b>Vectorisation, broadcasting, views.</b> You express computation on whole arrays rather than element by element: <code>a + b</code>, <code>np.sqrt(a)</code>, <code>a.sum(axis=0)</code>. <em>Broadcasting</em> lets arrays of different but compatible shapes combine (a scalar with an array, a row with a matrix) by virtually stretching the smaller one — no copies. Beware the views-vs-copies distinction: basic slicing returns a <em>view</em> sharing memory (changing it changes the original), while fancy/boolean indexing returns a copy. <code>np.std</code> defaults to the population standard deviation (ddof=0).</p>`,
d24:`<p><b>Boolean masks, mechanically.</b> A comparison on an array is itself vectorised: <code>a &gt; 10</code> produces a same-shape array of <code>True</code>/<code>False</code>. Passing that boolean array back as an index (<code>a[a &gt; 10]</code>) selects exactly the elements where the mask is <code>True</code> — this is "boolean indexing" and it's the workhorse of array filtering. <code>(a &gt; 10).sum()</code> counts matches because <code>True</code> sums as 1. <code>np.where(cond, x, y)</code> picks element-wise from <code>x</code> or <code>y</code> by the condition — a vectorised if/else.</p>
<p><b>Axes are the key idea in N dimensions.</b> For a 2-D array, <code>axis=0</code> runs <em>down</em> the rows (collapsing rows → one value per column) and <code>axis=1</code> runs <em>across</em> the columns (one value per row). Getting axes right is most of the skill in NumPy/pandas aggregation. Boolean and fancy indexing return copies (safe to modify without touching the source); plain slices return views (fast, but edits propagate). Internalising masks + axes lets you replace almost every elementwise loop with a single fast expression.</p>`,
d25:`<p><b>What a DataFrame is.</b> A pandas <code>DataFrame</code> is essentially an ordered dict of columns, where each column is a <code>Series</code> — a NumPy-backed array plus a shared <em>index</em> (the row labels). So a DataFrame is columnar and typed per column, which is why column operations are vectorised and fast. The index is not just row numbers; it's a first-class labelled axis you can align and join on. Selecting <code>df["units"]</code> returns the Series for that column.</p>
<p><b>Label vs position, and the copy warning.</b> Two ways to select: <code>.loc[]</code> works by <em>label</em> (index/column names) and <code>.iloc[]</code> by <em>integer position</em>; mixing them up is a common bug. Filtering with a boolean Series (<code>df[df["units"] &gt; 100]</code>) is the same boolean-mask idea as NumPy, lifted to rows. Vectorised column math (<code>df["rev"] = df["units"] * df["price"]</code>) avoids loops entirely. Watch for <code>SettingWithCopyWarning</code>: it warns that you may be assigning to a temporary slice rather than the original frame — use <code>.loc</code> for assignments to be safe.</p>`,
d26:`<p><b>Split–apply–combine.</b> <code>groupby</code> implements a three-step pattern: <em>split</em> the rows into groups by the key column(s), <em>apply</em> an aggregation (sum, mean, count, a custom function) to each group independently, and <em>combine</em> the results into a new Series or DataFrame indexed by the group keys. <code>df.groupby("region")["sales"].sum()</code> returns a Series whose index is the regions and whose values are the per-region totals. It's the tabular equivalent of the manual dict-accumulation loop, but vectorised.</p>
<p><b>The toolbox around it.</b> <code>.agg()</code> applies several aggregations at once or different ones per column; <code>.to_dict()</code> turns a grouped Series into a plain dict; <code>.idxmax()</code> returns the index label (e.g. the region) of the maximum value, which is how you answer "which group is biggest" without manual scanning; <code>.sort_values()</code> orders results for presentation. <code>value_counts()</code> is a shortcut for grouping-and-counting a single column. Most real analyses are a pipeline of filter → groupby → aggregate → sort.</p>`,
d27:`<p><b>From records to insight.</b> A very common real shape is a list of dict "records"; <code>pd.DataFrame(records)</code> turns it straight into a table with columns inferred from the keys. From there the analysis is a short, readable pipeline: add a derived column (<code>df["revenue"] = df["units"] * df["price"]</code>), aggregate (<code>df["revenue"].sum()</code>, <code>groupby(...).sum()</code>), and pick out answers (<code>.idxmax()</code>). Each step returns a new object, so you can chain or inspect intermediate results.</p>
<p><b>Why method chaining matters.</b> Experienced pandas users write analyses as chains — <code>df.assign(rev=...).groupby("region")["rev"].sum().sort_values()</code> — because each call returns a DataFrame/Series, keeping logic linear and avoiding throwaway variables. The same discipline that made the hand-rolled pipeline in the Foundations track readable applies here, just expressed in vectorised pandas. Building a small KPI function like <code>analyze(records)</code> packages this pipeline behind a clean interface you can test and reuse.</p>`,
d28:`<p><b>Reading data in.</b> <code>pd.read_csv</code> parses delimited text into a DataFrame, inferring a dtype per column (numbers become int/float, the rest stays object/string). When the CSV lives in a string rather than a file, wrap it in <code>io.StringIO</code> so pandas can read it like a file — useful for tests, APIs and embedded data. From there a derived column (<code>revenue = units * price</code>) and grouped aggregations answer the business questions, exactly as in a real exploratory analysis.</p>
<p><b>The everyday EDA loop.</b> Load → inspect (<code>.head()</code>, <code>.info()</code>, <code>.describe()</code>) → clean/derive → group/aggregate → visualise. This case compresses that loop: build revenue, total it, break it down by region and by product, and identify the top contributor with <code>idxmax</code>. The same five moves scale from this eight-row sample to millions of rows, which is why pandas became the default tool for commercial analytics before any modelling begins.</p>`,
v29:`<p><b>matplotlib's object model.</b> A chart is a tree of <em>Artists</em>: a <code>Figure</code> (the whole canvas) contains one or more <code>Axes</code> (a single plot with its own x/y), and each Axes contains lines, bars, text, ticks and legends. <code>fig, ax = plt.subplots()</code> creates both and hands you the <code>ax</code> to draw on. There are two ways to use matplotlib: the stateful <code>plt.</code> interface (quick, implicit "current axes") and the explicit object-oriented interface where you call methods on <code>ax</code> — the latter is preferred for anything reusable because it's unambiguous about <em>which</em> plot you mean.</p>
<p><b>Why we pass <code>ax</code>, and how it renders.</b> Writing functions that take an <code>ax</code> argument (<code>def draw(ax, ...)</code>) lets the caller decide where the plot goes — one chart, a grid of subplots, or a dashboard — which is exactly why the exercises here check the <code>ax</code> you drew on. Under the hood matplotlib uses a <em>backend</em> to turn Artists into pixels; the Agg backend renders to a raster image (PNG), which is how these charts appear inline. Labels and titles (<code>ax.set_title</code>, <code>ax.set_ylabel</code>) aren't decoration — an unlabelled chart is unreadable, so they're part of doing it correctly.</p>`,
v30:`<p><b>Aggregate, then visualise.</b> Most business charts are a two-step move: use pandas to reduce raw rows to a small summary (<code>df.groupby("region")["sales"].sum()</code>), then hand the summary's index and values to a matplotlib bar chart. Sorting the summary (<code>.sort_values(ascending=False)</code>) before plotting turns a jumble into a ranked, instantly readable chart — small touches like ordering and labelling are what separate a useful figure from a confusing one.</p>
<p><b>Choosing the encoding.</b> Match the chart to the question: bars compare categories, lines show change over time, histograms show a distribution, scatter shows relationship between two variables. Wrapping the plotting logic in a function that takes an <code>ax</code> (as the exercise does) makes it reusable across reports and composable into multi-panel dashboards. This pandas-to-matplotlib pipeline is the visual end of the same EDA loop — and it connects directly to the LEAN side of this app, where a Pareto chart or run chart is just this pattern applied to quality data.</p>`,
};

/* ===== 1. HOUSE OF LEAN ===== */
{
  id:'l1', area:'lean', track:'Foundations', title:'The Toyota Production System & the House of Lean', min:35,
  concept:`<p>Lean is a way of running an operation that aims to deliver the most value to the customer with the least waste, time and effort. It grew out of the <strong>Toyota Production System (TPS)</strong> in post-war Japan and was later named "Lean" by Western researchers.</p>
  <p>The classic picture is a house. You can only build it bottom-up:</p>
  <ul>
    <li><b>Foundation</b> — stability and <em>standardised work</em>, plus <em>heijunka</em> (levelling). Nothing stands without a stable base.</li>
    <li><b>Two pillars</b> — <em>Just-in-Time</em> (make only what's needed, when it's needed, in the amount needed) and <em>Jidoka</em> (build quality in; stop and fix problems the moment they appear).</li>
    <li><b>The roof / goal</b> — best quality, lowest cost, shortest lead time, highest safety and morale.</li>
    <li><b>At the centre</b> — people and continuous improvement (kaizen). The system runs on engaged people, not just tools.</li>
  </ul>
  <p>The single biggest idea: improve the <em>flow</em> of the whole system, not the speed of isolated steps.</p>`,
  deep:`<p><b>Origins.</b> TPS was developed mainly by Taiichi Ohno and Eiji Toyoda at Toyota from the late 1940s. Two outside ideas seeded it: Henry Ford's moving assembly line (continuous flow) and the American supermarket (customers pull goods off a shelf, which is then replenished — the model for pull and kanban). W. Edwards Deming's teaching on quality and variation in Japan was a third influence. The word "Lean" itself came later: John Krafcik coined it in 1988, and it was popularised by Womack, Jones &amp; Roos in <em>The Machine That Changed the World</em> (1990), the MIT IMVP study that contrasted Toyota's performance with mass production.</p>
  <p><b>The two pillars, precisely.</b> <em>Just-in-Time</em> is the flow pillar: continuous flow, pull, and takt-paced production so inventory and lead time collapse. <em>Jidoka</em> ("autonomation", or automation with a human touch) is the quality pillar: machines and people detect abnormalities and <em>stop</em> immediately so defects never pass downstream and the root cause gets fixed. JIT exposes problems by removing the inventory that hides them; Jidoka makes you solve them. They reinforce each other.</p>
  <p><b>The foundation matters more than people think.</b> You cannot run JIT pull on an unstable process. Stability of the 4Ms (Man, Machine, Material, Method), standardised work, and heijunka (levelled volume and mix) are prerequisites. Trying to "do pull" on a chaotic process just moves the chaos around faster.</p>
  <p><b>System over tools.</b> The most common failure mode is "tool-head" Lean — running 5S events and kaizen blitzes as disconnected point improvements while the value stream still doesn't flow. Toyota people distinguish <em>point kaizen</em> (improve one step) from <em>flow kaizen</em> (improve how the whole stream connects); leaders are expected to lead flow kaizen. In 2001 Toyota codified "The Toyota Way" on two pillars of its own: <em>Continuous Improvement</em> and <em>Respect for People</em> — a reminder that Lean is a people-development system, not a cost-cutting program. Mistaking Lean for headcount reduction is the surest way to kill it, because the improvement engine is the very people you would be cutting.</p>`,
  exercises:[
    { type:'mcq', prompt:'Foundations check.',
      questions:[
        { text:'The two pillars of the Toyota Production System are…', options:['Just-in-Time and Jidoka','5S and Kaizen','Six Sigma and TQM','MRP and ERP'], correct:0 },
        { text:'In the House of Lean, what forms the foundation?', options:['The customer','Stability, standardised work and heijunka','Quarterly profit','Andon cords'], correct:1 },
        { text:'Two real-world systems that inspired TPS were…', options:['Ford\u2019s assembly line and the American supermarket','The internet and ERP','Six Sigma and ISO 9001','Agile and Scrum'], correct:0 },
        { text:'A common and damaging misconception is that Lean is primarily…', options:['A way to build quality in','A headcount-reduction / cost-cutting program','About improving flow','A people-development system'], correct:1 },
      ],
      solution:`<p>JIT + Jidoka are the pillars; stability, standardised work and heijunka are the foundation; the supermarket and Ford's line were direct inspirations; and treating Lean as a layoff program destroys the improvement engine — its people.</p>` },

/* ===== 2. VALUE & THE 8 WASTES ===== */
{
  id:'l2', area:'lean', track:'Foundations', title:'Value & the 8 Wastes (DOWNTIME)', min:35,
  concept:`<p>Lean starts with one question: <strong>does this step add value the customer would willingly pay for?</strong> If not, it's waste to reduce or remove. Womack &amp; Jones framed five principles: define <em>value</em>, map the <em>value stream</em>, create <em>flow</em>, let the customer <em>pull</em>, pursue <em>perfection</em>.</p>
  <p>Toyota names three enemies: <strong>Muda</strong> (waste), <strong>Mura</strong> (unevenness) and <strong>Muri</strong> (overburden). The eight wastes spell <strong>DOWNTIME</strong>:</p>
  <ul>
    <li><b>D</b>efects — rework, scrap, corrections</li>
    <li><b>O</b>verproduction — making more or sooner than needed</li>
    <li><b>W</b>aiting — idle time between steps</li>
    <li><b>N</b>on-utilised talent — unused skills, ideas, judgement</li>
    <li><b>T</b>ransportation — moving material/information unnecessarily</li>
    <li><b>I</b>nventory — work piled up between steps</li>
    <li><b>M</b>otion — unnecessary movement of people</li>
    <li><b>E</b>xtra-processing — doing more than the customer needs</li>
  </ul>
  <p>In most processes, value-add is a tiny slice of total time — which is why mapping reveals so much.</p>`,
  deep:`<p><b>Three kinds of activity.</b> Practitioners don't split work simply into "value" and "waste". They use three buckets: <em>value-adding</em> (the customer would pay for it and it transforms the product/service), <em>necessary non-value-adding</em> (Type 1 muda — wasteful but currently required, e.g. a regulatory inspection or a legally mandated check), and <em>pure waste</em> (Type 2 muda — eliminate now). The discipline is attacking Type 2 immediately while reducing Type 1 over time by changing the process or constraints. Confusing the two leads to either paralysis or recklessly cutting necessary controls.</p>
  <p><b>The 3M causal chain.</b> Mura (unevenness) and Muri (overburden) are usually the <em>causes</em>; Muda (waste) is the <em>symptom</em>. Lumpy demand or an unlevelled schedule (Mura) forces people and machines to sprint then idle (Muri), which generates rework, waiting and inventory (Muda). Teams that only chase visible Muda keep firefighting; teams that level the work (heijunka) and design sustainable workloads remove the source.</p>
  <p><b>Ohno's hierarchy.</b> Ohno's original list had seven wastes, and he considered <em>overproduction the worst</em> — the "root of all evil" — because making too much, too soon hides every other waste: it creates inventory, which creates transport and motion, masks defects (they're buried in a batch), and fills the time that would otherwise expose waiting. The 8th waste, non-utilised human talent, was a later (largely Western) addition reflecting the Respect-for-People pillar. In knowledge work the dominant wastes are usually waiting (queues, approvals), defects (rework loops) and extra-processing (gold-plating, redundant reports).</p>
  <p><b>How experts find it.</b> Go to the gemba (the actual place), follow one unit end-to-end, and time it. A "waste walk" plus the value-stream timeline (process time vs lead time) quantifies the opportunity. Beware local optimisation: speeding up a non-bottleneck step adds zero throughput and often <em>increases</em> overproduction and inventory.</p>`,
  exercises:[
    { type:'mcq', prompt:'Classify each scenario into the single best-fit waste.',
      questions:[
        { text:'Completed orders sit 8 hours before anyone ships them.', options:['Waiting','Defects','Motion','Overprocessing'], correct:0 },
        { text:'A six-month stockpile of printed brochures in a warehouse.', options:['Transportation','Inventory','Overproduction','Motion'], correct:1 },
        { text:'Staff re-key the same data into three separate systems.', options:['Defects','Overproduction','Extra-processing','Waiting'], correct:2 },
        { text:'A senior analyst spends the day photocopying files.', options:['Non-utilised talent','Motion','Inventory','Defects'], correct:0 },
        { text:'10% of finished units fail inspection and are reworked.', options:['Overproduction','Defects','Waiting','Transportation'], correct:1 },
        { text:'Reports are printed daily that nobody has requested.', options:['Inventory','Motion','Overproduction','Defects'], correct:2 },
      ],
      solution:`<p>Waiting, Inventory, Extra-processing, Non-utilised talent, Defects, Overproduction. Several touch more than one waste — name the <em>root</em> so the countermeasure hits the cause.</p>` },
    { type:'mcq', prompt:'Deep-dive concepts.',
      questions:[
        { text:'A regulatory inspection the customer won\u2019t pay for but the law requires is best classified as…', options:['Value-adding','Type 1 muda (necessary non-value-adding)','Type 2 muda (pure waste)','Not waste at all'], correct:1 },
        { text:'Ohno considered which waste the worst, because it hides the others?', options:['Motion','Overproduction','Transportation','Waiting'], correct:1 },
        { text:'In the 3M model, Muda is usually the…', options:['Root cause','Symptom of Mura and Muri','Same as Muri','Opposite of value'], correct:1 },
      ],
      solution:`<p>Necessary-but-non-value-adding work is Type 1 muda (reduce over time); overproduction is the worst waste; and Muda is typically the symptom of upstream Mura (unevenness) and Muri (overburden).</p>` },
  ]
},

/* ===== 3. STANDARDIZED WORK & HEIJUNKA ===== */
{
  id:'l3', area:'lean', track:'Foundations', title:'Standardised Work & Heijunka', min:35,
  concept:`<p><strong>Standardised work</strong> is the current, agreed best way to do a task — written down and followed by everyone. Ohno's line is famous: <em>"Without a standard there can be no kaizen."</em> You can only improve from a known baseline; otherwise every shift does it differently and you can't tell what change helped.</p>
  <p>It has three elements: <em>takt time</em> (the pace), the <em>work sequence</em> (the order of steps), and <em>standard WIP</em> (the minimum in-process stock needed to keep flow).</p>
  <p><strong>Heijunka</strong> means <em>levelling</em>. Instead of making product in big lumpy batches that chase orders, you smooth both the <em>volume</em> and the <em>mix</em> so the system faces a steady, predictable demand. Level production is calmer, needs less buffer, and exposes problems sooner.</p>`,
  deep:`<p><b>Standardised work is a paradox, on purpose.</b> You standardise not to freeze the process but to make improvement possible and visible. The cycle is <em>SDCA then PDCA</em>: Standardise-Do-Check-Act to stabilise, then Plan-Do-Check-Act to improve — and the improvement becomes the new standard. Crucially, the standard is owned by the people doing the work (often the team leader documents it), not imposed by engineers. The core documents are the <em>standardised work chart</em> (layout + walk paths + standard WIP), the <em>standardised work combination table</em> (manual time, machine time and walk time against takt), and <em>job element sheets</em> (the how and the key points/reasons).</p>
  <p><b>Why level (heijunka).</b> Unlevelled demand triggers the bullwhip effect: small swings at the customer end amplify into wild swings upstream, forcing capacity to be sized for peaks (waste) and creating the Mura→Muri→Muda chain. Levelling breaks this. <em>Volume levelling</em> smooths the total quantity per period; <em>mix levelling</em> smooths the sequence of variants — running A-B-A-B-A-B instead of AAA-BBB. Mix levelling is harder and is the real prize, because it lets you respond to varied demand from a small, steady buffer.</p>
  <p><b>The mechanics.</b> A <em>heijunka box</em> (a pigeonhole board) holds kanban slotted by product and time interval; a runner withdraws them at a fixed <em>pitch</em> (takt × pack-out quantity) and feeds the pacemaker process. <em>EPEI</em> — "Every Part Every Interval" — measures how often you cycle through the whole mix; smaller EPEI means more levelling and smaller batches.</p>
  <p><b>The trade-off.</b> Levelling the mix demands fast changeovers — so heijunka and SMED are joined at the hip — plus a modest finished-goods buffer to decouple level production from uneven customer ordering. The alternative, "chase" (make exactly what was ordered, when ordered), looks responsive but propagates variability through the whole stream.</p>`,
  exercises:[
    { type:'mcq', prompt:'Standardised work & levelling.',
      questions:[
        { text:'"Without a standard there can be no ___" (Ohno).', options:['profit','kaizen','safety','schedule'], correct:1 },
        { text:'The three elements of standardised work are…', options:['Takt time, work sequence, standard WIP','Sort, set, shine','Plan, do, check','People, process, technology'], correct:0 },
        { text:'Running variants in the sequence A-B-A-B-A-B rather than AAA-BBB is…', options:['Volume levelling','Mix levelling','Overproduction','Batch processing'], correct:1 },
        { text:'Heijunka (mix levelling) most depends on which other Lean capability?', options:['Fast changeovers (SMED)','Six Sigma','ERP','Bigger warehouses'], correct:0 },
      ],
      solution:`<p>Standards enable kaizen; the three elements are takt, sequence and standard WIP; A-B-A-B is mix levelling; and you can't level the mix without quick changeovers (SMED).</p>` },
  ]
},

/* ===== 4. VALUE STREAM MAPPING ===== */
{
  id:'l4', area:'lean', track:'Value Stream', title:'Value Stream Mapping (VSM)', min:45,
  visual:{type:'vsm', caption:'Current-state value stream map', demand:'90 orders', steps:[{name:'Order entry',pt:4,wt:120,ca:'95%'},{name:'Credit check',pt:6,wt:240,ca:'90%'},{name:'Pick & pack',pt:18,wt:480,ca:'98%'},{name:'Quality check',pt:5,wt:60,ca:'99%'},{name:'Shipping prep',pt:8,wt:180,ca:'97%'},{name:'Dispatch',pt:3,wt:30,ca:'100%'}]},
  concept:`<p>A <strong>Value Stream Map</strong> draws every step a unit passes through — material <em>and</em> information flow — with timing data underneath. You build a <em>current-state</em> map to see reality, then a <em>future-state</em> map to design the improvement, then a plan to get there.</p>
  <p>The headline metrics:</p>
  <ul>
    <li><b>Process time (PT)</b> — hands-on, value-adding work per step.</li>
    <li><b>Lead time (LT)</b> — total elapsed time = Σ process time + Σ wait time.</li>
    <li><b>Process Cycle Efficiency (PCE)</b> = value-add time ÷ lead time × 100. In office/service streams 5–15% is common; under 5% means the stream is almost all waiting.</li>
    <li><b>%C&amp;A</b> (complete &amp; accurate) — how often work passes cleanly to the next step.</li>
  </ul>
  <p>Read the data below — you'll analyse this same order-to-dispatch stream across the next modules.</p>
  ${VSM_TABLE}`,
  deep:`<p><b>Where it comes from.</b> VSM is Toyota's "Material and Information Flow Mapping", popularised by Mike Rother &amp; John Shook in <em>Learning to See</em> (1999). The discipline: choose one <em>product family</em> (things that flow through similar steps), map door-to-door for that family, and always draw both the material flow (bottom) and the information flow (top) — in office and service work the information/decision flow is usually where the waste hides.</p>
  <p><b>The data boxes.</b> Under each process you record more than process time: <em>C/T</em> (cycle time), <em>C/O</em> (changeover time), <em>uptime</em> %, number of operators, batch size, and <em>%C&amp;A</em>. Between processes you draw inventory triangles with quantities (which convert to days of demand). The timeline "ladder" at the bottom carries process time on the lower rungs and wait time on the upper rungs; summing each gives total value-add time and total lead time, hence PCE.</p>
  <p><b>Designing the future state.</b> Rother's eight future-state questions guide it: (1) What is takt time? (2) Build to a finished-goods supermarket or ship direct? (3) Where can you use continuous one-piece flow? (4) Where must you use supermarket pull because flow isn't possible? (5) Which single point will you schedule (the <em>pacemaker</em>)? (6) How will you level the production <em>mix</em> at the pacemaker? (7) What increment of work will you release (the <em>pitch</em>)? (8) What process improvements (SMED, uptime, %C&amp;A) are needed to make the future state possible?</p>
  <p><b>How VSM fails.</b> Boiling the ocean (mapping the whole company instead of one family); mapping from a conference room instead of walking the gemba; producing a beautiful current-state map with no future state and no action plan; and treating it as a one-off poster rather than a living document re-drawn as the stream improves. A VSM with no owner and no follow-up plan is wall decoration.</p>`,
  exercises:[
    { type:'numeric', prompt:'Compute the core current-state metrics. (Treat process time as the value-adding time.)',
      fields:[
        { key:'pt', label:'Total process (value-add) time', unit:'min', answer:44, tol:0.5 },
        { key:'wt', label:'Total wait time', unit:'min', answer:1110, tol:1 },
        { key:'lt', label:'Total lead time', unit:'min', answer:1154, tol:1 },
        { key:'pce', label:'Process Cycle Efficiency', unit:'%', answer:3.81, tol:0.3 },
      ],
      solution:`<p>Σ PT = 44 min. Σ WT = 1110 min. Lead time = 1154 min (≈ 19.2 h elapsed for 44 min of real work). PCE = 44/1154 × 100 = <b>3.81%</b> — over 96% is waiting.</p>` },
    { type:'mcq', prompt:'Diagnose the stream.',
      questions:[
        { text:'Which step is the process-time bottleneck (longest hands-on time)?', options:['Order entry','Credit check','Pick & pack','Shipping prep'], correct:2 },
        { text:'For the biggest lead-time win, attack…', options:['The 4-min order entry','The 1110 min of wait time between steps','A second dispatch desk','Faster labels'], correct:1 },
        { text:'On a VSM, the single scheduled point is called the…', options:['Bottleneck','Pacemaker','Supermarket','Andon'], correct:1 },
      ],
      solution:`<p>Pick &amp; pack is the process bottleneck, but the prize is the 1110 min of waiting; the one point you schedule is the pacemaker.</p>` },
  ]
},

/* ===== 5. TAKT & LINE BALANCING ===== */
{
  id:'l5', area:'lean', track:'Flow', title:'Takt Time & Line Balancing', min:40,
  visual:{type:'barTakt', caption:'Cycle time per step vs takt', takt:5, items:[{label:'Order entry',value:4},{label:'Credit',value:6},{label:'Pick&pack',value:18},{label:'QC',value:5},{label:'Ship prep',value:8},{label:'Dispatch',value:3}]},
  concept:`<p><strong>Takt time</strong> is the heartbeat of demand — how often you must finish one unit to keep pace with the customer.</p>
  <pre class="cc">Takt = available working time / customer demand</pre>
  <p>Compare each step's <strong>cycle time</strong> to takt: any step slower than takt is a constraint that starves the customer. The theoretical minimum number of operators for one-piece flow is:</p>
  <pre class="cc">Operators (min) = total work content / takt
Balance efficiency = total work / (stations x takt)</pre>
  <p>Available time = 480 − 30 = <b>450 min/day</b>, demand = <b>90 orders/day</b>.</p>
  ${VSM_TABLE}`,
  deep:`<p><b>Three different times.</b> Keep them straight: <em>takt</em> is set by the customer (demand), <em>cycle time</em> is set by your process (how fast a step actually produces), and <em>lead time</em> is total elapsed time per unit. The design rule is cycle time slightly <em>below</em> takt — typically aim for ~85–90% of takt — so small disruptions don't immediately cause you to miss the beat. Running cycle time exactly at takt leaves no margin.</p>
  <p><b>Balancing the line.</b> The tool is the <em>Yamazumi</em> (operator balance) chart: a stacked bar of work elements per operator, with a takt line drawn across. You move elements between operators to even the bars up just under takt. <em>Balance efficiency</em> = total work content ÷ (number of stations × takt); the gap to 100% is <em>balance loss</em>. A single step whose cycle time exceeds takt can't be "balanced" away — it must be split, run in parallel, or have its work content reduced.</p>
  <p><b>Pitch and management.</b> Takt is often seconds or minutes — too fast to manage by eye — so teams use <em>pitch</em> = takt × pack-out quantity (e.g. takt 1 min × a tray of 20 = 20-min pitch) as the interval for checking "are we ahead or behind?" on a production-analysis board.</p>
  <p><b>Handling demand variability.</b> Takt is recalculated periodically (say monthly), not chased daily — constantly re-tuning the line to noise is itself waste (Mura). Designing capacity to <em>peak</em> demand wastes money in normal periods; designing to <em>average</em> with a levelling buffer is usually better. Mixed-model lines compute a weighted takt across variants. And remember: the system constraint must be able to run <em>faster</em> than takt, or it can never keep up.</p>`,
  exercises:[
    { type:'numeric', prompt:'Compute takt and the balancing numbers.',
      fields:[
        { key:'takt', label:'Takt time', unit:'min/order', answer:5, tol:0.05 },
        { key:'over', label:'How many steps have process time ABOVE takt?', unit:'steps', answer:3, tol:0 },
        { key:'ops', label:'Theoretical minimum operators (round up)', unit:'operators', answer:9, tol:0 },
        { key:'eff', label:'Balance efficiency at that staffing', unit:'%', answer:97.8, tol:0.6 },
      ],
      solution:`<p>Takt = 450/90 = <b>5.0 min</b>. Steps above 5: Credit check (6), Pick &amp; pack (18), Shipping prep (8) → 3. Min operators = 44/5 = 8.8 → <b>9</b>. Balance efficiency = 44/(9×5) = <b>97.8%</b>. Pick &amp; pack (18 ≫ 5) still needs splitting to flow at takt.</p>` },
  ]
},

/* ===== 6. FLOW & LITTLE'S LAW ===== */
{
  id:'l6', area:'lean', track:'Flow', title:'Flow & Little\u2019s Law', min:40,
  concept:`<p><strong>Little's Law</strong> is the most useful equation in operations. For any stable system:</p>
  <pre class="cc">WIP = Throughput x Lead time
(equivalently)  Lead time = WIP / Throughput</pre>
