/* ===== FOUNDATIONS ===== */
{
  id:'ag1', area:'agile', track:'Foundations', title:'The Agile mindset & Manifesto', min:25,
  concept:`<p>Agile is not a methodology; it is a <strong>mindset</strong> for delivering value under uncertainty. The 2001 Manifesto states four value preferences: <em>individuals and interactions</em> over processes and tools, <em>working software</em> over comprehensive documentation, <em>customer collaboration</em> over contract negotiation, and <em>responding to change</em> over following a plan. The right-hand items still have value — the left are valued <em>more</em>.</p>
  <p>Underneath sits <strong>empiricism</strong>: you make progress visible (transparency), check reality often (inspection), and adjust (adaptation). You deliver in small slices, learn from real feedback, and steer. For a PM/PdM, the deepest shift is from measuring <strong>output</strong> (features shipped, plan followed) to measuring <strong>outcome</strong> (value and behaviour change for users and the business).</p>`,
  deep:`<p><b>Iterative vs incremental.</b> These are different and Agile uses both. <em>Incremental</em> = build in slices (login, then search, then checkout). <em>Iterative</em> = revisit and refine the whole (a rough prototype improved each pass). Good delivery slices thin <em>and</em> refines based on feedback — a vertical slice that touches the whole stack and is genuinely usable beats horizontal layers no user can try.</p>
  <p><b>The 12 principles, grouped.</b> Satisfy the customer through early, continuous delivery; welcome change; deliver frequently; business and developers work together daily; build around motivated people and trust them; favour face-to-face conversation; working software is the primary measure of progress; sustainable pace; technical excellence; simplicity (maximise work <em>not</em> done); self-organising teams; regular reflection and tuning.</p>
  <p><b>Common misconceptions a PM should kill.</b> "Agile = no plan / no docs / no dates" is wrong — Agile plans <em>more</em> often at finer grain, documents what is useful, and can absolutely commit to outcomes. "Agile = Scrum" is wrong — Scrum is one popular framework among many. And "going faster" is not the goal; <em>learning and delivering value sooner, with the option to change</em>, is.</p>`,
  exercises:[
    { type:'mcq', prompt:'Manifesto & mindset.',
      questions:[
        { text:'"Working software over comprehensive documentation" means…', options:['Never document anything','Documentation has value, but a working increment is valued more','Documentation is illegal','Only write code'], correct:1 },
        { text:'The three pillars of empiricism are…', options:['Plan, build, ship','Transparency, inspection, adaptation','Scope, time, cost','Roles, events, artifacts'], correct:1 },
        { text:'The biggest shift Agile asks of a product leader is…', options:['More documents','From output (features shipped) to outcome (value delivered)','Longer release cycles','Removing the customer'], correct:1 } ],
      solution:`<p>Empiricism (transparency \u2192 inspection \u2192 adaptation) lets teams steer with real feedback, and the headline product shift is outcome over output.</p>` },
    { type:'classify', prompt:'Iterative or incremental thinking?',
      categories:['Iterative (refine the whole)','Incremental (add a slice)'],
      items:[
        { text:'Sketch a rough portrait, then refine detail each pass', answer:0 },
        { text:'Release login, then search, then checkout', answer:1 },
        { text:'Ship a clickable prototype and improve usability each round', answer:0 },
        { text:'Build the kitchen, then the bedroom, then the bathroom', answer:1 } ],
      solution:`<p>Iterative revisits the whole to refine it; incremental adds new pieces. Strong Agile combines both \u2014 thin vertical slices, refined by feedback.</p>` }
  ]
},
{
  id:'ag2', area:'agile', track:'Foundations', title:'Waterfall & predictive delivery', min:25,
  visual:{type:'waterfall', caption:'Sequential waterfall phases with stage gates', phases:[{title:'Requirements',startWk:0,durWk:3,rag:'green',stage:''},{title:'Design',startWk:3,durWk:3,rag:'green',stage:''},{title:'Build',startWk:6,durWk:6,rag:'amber',stage:''},{title:'Test',startWk:12,durWk:3,rag:'amber',stage:''},{title:'Deploy',startWk:15,durWk:2,rag:'green',stage:''}]},
  concept:`<p>Agile did not appear in a vacuum \u2014 it answered the limits of <strong>waterfall / predictive</strong> delivery, which is still the right choice for some work. Waterfall runs in <em>sequential phases</em> \u2014 requirements \u2192 design \u2192 build \u2192 test \u2192 deploy \u2014 with a sign-off <strong>stage gate</strong> between each. It assumes you can know the scope up front, so you plan the whole thing, then execute the plan.</p>
  <p>It fits when requirements are <strong>stable and well understood</strong>, the cost of change is high, and predictability matters more than adaptability: regulated submissions, construction, hardware, fixed-scope/fixed-price contracts, and integrations with immovable external deadlines.</p>`,
  deep:`<p><b>The predictive toolkit (PMBOK-style).</b> A work breakdown structure decomposes scope; a network/critical-path schedule sequences it; a baseline (scope, schedule, cost) is set; and a <em>change-control</em> process governs deviations. Earned-value metrics (SPI, CPI) track plan vs actual. Done well it gives strong upfront visibility and contractual clarity.</p>
  <p><b>Why it struggles with novel software.</b> Big upfront scope assumes you can specify what you have never built for users whose needs emerge through use. Feedback arrives only at the end (the "big-bang" integration and UAT), so defects and wrong-product risk compound late, when change is most expensive. Long phases also create large batches \u2014 the opposite of fast flow.</p>
  <p><b>Water-scrum-fall</b> is the common real-world hybrid-gone-wrong: a team runs sprints and standups in the middle, but is still wrapped by upfront fixed-scope sign-off and an end-of-project big-bang release with heavy governance. You pay the ceremony cost of Agile without getting its core benefit \u2014 fast feedback and the option to change \u2014 because the batch is still huge and the team can't actually adapt scope.</p>`,
  exercises:[
    { type:'mcq', prompt:'Predictive delivery.',
      questions:[
        { text:'Waterfall is usually a good fit when…', options:['Requirements are stable and well understood','You expect to learn and change a lot','The market is highly uncertain','You want to ship weekly'], correct:0 },
        { text:'A defining feature of predictive delivery is…', options:['No plan','Sequential phases separated by stage gates','Daily re-planning','No documentation'], correct:1 },
        { text:'"Water-scrum-fall" describes…', options:['A pure agile team','Agile ceremonies wrapped inside upfront sign-off and a big-bang release','A SAFe role','A Kanban metric'], correct:1 } ],
      solution:`<p>Predictive delivery sequences phases behind gates and shines when scope is stable. Water-scrum-fall keeps the big batch (and so loses Agile's main benefit) while paying for the ceremonies.</p>` },
    { type:'classify', prompt:'Predictive or adaptive \u2014 which fits better?',
      categories:['Predictive / waterfall','Adaptive / agile'],
      items:[
        { text:'Regulatory submission with fixed, audited scope', answer:0 },
        { text:'New consumer app in an unproven market', answer:1 },
        { text:'Civil-engineering / construction build', answer:0 },
        { text:'Evolving SaaS product with frequent user feedback', answer:1 } ],
      solution:`<p>Stable, high-cost-of-change, compliance-bound work leans predictive; novel, feedback-rich, fast-changing work leans adaptive.</p>` }
  ]
},
{
  id:'ag3', area:'agile', track:'Foundations', title:'Choosing an approach: predictive, agile, hybrid', min:25,
  concept:`<p>The mature question is not "Agile or Waterfall?" but "what does <em>this</em> work need?" Use the nature of the problem to choose. <strong>Cynefin</strong> offers a quick lens: <em>Clear</em> and <em>Complicated</em> domains (known or knowable cause-and-effect) reward planning and expertise \u2014 predictive works. <em>Complex</em> domains (cause-and-effect only clear in hindsight) reward probe-sense-respond \u2014 empirical/agile works. <em>Chaotic</em> needs act-first stabilisation.</p>
  <p>Most real portfolios are mixed, so <strong>hybrid</strong> is normal: predictive for the stable, compliance-bound, or hardware parts; adaptive for the uncertain, discovery-heavy parts.</p>`,
  deep:`<p><b>Stacey & Boehm-Turner.</b> The Stacey matrix plots <em>requirements certainty</em> against <em>technical certainty</em>: high-high \u2192 simple/plan-driven; low-low \u2192 chaos; the large middle is complex \u2192 agile. Boehm & Turner's "home-ground" analysis tailors by five factors \u2014 team size, criticality, personnel skill, dynamism (rate of change), and culture. Small, skilled teams on volatile, low-criticality work are agile home-ground; large, safety-critical, stable work leans plan-driven.</p>
  <p><b>Tailoring, not religion.</b> Disciplined Agile (DA) frames this as "choose your way of working" from a library of practices for your context. The failure mode is dogma in either direction: forcing two-week sprints onto a regulated hardware milestone, or imposing fixed 12-month scope on an unproven product. A PM's craft is reading the risk profile and composing the approach \u2014 and revisiting it as uncertainty resolves (early discovery agile, later delivery more predictable).</p>`,
  exercises:[
    { type:'classify', prompt:'Where does this work sit?',
      categories:['Clear / Complicated \u2014 plan-driven works','Complex \u2014 empirical / agile works'],
      items:[
        { text:'Payroll migration with known, documented rules', answer:0 },
        { text:'Designing a brand-new recommendation engine', answer:1 },
        { text:'Standard, well-rehearsed data-centre move', answer:0 },
        { text:'Launching a product into a market that does not exist yet', answer:1 } ],
      solution:`<p>Known/knowable cause-and-effect \u2192 predictive; emergent, learn-as-you-go problems \u2192 agile. Match the approach to the domain.</p>` },
    { type:'mcq', prompt:'Selecting & tailoring.',
      questions:[
        { text:"Boehm & Turner's home-ground analysis says you should…", options:['Always go agile','Always go waterfall','Tailor to risk, size, criticality, skill and volatility','Always use SAFe'], correct:2 },
        { text:'A sound hybrid approach typically…', options:['Has no process','Uses predictive for stable parts and adaptive for uncertain parts','Is forbidden by the Manifesto','Is identical to SAFe'], correct:1 } ],
      solution:`<p>Tailor by context, and it is perfectly valid to mix predictive and adaptive across one programme.</p>` }
  ]
},

/* ===== SCRUM ===== */
{
  id:'ag4', area:'agile', track:'Scrum', title:'The Scrum framework', min:30,
  concept:`<p><strong>Scrum</strong> is a lightweight framework for complex product work, built on empiricism and three roles, three artifacts and five events. The <strong>accountabilities</strong>: the <em>Product Owner</em> maximises the value of the product and owns the Product Backlog; the <em>Scrum Master</em> establishes Scrum and coaches the team, removing impediments; the <em>Developers</em> build a usable increment each Sprint and decide <em>how</em>.</p>
  <p>The <strong>artifacts</strong> each have a commitment that makes them transparent: the <em>Product Backlog</em> \u2192 the <em>Product Goal</em>; the <em>Sprint Backlog</em> \u2192 the <em>Sprint Goal</em>; the <em>Increment</em> \u2192 the <em>Definition of Done</em> (the quality bar the increment must meet to be releasable).</p>`,
  deep:`<p><b>Why so few rules?</b> Scrum is deliberately incomplete \u2014 a framework, not a recipe. It creates a cadence of inspect-and-adapt and trusts a <em>self-managing, cross-functional</em> team to fill in the engineering practices. That is its strength (adaptable) and its trap (teams expect it to tell them everything and end up doing "mechanical Scrum" with no real improvement).</p>
  <p><b>Role confusions a PM must navigate.</b> The Scrum Master is <em>not</em> a project manager assigning tasks, nor the team's boss \u2014 they are a facilitative/true leader serving the team and organisation. The Product Owner is one accountable person (not a committee) and is <em>tactical and team-facing</em>; a traditional Product Manager role is often broader and more strategic (market, pricing, lifecycle), with the PO acting as the product's voice into the team. On many products one person wears both hats; at scale they split. The Business Analyst's classic duties get absorbed into PO + Developers.</p>
  <p><b>Beyond one team:</b> Nexus and Scrum@Scale extend Scrum to multiple teams on one product while keeping a single Product Backlog and Product Owner accountability.</p>`,
  exercises:[
    { type:'classify', prompt:'Which Scrum accountability owns this?',
      categories:['Product Owner','Scrum Master','Developers'],
      items:[
        { text:'Orders the Product Backlog to maximise value', answer:0 },
        { text:'Coaches the team and removes impediments', answer:1 },
        { text:'Decide how to turn backlog items into the increment', answer:2 },
        { text:'Owns the Product Goal and represents stakeholder value', answer:0 },
        { text:'Facilitates the events and protects the team\u2019s focus', answer:1 } ],
      solution:`<p>PO = value & backlog; Scrum Master = coaching, facilitation, impediments; Developers = the how and the increment.</p>` },
    { type:'mcq', prompt:'Roles & artifacts.',
      questions:[
        { text:'The Scrum Master is best described as…', options:['The team\u2019s boss','A true/servant-leader who coaches and removes impediments','The PM who assigns tasks','The person who writes all the stories'], correct:1 },
        { text:'The Definition of Done is…', options:['A nice-to-have','A shared quality standard the increment must meet to be releasable','Set by the PO alone','The same as the Sprint Goal'], correct:1 },
        { text:'Product Owner vs traditional Product Manager:', options:['They are identical','PO is a tactical, team-facing accountability; PdM is often broader/strategic','PO is always more senior','Product Managers don\u2019t exist in agile'], correct:1 } ],
      solution:`<p>The Scrum Master serves rather than commands; DoD is the team\u2019s quality bar; PO is the tactical product voice into the team, often narrower than a full PdM role.</p>` }
  ]
},
{
  id:'ag5', area:'agile', track:'Scrum', title:'Scrum events / ceremonies', min:30,
  visual:{type:'sprintcycle', caption:'The Scrum cycle and its events'},
  concept:`<p>The <strong>Sprint</strong> is the heartbeat \u2014 a fixed timebox (1\u20134 weeks, commonly two) that contains all other events and produces a usable increment. Inside it: <strong>Sprint Planning</strong> sets <em>why</em> (Sprint Goal), <em>what</em> (selected backlog) and <em>how</em>; the <strong>Daily Scrum</strong> is a 15-minute developer re-plan toward the goal; the <strong>Sprint Review</strong> inspects the increment <em>with stakeholders</em> and adapts the backlog; and the <strong>Sprint Retrospective</strong> inspects how the team worked and commits to improvements.</p>
  <p>Each event is a formal <em>inspect-and-adapt</em> point \u2014 they exist to reduce the need for other meetings, not add to them.</p>`,
  deep:`<p><b>Timeboxes scale with sprint length.</b> For a one-month Sprint the maxima are Planning \u2264 8h, Review \u2264 4h, Retro \u2264 3h, Daily 15 min. Halve them for a two-week Sprint (Planning \u2264 4h, Review \u2264 2h, Retro \u2264 1.5h). Timeboxes are a ceiling, not a target.</p>
  <p><b>Backlog refinement is not a 5th event</b> \u2014 it is an ongoing activity (typically \u2264 10% of capacity) where the team adds detail, acceptance criteria, order and estimates so upcoming items are "ready."</p>
  <p><b>Anti-patterns to police.</b> The Daily Scrum becoming a status report <em>to the Scrum Master/manager</em> (it is by and for the Developers); the Review reduced to a one-way demo with no stakeholder conversation or backlog adaptation; the Retro skipped or producing no actual change (the single biggest waste \u2014 inspection without adaptation); and Planning that selects items but never agrees a real <em>Sprint Goal</em>, leaving the team with a to-do list and no coherent objective to flex against.</p>`,
  exercises:[
    { type:'numeric', prompt:'Timebox arithmetic (two-week sprint).',
      fields:[
        { label:'Daily Scrum length (minutes)', answer:15, tol:0 },
        { label:'Max Sprint Planning (hours)', answer:4, tol:0 },
        { label:'Max Sprint Review (hours)', answer:2, tol:0 } ],
      solution:`<p>The Daily is always 15 minutes. Other timeboxes scale with sprint length: a two-week Sprint halves the one-month maxima \u2014 Planning \u2264 4h, Review \u2264 2h (Retro \u2264 1.5h).</p>` },
    { type:'classify', prompt:'Match the purpose to the event.',
      categories:['Sprint Planning','Daily Scrum','Sprint Review','Sprint Retrospective'],
      items:[
        { text:'Agree the Sprint Goal and select backlog items', answer:0 },
        { text:'Developers synchronise and re-plan toward the goal', answer:1 },
        { text:'Inspect the increment with stakeholders and adapt the backlog', answer:2 },
        { text:'Inspect how we worked and choose improvements', answer:3 } ],
      solution:`<p>Planning sets the goal/plan; the Daily is the developers\u2019 re-plan; the Review inspects the product with stakeholders; the Retro inspects the process.</p>` },
    { type:'mcq', prompt:'Ceremony health.',
      questions:[
        { text:'A common Daily Scrum anti-pattern is…', options:['Keeping it to 15 minutes','Turning it into a status report to the manager','Developers talking to each other','Focusing on the Sprint Goal'], correct:1 } ],
      solution:`<p>The Daily is by and for the Developers to re-plan their day toward the Sprint Goal \u2014 not a manager status round.</p>` }
  ]
},
{
  id:'ag6', area:'agile', track:'Scrum', title:'Product Owner & backlog management', min:25,
  concept:`<p>The <strong>Product Owner</strong> is accountable for <em>maximising the value</em> the team produces. The lever is the <strong>Product Backlog</strong> \u2014 a single, ordered, ever-evolving list of everything that might add value. Ordering it well (by value, risk, size, dependency and learning) is the highest-leverage thing a PO does, because the order <em>is</em> the strategy made concrete.</p>
  <p>The PO keeps the backlog <strong>DEEP</strong>: <em>Detailed appropriately</em> (top items refined, lower ones coarse), <em>Emergent</em> (it changes), <em>Estimated</em>, and <em>Prioritised</em>.</p>`,
  deep:`<p><b>PO vs PdM, in practice.</b> A Product Owner is the value-maximising decision-maker <em>for the delivery team</em>; a Product Manager typically owns the broader product \u2014 strategy, market, pricing, lifecycle, stakeholder alignment. On a small product one person does both; at scale a PdM sets direction (the "why/what at large") and one or more POs translate it into ready backlog for teams. The danger is a "proxy PO" with no real authority \u2014 a note-taker for a steering committee \u2014 which breaks the framework because nobody can actually decide priorities at the team\u2019s cadence.</p>
  <p><b>Saying no is the job.</b> Value is maximised as much by the work <em>not</em> done as by features shipped. Strong POs anchor on a Product Goal and outcomes, use a transparent prioritisation method (RICE, WSJF, MoSCoW), and protect the team from thrash. Story mapping helps keep the backlog organised around the user\u2019s journey rather than a flat wish-list, so you can slice coherent, releasable increments.</p>`,
  exercises:[
    { type:'mcq', prompt:'The PO role.',
      questions:[
        { text:'Product Backlog refinement is…', options:['A formal fifth event','An ongoing activity to add detail, order and estimates','Done once at the start','The PO\u2019s secret'], correct:1 },
        { text:'The single most important thing a PO does is…', options:['Write every story personally','Maximise the value of the product / the team\u2019s work','Attend every meeting','Approve the code'], correct:1 },
        { text:'A "proxy" Product Owner fails because…', options:['They are too senior','They have no authority to actually decide priorities at the team\u2019s cadence','They write too many stories','They estimate'], correct:1 } ],
      solution:`<p>Refinement is continuous; the PO\u2019s purpose is value, which requires real decision authority \u2014 a powerless proxy breaks Scrum.</p>` },
    { type:'worksheet', prompt:'Template \u2014 outcome roadmap (Now / Next / Later). Saved on this device.',
      template:{ kind:'roadmap' } }
  ]
},
{
  id:'ag7', area:'agile', track:'Scrum', title:'Estimation, velocity & forecasting', min:30,
  visual:{type:'burndown', caption:'Sprint burndown \u2014 ideal vs actual', total:30, days:10, actual:[30,28,26,25,20,18,15,11,6,2,0]},
  concept:`<p>Agile estimation is <strong>relative</strong>, not absolute. Teams size items in <em>story points</em> \u2014 a blend of effort, complexity and uncertainty \u2014 because humans compare ("this is about twice that") far better than they predict hours. <strong>Planning poker</strong> surfaces differences of understanding, which is often more valuable than the number itself.</p>
  <p><strong>Velocity</strong> \u2014 average points completed per Sprint \u2014 then turns size into a forecast: backlog points \u00F7 velocity \u2248 sprints remaining. A <strong>burndown</strong> tracks remaining work within a sprint; a <strong>burn-up</strong> tracks completed work against total scope, separating progress from scope change.</p>`,
  deep:`<p><b>Velocity is a planning tool, not a scoreboard.</b> It is team-specific and unitless \u2014 you cannot compare team A\u2019s velocity to team B\u2019s, and using it as a productivity <em>target</em> is a classic Goodhart\u2019s-law failure: the team inflates estimates and the number stops meaning anything. Capacity (people-days available) and velocity are different inputs to planning.</p>
  <p><b>Forecasting with uncertainty.</b> A single "we\u2019ll be done in 6 sprints" is false precision. Better PMs forecast a <em>range</em> using historical throughput (often via Monte-Carlo over completed-items-per-sprint), and communicate the cone of uncertainty narrowing over time. The #NoEstimates school goes further \u2014 just count items and use throughput \u2014 which works well when stories are sliced to a similar small size.</p>
  <p><b>Reading a burndown.</b> A flat line then a cliff means work isn\u2019t being finished until the end (large batches, no flow); a line that crosses below ideal early may mean over-conservative estimates; scope added mid-sprint shows as the line jumping <em>up</em> \u2014 which is exactly why a burn-up (with a separate scope line) is more honest.</p>`,
  exercises:[
    { type:'numeric', prompt:'Velocity & forecast. A team completes 20, 26 and 23 points over three sprints; the backlog holds 138 points.',
      fields:[
        { label:'Average velocity (points/sprint)', answer:23, tol:1 },
        { label:'Sprints to finish 138 points (round up)', answer:6, tol:0 },
        { label:'Points remaining if 30 of 50 are done', answer:20, tol:0 } ],
      solution:`<p>Average = (20+26+23)/3 = 23. 138 \u00F7 23 = 6 sprints. 50 \u2212 30 = 20 points remaining (what a burndown plots).</p>` },
    { type:'mcq', prompt:'Estimation judgement.',
      questions:[
        { text:'Story points estimate…', options:['Exact hours','Relative size: effort, complexity and uncertainty','Cost in euros','The number of tasks'], correct:1 },
        { text:'Using velocity as an individual productivity target is…', options:['Best practice','An anti-pattern that invites gaming (Goodhart\u2019s law)','Required by Scrum','Encouraged by SAFe'], correct:1 },
        { text:'A burn-up chart improves on a burndown because it…', options:['Is prettier','Shows scope changes separately from progress','Hides scope','Counts hours'], correct:1 } ],
      solution:`<p>Points are relative; velocity is a forecasting aid, not a target; burn-up separates "did scope grow?" from "how much is done?".</p>` }
  ]
},

/* ===== KANBAN & FLOW ===== */
{
  id:'ag8', area:'agile', track:'Kanban & flow', title:'Kanban & flow metrics', min:28,
  visual:{type:'cfd', caption:'Cumulative flow diagram \u2014 the band width is WIP'},
  concept:`<p><strong>Kanban</strong> is an evolutionary flow method (no fixed roles or timeboxes) built on six practices: <em>visualise</em> the work, <em>limit work-in-progress (WIP)</em>, <em>manage flow</em>, make <em>policies explicit</em>, implement <em>feedback loops</em>, and <em>improve collaboratively</em>. Work is <em>pulled</em> when capacity frees up rather than pushed in.</p>
  <p>The core insight (shared with Lean): <strong>less WIP \u2192 shorter cycle time \u2192 faster feedback</strong>. You measure <em>lead time</em> (request \u2192 done), <em>cycle time</em> (start \u2192 done) and <em>throughput</em> (items/period), and read flow on a <strong>cumulative flow diagram</strong>.</p>`,
  deep:`<p><b>Little\u2019s Law ties it together:</b> average cycle time = WIP \u00F7 throughput. Halve WIP at the same throughput and you halve cycle time \u2014 the single most reliable lever for faster delivery, and why WIP limits are the heart of Kanban. On a CFD, the vertical gap between the "started" and "done" bands <em>is</em> WIP; a widening gap warns of a growing bottleneck before deadlines slip.</p>
  <p><b>Classes of service</b> let you treat work differently \u2014 expedite (rare, swarmed), fixed-date (regulatory), standard, and intangible \u2014 with explicit policies, instead of everything being "urgent." <b>Scrumban</b> blends Scrum\u2019s cadence/roles with Kanban\u2019s pull and WIP limits, a pragmatic landing spot for teams whose work mixes planned features and unplanned support.</p>
  <p><b>For a PM</b>, Kanban suits flow-of-requests work (support, ops, platform, ML pipelines) where sprint commitments feel artificial, and its metrics give a clean, gameable-resistant view of predictability via cycle-time percentiles ("85% of items finish within 9 days") rather than story points.</p>`,
  exercises:[
    { type:'numeric', prompt:'Little\u2019s Law in action.',
      fields:[
        { label:'Cycle time (days) if WIP = 12 and throughput = 4/day', answer:3, tol:0 },
        { label:'Throughput needed for a 2-day cycle time at WIP = 10', answer:5, tol:0 } ],
      solution:`<p>Cycle time = WIP \u00F7 throughput = 12 \u00F7 4 = 3 days. For a 2-day cycle at WIP 10, throughput = 10 \u00F7 2 = 5/day.</p>` },
    { type:'classify', prompt:'Which Kanban practice is this?',
      categories:['Visualise','Limit WIP','Manage flow','Make policies explicit'],
      items:[
        { text:'Put every work item on a board with columns', answer:0 },
        { text:'Cap "In progress" to 3 items per person', answer:1 },
        { text:'Watch cycle time and attack the bottleneck', answer:2 },
        { text:'Write the rule for what "Done" means on each column', answer:3 } ],
      solution:`<p>Visualise \u2192 board; Limit WIP \u2192 caps; Manage flow \u2192 reduce bottlenecks; Explicit policies \u2192 column/done rules.</p>` },
    { type:'mcq', prompt:'Flow intuition.',
      questions:[
        { text:'Lowering WIP generally leads to…', options:['Longer cycle time','Shorter cycle time and faster feedback','More multitasking','More defects'], correct:1 } ],
      solution:`<p>By Little\u2019s Law, less WIP at equal throughput means shorter cycle time \u2014 and finishing things before starting new ones speeds feedback.</p>` }
  ]
},

/* ===== PRODUCT CRAFT ===== */
{
  id:'ag9', area:'agile', track:'Product craft', title:'User stories & acceptance criteria', min:25,
  concept:`<p>A <strong>user story</strong> captures a need from the user\u2019s perspective as a placeholder for a conversation: <em>"As a (role), I want (capability), so that (benefit)."</em> The "so that" is the most important clause \u2014 it states the <em>outcome</em>, which lets the team find simpler ways to deliver the value.</p>
  <p>Good stories follow <strong>INVEST</strong>: Independent, Negotiable, Valuable, Estimable, Small, Testable. Each carries <strong>acceptance criteria</strong> \u2014 the conditions that make it "done" \u2014 often written as <em>Given / When / Then</em> so they double as test scenarios.</p>`,
  deep:`<p><b>Splitting stories (the hard skill).</b> Big stories hide risk and block flow. Split by <em>workflow steps</em>, <em>business rules</em>, <em>happy path vs edge cases</em>, <em>data variations</em>, <em>operations</em> (CRUD), or <em>simple-then-enhance</em> (the SPIDR patterns). The test: each slice is independently valuable and demonstrable. Avoid horizontal splits ("do the database story") that deliver nothing a user can see.</p>
  <p><b>Stories vs tasks vs epics.</b> An epic is a large body of work spanning sprints; a story is a thin user-valuable slice; tasks are the team\u2019s implementation breakdown (not user-facing). A "Definition of Ready" \u2014 clear value, acceptance criteria, no blocking dependencies, small enough \u2014 keeps un-bakeable items out of a sprint.</p>
  <p><b>BDD / Gherkin.</b> Writing acceptance criteria as Given-When-Then up front aligns PO, devs and QA on behaviour <em>before</em> building, shrinks rework, and can drive automated tests. Anti-patterns to catch: "As a user I want the app to be fast/good" (not testable, no role/benefit), and tech stories with no user value masquerading as backlog items.</p>`,
  exercises:[
    { type:'classify', prompt:'Solid story, or needs work?',
      categories:['Good story','Needs work'],
      items:[
        { text:'As a shopper I want to save my cart so that I can buy later', answer:0 },
        { text:'Build the database', answer:1 },
        { text:'As a user I want the app to be good', answer:1 },
        { text:'As an admin I want to export users to CSV so I can report monthly', answer:0 } ],
      solution:`<p>Good stories have role + capability + outcome and are testable. "Build the database" is a horizontal task with no user value; "be good" isn\u2019t testable.</p>` },
    { type:'mcq', prompt:'Acceptance criteria.',
      questions:[
        { text:'Acceptance criteria are best written…', options:['After release','Before/with the story, often as Given-When-Then','Never','By QA only, at the end'], correct:1 } ],
      solution:`<p>Defining behaviour up front (Given-When-Then) aligns the team and prevents rework \u2014 and the criteria become test cases.</p>` },
    { type:'worksheet', prompt:'Template \u2014 write a user story with acceptance criteria. Saved on this device.',
      template:{ kind:'userstory' } }
  ]
},
{
  id:'ag10', area:'agile', track:'Product craft', title:'Prioritisation & roadmaps', min:28,
  visual:{type:'matrix', caption:'Value vs effort \u2014 a quick prioritisation lens', items:[{title:'Saved carts',valueScore:5,effortScore:2},{title:'New onboarding',valueScore:4,effortScore:3},{title:'Full re-platform',valueScore:4,effortScore:5},{title:'UI polish',valueScore:2,effortScore:2}]},
  concept:`<p>Prioritisation is where strategy meets reality. Lightweight lenses: <strong>MoSCoW</strong> (Must / Should / Could / Won\u2019t) for release scope; <strong>value vs effort</strong> for quick wins; <strong>Kano</strong> to separate basics, performance and delighters. Quantified scoring adds rigour: <strong>RICE</strong> = Reach \u00D7 Impact \u00D7 Confidence \u00F7 Effort, and <strong>WSJF</strong> = Cost of Delay \u00F7 Job Size.</p>
  <p>Roadmaps then communicate intent. Prefer an <strong>outcome roadmap</strong> \u2014 <em>Now / Next / Later</em> tied to goals \u2014 over a date-locked feature list, so you commit to problems and outcomes while keeping the freedom to change solutions.</p>`,
  deep:`<p><b>WSJF, properly.</b> Cost of Delay = user/business value + time criticality + risk-reduction/opportunity-enablement; divide by job size (a proxy for duration). Sequencing by highest WSJF maximises value delivered per unit time \u2014 it mathematically favours small, high-value, time-sensitive items, which is exactly what you want when capacity is the constraint. It is the engine SAFe uses to order its program backlog.</p>
  <p><b>Story mapping</b> arranges stories along the user\u2019s journey (backbone) with priority vertically, so you can draw a release line that cuts a <em>thin end-to-end slice</em> rather than a complete-but-useless layer. It keeps prioritisation anchored to real user flows.</p>
  <p><b>The feature-factory trap.</b> Roadmaps full of outputs with no outcome hypotheses turn teams into ticket-shufflers. Tie each roadmap bet to an OKR or a measurable outcome and a confidence level; revisit as evidence arrives. Communicate roadmaps as <em>increasing uncertainty</em> over time (Now = committed, Later = directional) to avoid false promises.</p>`,
  exercises:[
    { type:'numeric', prompt:'Score it. Compute the priority numbers.',
      fields:[
        { label:'RICE: Reach 800 \u00D7 Impact 2 \u00D7 Confidence 0.8 \u00F7 Effort 4', answer:320, tol:1 },
        { label:'WSJF: Cost of Delay 24 \u00F7 Job Size 6', answer:4, tol:0.1 } ],
      solution:`<p>RICE = 800\u00D72\u00D70.8 \u00F7 4 = 1280 \u00F7 4 = 320. WSJF = 24 \u00F7 6 = 4. Higher means do-sooner.</p>` },
    { type:'classify', prompt:'Match the technique to its use.',
      categories:['MoSCoW','WSJF','Kano'],
      items:[
        { text:'Must / Should / Could / Won\u2019t for a release scope', answer:0 },
        { text:'Sequence by cost of delay over job size', answer:1 },
        { text:'Classify features as basic, performance or delighter', answer:2 } ],
      solution:`<p>MoSCoW frames release scope; WSJF sequences by economic urgency; Kano explains how features affect satisfaction.</p>` },
    { type:'worksheet', prompt:'Template \u2014 build a Now / Next / Later roadmap. Saved on this device.',
      template:{ kind:'roadmap' } }
  ]
},
{
  id:'ag11', area:'agile', track:'Product craft', title:'Outcomes, metrics & OKRs', min:25,
  concept:`<p>The cardinal product distinction: <strong>outputs</strong> (features shipped, story points) vs <strong>outcomes</strong> (changes in user behaviour and business results). Agile teams that optimise outputs become feature factories; the goal is outcomes. Frame goals with <strong>OKRs</strong> \u2014 an Objective (qualitative, inspiring) with measurable <em>Key Results</em> (the outcomes, not the tasks).</p>
  <p>Useful metric families: a single <strong>North Star</strong> capturing core value, <strong>AARRR</strong> "pirate" metrics (Acquisition, Activation, Retention, Referral, Revenue), <strong>DORA</strong> for delivery performance, and <strong>flow metrics</strong> (cycle time, throughput).</p>`,
  deep:`<p><b>Leading vs lagging, actionable vs vanity.</b> Lagging metrics (revenue, churn) confirm results late; leading metrics (activation, weekly active use) let you steer. "Vanity" metrics (cumulative signups, downloads) only go up and don\u2019t inform decisions \u2014 prefer rates and cohorts (7-day retention, activation rate). Every metric is gameable, so watch for Goodhart\u2019s law and balance with a counter-metric (e.g. speed <em>and</em> quality).</p>
  <p><b>DORA, concretely:</b> deployment frequency, lead time for changes, change-failure rate, and time-to-restore. High performers ship more often <em>and</em> more reliably \u2014 proof that speed and stability are not a trade-off when flow is healthy. These are the right metrics to test whether a tooling or AI investment actually moved delivery.</p>
  <p><b>Evidence-Based Management (EBM)</b> from Scrum.org groups measures into Current Value, Unrealised Value, Ability to Innovate, and Time-to-Market \u2014 a useful frame to keep teams honest that "busy" is not "valuable."</p>`,
  exercises:[
    { type:'classify', prompt:'Output/vanity, or outcome/actionable?',
      categories:['Output / vanity','Outcome / actionable'],
      items:[
        { text:'Number of features shipped this quarter', answer:0 },
        { text:'New-user activation rate', answer:1 },
        { text:'Total lines of code', answer:0 },
        { text:'7-day retention', answer:1 },
        { text:'Story points completed', answer:0 } ],
      solution:`<p>Counts of work done (features, code, points, cumulative signups) are outputs/vanity; rates that reflect user value and behaviour (activation, retention) are actionable outcomes.</p>` },
    { type:'mcq', prompt:'Goals & delivery metrics.',
      questions:[
        { text:'An OKR\u2019s Key Results should be…', options:['A task list','Measurable outcomes','Opinions','Features to build'], correct:1 },
        { text:'DORA metrics measure…', options:['Team happiness','Software-delivery performance (deploy freq, lead time, change-fail, MTTR)','Revenue only','Story points'], correct:1 },
        { text:'A North Star metric should…', options:['Count outputs','Capture the core value customers receive','Track revenue only','Change every week'], correct:1 } ],
      solution:`<p>KRs are outcomes; DORA measures delivery health; a North Star captures durable customer value.</p>` }
  ]
},

/* ===== SCALING & SAFe ===== */
{
  id:'ag12', area:'agile', track:'Scaling & SAFe', title:'Scaling & how SAFe differs', min:30,
  concept:`<p>One Scrum team caps out around 10 people; products needing dozens of people raise <em>coordination</em> and <em>dependency</em> problems that single-team Scrum doesn\u2019t solve. Several frameworks answer this. <strong>SAFe</strong> (Scaled Agile Framework) is the most prescriptive and enterprise-oriented; <strong>LeSS</strong> is a minimalist extension of Scrum; <strong>Scrum@Scale</strong> scales via a Scrum-of-Scrums; and the "<strong>Spotify model</strong>" (squads/tribes/chapters/guilds) is a culture snapshot, not a framework to copy.</p>
  <p><strong>How SAFe differs from Scrum, in one line:</strong> Scrum is a <em>lightweight, team-level</em> framework (3 accountabilities, 5 events); SAFe is a <em>heavyweight, multi-layer enterprise</em> framework that adds program and portfolio levels, more roles and artifacts, and a fixed planning cadence \u2014 trading some team autonomy for organisation-wide alignment.</p>`,
  deep:`<p><b>SAFe\u2019s big pieces.</b> Teams are grouped into an <strong>Agile Release Train (ART)</strong> \u2014 50\u2013125 people delivering a value stream on a shared cadence. Every 8\u201312 weeks the whole ART does <strong>PI (Program Increment) Planning</strong>: a big-room event where teams plan together, surface dependencies, and commit to PI objectives. New roles appear \u2014 Release Train Engineer (the ART\u2019s chief Scrum Master), Product Management (owns the program backlog, above team POs), System Architect \u2014 and the program backlog is ordered by <strong>WSJF</strong>. Above the ART sits a Lean portfolio level with value streams and epics.</p>
  <p><b>The trade-off, honestly.</b> SAFe buys alignment, predictability and a roadmap for large, compliance-heavy enterprises \u2014 at the cost of more process, more roles, longer planning cycles, and less team-level autonomy. Critics call it top-down and un-agile; defenders say large organisations need the coordination. <b>LeSS</b> takes the opposite stance: keep one Product Owner and one Product Backlog across all teams, add as little as possible, and <em>descale</em> the organisation (remove dependencies) rather than manage them. </p>
  <p><b>PM guidance:</b> reach for the lightest thing that resolves your actual constraint. If the pain is a few teams with shared code, Scrum-of-Scrums or LeSS may suffice. SAFe earns its overhead when you have many teams, strong inter-dependencies, regulatory governance, and a need for synchronised, executive-visible planning \u2014 and even then, beware adopting the diagram without the underlying Lean-Agile behaviours.</p>`,
  exercises:[
    { type:'classify', prompt:'Scrum (team-level) or SAFe (enterprise)?',
      categories:['Scrum (team-level)','SAFe (enterprise)'],
      items:[
        { text:'Three accountabilities and five events', answer:0 },
        { text:'Agile Release Train and quarterly PI Planning', answer:1 },
        { text:'Lightweight framework; team chooses its practices', answer:0 },
        { text:'Portfolio, Program and Team layers with defined roles (RTE, etc.)', answer:1 },
        { text:'WSJF used to order the program backlog', answer:1 } ],
      solution:`<p>Scrum is minimal and team-level; SAFe adds the ART, PI Planning, extra roles, and portfolio governance for enterprise alignment.</p>` },
    { type:'mcq', prompt:'Scaling judgement.',
      questions:[
        { text:'Compared with Scrum, SAFe primarily trades…', options:['Nothing','Some team autonomy/agility for enterprise alignment and coordination','Quality for speed','Agile for waterfall'], correct:1 },
        { text:'PI Planning is…', options:['A daily event','A big-room event aligning many teams for a ~8\u201312-week Program Increment','A retrospective','A Kanban policy'], correct:1 },
        { text:'LeSS differs from SAFe by…', options:['Adding more layers and roles','Being a de-scaled, minimal extension of one-team Scrum','Removing the Product Owner','Being waterfall'], correct:1 } ],
      solution:`<p>SAFe favours alignment over autonomy and runs on PI Planning; LeSS keeps one PO/backlog and adds as little as possible.</p>` }
  ]
},

/* ===== LEADERSHIP & PRACTICE ===== */
{
  id:'ag13', area:'agile', track:'Leadership & practice', title:'Facilitation, coaching & anti-patterns', min:25,
  concept:`<p>Agile leadership is <strong>facilitative</strong>, not directive. The PM/Scrum Master creates the conditions for a team to self-manage: clarity of goal, psychological safety, good facilitation, and the removal of impediments \u2014 then gets out of the way. The retrospective is the engine of improvement, and running it well (varying formats, ensuring actions actually happen) is a core skill.</p>
  <p>Most "Agile isn\u2019t working" complaints are really <strong>anti-patterns</strong> \u2014 the ceremonies are present but the principles are missing.</p>`,
  deep:`<p><b>The anti-pattern menagerie.</b> <em>Water-scrum-fall</em> \u2014 agile in the middle, fixed scope and big-bang release around it. <em>Zombie / dark Scrum</em> \u2014 going through the motions (standups, sprints) with no real inspection, adaptation, or psychological safety; the team is busy but lifeless. <em>Weaponised velocity</em> \u2014 managers setting velocity targets and comparing teams, which destroys honest estimation. <em>Feature factory</em> \u2014 shipping outputs with no outcome accountability. <em>Proxy PO</em> \u2014 a PO with no authority. Naming these precisely is half the cure, because it points at <em>which principle</em> is being violated.</p>
  <p><b>Facilitation craft.</b> Vary retro formats (Start-Stop-Continue, 4Ls, sailboat, timeline) to avoid staleness; make improvement actions specific, owned and time-boxed, and review them next retro \u2014 inspection without adaptation is the deepest waste. Foster psychological safety so problems surface early. For distributed teams, over-invest in written transparency and asynchronous communication, and protect a real-time overlap window for the synchronisation events.</p>`,
  exercises:[
    { type:'classify', prompt:'Name the anti-pattern.',
      categories:['Water-scrum-fall','Zombie / dark Scrum','Weaponised velocity'],
      items:[
        { text:'Agile ceremonies, but a stage-gated big-bang release', answer:0 },
        { text:'Standups and sprints with no real inspection or improvement', answer:1 },
        { text:'Managers set velocity targets and rank teams against each other', answer:2 } ],
      solution:`<p>Big batch around agile = water-scrum-fall; motion without empiricism = zombie Scrum; velocity-as-target = weaponised velocity.</p>` },
    { type:'mcq', prompt:'Leadership stance.',
      questions:[
        { text:'A facilitative / servant-leader stance means…', options:['Assigning all the tasks','Creating the conditions for the team to self-manage and improve','Writing the code yourself','Approving holiday requests'], correct:1 } ],
      solution:`<p>The leader removes impediments and builds safety and clarity so the team can self-organise \u2014 not command the work.</p>` },
    { type:'worksheet', prompt:'Template \u2014 run a Start / Stop / Continue retrospective. Saved on this device.',
      template:{ kind:'retro' } }
  ]
},

/* ===== AGILE x AI ===== */
{
  id:'ag14', area:'agile', track:'Agile \u00D7 AI', title:'Where AI & agents support delivery', min:30,
  concept:`<p>AI and agents are becoming teammates across the delivery lifecycle, and the PM/PdM is best placed to point them at the right work. In <strong>discovery</strong>: synthesise user research, draft PRDs, user stories and acceptance criteria from a brief. In <strong>planning</strong>: assist estimation, surface dependencies and risky items, sanity-check the backlog. In <strong>execution</strong>: summarise standups, auto-draft status reports and release notes, and (with code/test agents) build and verify. In <strong>review/retro</strong>: cluster feedback into themes and spot trends.</p>
  <p>An <strong>agent</strong> performs a task end-to-end; <strong>orchestration</strong> routes work between agents and humans \u2014 with humans accountable for prioritisation and outcomes, and guardrails on quality.</p>`,
  deep:`<p><b>The defining risk.</b> AI mainly compresses the <em>build</em> step \u2014 so if you don\u2019t know <em>what</em> is worth building, AI just lets you build the wrong thing faster. The PM\u2019s value rises, not falls: outcome clarity, prioritisation, and discovery become the bottleneck and the differentiator. Treat AI as leverage on a clear strategy, not a substitute for one.</p>
  <p><b>Agentic delivery, done responsibly.</b> Keep humans in the loop at decision and quality gates; apply the Lean idea of <em>jidoka</em> \u2014 guardrails and confidence thresholds that stop and escalate rather than ship a low-confidence result; and keep prioritisation and accountability human. Build evals for agent outputs the way you\u2019d build acceptance criteria for a story.</p>
  <p><b>Prove it with metrics.</b> Don\u2019t trust vibes \u2014 test whether AI actually improves delivery using <em>flow metrics</em> (cycle time, throughput) and <em>DORA</em> (lead time, deployment frequency, change-failure rate). If lead time drops without change-failure rising, the investment is real. And manage the change: tools shift roles, so re-skill the team toward higher-judgement work (discovery, outcome design, agent supervision).</p>`,
  exercises:[
    { type:'classify', prompt:'Where does this AI capability help most?',
      categories:['Discovery / backlog','Planning / estimation','Execution / reporting','Review / retro'],
      items:[
        { text:'Draft user stories and acceptance criteria from a brief', answer:0 },
        { text:'Flag dependencies and risky items before planning', answer:1 },
        { text:'Summarise standups and auto-write status reports', answer:2 },
        { text:'Cluster retrospective feedback into themes', answer:3 },
        { text:'Synthesise user-research interviews into insights', answer:0 } ],
      solution:`<p>Story/AC drafting and research synthesis serve discovery; dependency/risk detection serves planning; standup/status automation serves execution; theme-clustering serves the retro.</p>` },
    { type:'mcq', prompt:'Using AI well.',
      questions:[
        { text:'The biggest risk of AI-accelerated delivery for a PM is…', options:['Typing speed','Building the wrong thing faster when outcomes are unclear','Too few meetings','Smaller backlogs'], correct:1 },
        { text:'Agentic delivery should keep…', options:['No humans involved','Humans accountable for prioritisation/outcomes, with guardrails and human-in-the-loop','Agents fully unsupervised','Only waterfall'], correct:1 },
        { text:'To prove AI actually helps delivery, track…', options:['Vibes','Flow and DORA metrics (lead time, throughput, change-failure)','Lines of code','Headcount'], correct:1 } ],
      solution:`<p>Clarity of outcome matters more as building gets cheaper; keep humans accountable with guardrails; and measure impact with flow/DORA, not impressions.</p>` },
    { type:'worksheet', prompt:'Template \u2014 scope an AI/agent assist for your delivery (the AI use-case canvas). Saved on this device.',
      template:{ kind:'aicanvas' } }
  ]
},

/* ===== CASES & PRACTICE ===== */
{
  id:'ag15', area:'agile', track:'Cases & practice', title:'Case A \u2014 rescue a water-scrum-fall team', min:30,
  concept:`<p><b>Scenario.</b> A 9-person team "does Agile": two-week sprints, daily standups, a board. Yet delivery is slow and morale is low. On inspection: releases happen in a <em>quarterly big-bang</em> behind a change-advisory gate; the Product Owner is a proxy who relays decisions from a monthly steering committee; retrospectives run but nothing ever changes; and a manager posts a league table of each team\u2019s velocity. This is textbook <strong>water-scrum-fall</strong> with several compounding anti-patterns \u2014 the ceremonies are present, the principles are absent.</p>
  <p>Your job as the incoming delivery lead: diagnose precisely, then sequence the highest-leverage fixes.</p>`,
  deep:`<p><b>Diagnosis.</b> The root cause is <em>batch size and feedback latency</em>: a quarterly release means the team learns whether it built the right thing once every three months, so it cannot truly inspect-and-adapt no matter how many standups it holds. The proxy PO removes decision-making from the team\u2019s cadence; the dead retro removes the adaptation loop; the velocity league table corrupts estimation. </p>
  <p><b>Sequencing the fix.</b> (1) <em>Reduce batch size</em> \u2014 move toward smaller, more frequent releases (even behind a feature flag) to create real feedback; this single change unlocks everything else. (2) <em>Empower the PO</em> \u2014 give one person genuine priority authority at sprint cadence, with the steering committee shifting to outcome reviews. (3) <em>Make the retro bite</em> \u2014 one owned, time-boxed improvement per sprint, reviewed next time. (4) <em>Fix the metrics culture</em> \u2014 kill the velocity league table; if you must report, use flow metrics (cycle time, throughput) and outcomes. Tackle release-batch and PO authority first because they remove the structural blockers; the metric and retro fixes restore the learning loop.</p>`,
  exercises:[
    { type:'classify', prompt:'Match each symptom to the right fix.',
      categories:['Empower the PO','Shorten feedback / smaller releases','Restore inspect-and-adapt','Fix the metrics culture'],
      items:[
        { text:'PO can\u2019t decide priorities; a monthly steering committee does', answer:0 },
        { text:'Releases happen once a quarter in a big bang', answer:1 },
        { text:'Retros run but produce no real change', answer:2 },
        { text:'Managers publish a velocity league table across teams', answer:3 } ],
      solution:`<p>Powerless PO \u2192 empower; quarterly big-bang \u2192 smaller/more-frequent releases; dead retro \u2192 restore adaptation; velocity league table \u2192 fix the metrics culture.</p>` },
    { type:'mcq', prompt:'First move.',
      questions:[
        { text:'The first high-leverage move to break water-scrum-fall is usually…', options:['Buy SAFe','Reduce batch size \u2014 ship smaller and more often to get real feedback','Add more documentation and gates','Replace the whole team'], correct:1 } ],
      solution:`<p>Smaller, more frequent releases restore the fast feedback that all of Agile depends on \u2014 the structural fix that makes the other improvements meaningful.</p>` }
  ]
},
{
  id:'ag16', area:'agile', track:'Cases & practice', title:'Case B \u2014 scale up, and sequence with WSJF', min:30,
  concept:`<p><b>Scenario.</b> One successful Scrum team on a growing product must become <em>four</em> teams. Leadership is debating frameworks \u2014 some want SAFe immediately, others a lighter Scrum-of-Scrums or LeSS. Meanwhile the combined backlog has more high-value items than capacity, with painful cross-team dependencies. You need two decisions: <em>which scaling approach</em>, and <em>how to sequence the backlog</em>.</p>
  <p>For sequencing you\u2019ll use <strong>WSJF</strong> = Cost of Delay \u00F7 Job Size \u2014 do the highest WSJF first.</p>`,
  deep:`<p><b>Scaling choice.</b> Four teams on one product is the home ground for the <em>lightest</em> coordination that works \u2014 keep a single Product Backlog and Product Owner accountability and add a Scrum-of-Scrums or adopt LeSS, while actively <em>descaling</em> dependencies (organise teams around features, not components, so they can deliver end-to-end). Reach for SAFe only when scale, regulatory governance and the need for synchronised, executive-visible PI Planning genuinely exceed what a lighter model can hold \u2014 typically many teams and multiple ARTs, not four teams. Adopting SAFe\u2019s overhead for four teams usually adds process without solving the real problem (dependencies), which descaling addresses directly.</p>
  <p><b>WSJF practice.</b> WSJF rewards small, high-value, time-critical work \u2014 exactly what you want when capacity is the binding constraint. Compute it per item and order descending. Note how a smaller job with the same Cost of Delay outranks a big one, and how a huge but lower-value item sinks.</p>`,
  exercises:[
    { type:'numeric', prompt:'Sequence three backlog items with WSJF = Cost of Delay \u00F7 Job Size.',
      fields:[
        { label:'Item A \u2014 CoD 20, Job Size 4 \u2192 WSJF', answer:5, tol:0.1 },
        { label:'Item B \u2014 CoD 18, Job Size 2 \u2192 WSJF', answer:9, tol:0.1 },
        { label:'Item C \u2014 CoD 30, Job Size 10 \u2192 WSJF', answer:3, tol:0.1 },
        { label:'WSJF of the item you should do FIRST', answer:9, tol:0.1 } ],
      solution:`<p>A = 20/4 = 5, B = 18/2 = 9, C = 30/10 = 3. Highest WSJF first \u2192 Item B (9). Note the largest Cost of Delay (C) ranks last because its job size is huge \u2014 WSJF favours small, valuable, urgent work.</p>` },
    { type:'classify', prompt:'Lighter scaling, or reach for SAFe?',
      categories:['Start light (LeSS / Scrum-of-Scrums)','Reach for SAFe'],
      items:[
        { text:'4 teams, one product, want minimal extra process', answer:0 },
        { text:'Hundreds of people, multiple ARTs, heavy compliance and top-down alignment', answer:1 },
        { text:'Keep one shared Product Backlog and one PO across teams', answer:0 },
        { text:'Need synchronised PI cadence and portfolio governance at enterprise scale', answer:1 } ],
      solution:`<p>A handful of teams on one product wants the lightest coordination (LeSS/Scrum-of-Scrums) plus descaling; SAFe earns its overhead only at large, governance-heavy, multi-ART scale.</p>` },
    { type:'mcq', prompt:'Scaling principle.',
      questions:[
        { text:'A sound scaling principle is…', options:['Scale the org chart first','Descale the problem (remove dependencies) before adding framework','Always pick the biggest framework available','Split the backlog so each team has its own'], correct:1 } ],
      solution:`<p>Reduce dependencies (teams around features, one shared backlog) before layering on heavy process \u2014 most "scaling pain" is dependency pain.</p>` }
  ]
}

/* ---- storage shim ---- */
const mem={};
const Store={
  async get(k){ if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){return null;}} try{return localStorage.getItem(k);}catch(e){return mem[k]??null;} },
  async set(k,v){ if(window.storage){try{await window.storage.set(k,v);return;}catch(e){}} try{localStorage.setItem(k,v);}catch(e){mem[k]=v;} }
};
const KEY='pyquest:v2';

const DATA={ python:CURRICULUM, lean:LEAN, agile:AGILE };
let AREA='python', IDX=0;
let state={ completed:{}, solved:{}, code:{}, xp:0, area:'python', last:{python:0,lean:0,agile:0}, lang:'en', depth:'beginner' };
function nounFor(a){ return t(a==='lean'?'modules':'lessons'); }

/* ---- pyodide + data packages ---- */
let pyodide=null, pyReady=false, pyFailed=false, dataReady=false, dataLoading=null;
const elStatus=document.getElementById('pyStatus'), elStatusText=document.getElementById('pyStatusText');
async function initPy(){
  try{ pyodide=await loadPyodide(); pyReady=true; elStatus.classList.add('ready'); elStatusText.textContent=t('pyReady');
    document.querySelectorAll('.run').forEach(b=>b.disabled=false); }
  catch(e){ pyFailed=true; elStatus.classList.add('error'); elStatusText.textContent=t('pyOffline'); }
}
function ensureData(){
  if(dataReady) return Promise.resolve(true);
  if(!pyReady) return Promise.resolve(false);
  if(!dataLoading) dataLoading=pyodide.loadPackage(['numpy','pandas']).then(()=>{dataReady=true;return true;}).catch(()=>false);
  return dataLoading;
}
let vizReady=false, vizLoading=null;
function ensureViz(){
  if(vizReady) return Promise.resolve(true);
  if(!pyReady) return Promise.resolve(false);
  if(!vizLoading) vizLoading=pyodide.loadPackage(['numpy','pandas','matplotlib']).then(()=>{dataReady=true;vizReady=true;return true;}).catch(()=>false);
  return vizLoading;
}
const VIZ_PRE="import matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\nplt.close('all')\n";
const VIZ_EPI="\nimport io as _io, base64 as _b64, json as _json\n_imgs=[]\nfor _n in plt.get_fignums():\n    _f=plt.figure(_n)\n    _bb=_io.BytesIO(); _f.savefig(_bb, format='png', dpi=110, bbox_inches='tight')\n    _imgs.append(_b64.b64encode(_bb.getvalue()).decode())\nplt.close('all')\n_json.dumps(_imgs)";
async function pyRunViz(code){
  let buf=''; pyodide.setStdout({batched:s=>buf+=s}); pyodide.setStderr({batched:s=>buf+=s});
  try{ const ns=pyodide.runPython('dict()'); await pyodide.runPythonAsync(VIZ_PRE+code,{globals:ns}); const val=await pyodide.runPythonAsync(VIZ_EPI,{globals:ns}); ns.destroy(); let imgs=[]; try{imgs=JSON.parse(val);}catch(e){} return {output:buf,error:null,imgs}; }
  catch(e){ return {output:buf,error:cleanErr(e.message||e),imgs:[]}; }
}
async function pyCheckViz(userCode,ex){
  let buf=''; pyodide.setStdout({batched:s=>buf+=s}); pyodide.setStderr({batched:s=>buf+=s});
  const ns=pyodide.runPython('dict()'); let imgs=[];
  try{ await pyodide.runPythonAsync(VIZ_PRE+userCode+'\n'+ex.check.setup,{globals:ns}); }
  catch(e){ ns.destroy(); return {ok:false,output:buf,msg:t('raised')+cleanErr(e.message||e),imgs}; }
  let ok=true,msg=t('okChecks');
  try{ await pyodide.runPythonAsync(ex.check.asserts,{globals:ns}); }
  catch(e){ ok=false; msg=cleanErr(e.message||e); }
  try{ const val=await pyodide.runPythonAsync(VIZ_EPI,{globals:ns}); imgs=JSON.parse(val||'[]'); }catch(e){}
  ns.destroy(); return {ok,output:buf,msg,imgs};
}
function renderImgs(out,imgs){ if(!imgs||!imgs.length) return; imgs.forEach(b=>{ const im=document.createElement('img'); im.src='data:image/png;base64,'+b; im.alt='chart'; out.appendChild(im); }); }
function cleanErr(msg){ const L=String(msg).trim().split('\n').filter(Boolean); for(let i=L.length-1;i>=0;i--){ if(/Error|Exception/.test(L[i])) return L[i].trim(); } return L[L.length-1]||String(msg); }
async function pyRun(code){
  let buf=''; pyodide.setStdout({batched:s=>buf+=s}); pyodide.setStderr({batched:s=>buf+=s});
  try{ const ns=pyodide.runPython('dict()'); await pyodide.runPythonAsync(code,{globals:ns}); ns.destroy(); return {output:buf,error:null}; }
  catch(e){ return {output:buf,error:cleanErr(e.message||e)}; }
}
async function pyCheck(userCode,ex){
  let buf=''; pyodide.setStdout({batched:s=>buf+=s}); pyodide.setStderr({batched:s=>buf+=s});
  const ns=pyodide.runPython('dict()');
  try{ await pyodide.runPythonAsync(userCode,{globals:ns}); }
  catch(e){ ns.destroy(); return {ok:false,output:buf,msg:t('raised')+cleanErr(e.message||e)}; }
  if(ex.check.kind==='output'){ const ok=ex.check.match(buf); ns.destroy(); return {ok,output:buf,msg:ok?t('okMatch'):t('noMatch')}; }
  try{ await pyodide.runPythonAsync('__output__ = '+JSON.stringify(buf)+'\n'+ex.check.test,{globals:ns}); ns.destroy(); return {ok:true,output:buf,msg:t('okChecks')}; }
  catch(e){ ns.destroy(); return {ok:false,output:buf,msg:cleanErr(e.message||e)}; }
}

/* ---- editor ---- */
function makeEditor(initial){
  const ta=document.createElement('textarea'); ta.className='editor'; ta.spellcheck=false; ta.value=initial||'';
  ta.rows=Math.min(16,Math.max(4,(initial||'').split('\n').length+1));
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+4; }
    else if(e.key==='Enter' && !(e.ctrlKey||e.metaKey)){ const s=ta.selectionStart; const line=ta.value.slice(0,s).split('\n').pop(); const indent=(line.match(/^\s*/)||[''])[0]; const extra=/:\s*$/.test(line)?'    ':''; e.preventDefault(); const ins='\n'+indent+extra; ta.value=ta.value.slice(0,s)+ins+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s+ins.length; }
  });
  return ta;
}

/* ---- persistence ---- */
let saveTimer=null;
function save(){ state.lang=lang; clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.set(KEY,JSON.stringify(state)),250); }
async function load(){
  const raw=await Store.get(KEY);
  if(raw){ try{ const p=JSON.parse(raw); state=Object.assign(state,p); state.completed=p.completed||{}; state.solved=p.solved||{}; state.code=p.code||{}; state.last=p.last||{python:0,lean:0}; }catch(e){} }
  AREA=state.area||'python'; IDX=(state.last&&state.last[AREA])||0; lang=state.lang||'en';
}

/* ---- progress ---- */
function areaLessons(a){ return DATA[a]; }
function doneInArea(a){ return areaLessons(a).filter(l=>state.completed[l.id]).length; }
function updateProgress(){
  const list=areaLessons(AREA), done=doneInArea(AREA);
  document.getElementById('barFill').style.width=(list.length?done/list.length*100:0)+'%';
  document.querySelector('.pmeta').innerHTML='<b>'+done+'</b> / '+list.length+' '+nounFor(AREA);
  document.getElementById('xpPill').textContent=state.xp+' XP';
}
function markSolved(key,xp){ if(!state.solved[key]){ state.solved[key]=true; state.xp+=(xp||10); } }
function isGradable(ex){ return ex && ex.type!=='worksheet'; }
function maybeComplete(lesson){ const keys=[]; lesson.exercises.forEach((ex,i)=>{ if(isGradable(ex)) keys.push(lesson.id+'-'+i); }); const all=keys.length>0 && keys.every(k=>state.solved[k]); if(all&&!state.completed[lesson.id]) state.completed[lesson.id]=true; return all; }

/* ---- chrome labels ---- */

  document.getElementById('brandSub').textContent=t('brandSub');
  document.getElementById('refBtn').textContent=t('reference');

/* ---- sidebar ---- */
function buildSidebar(){
  const nav=document.getElementById('sidebar'); nav.innerHTML='';
  const sw=document.createElement('div'); sw.className='area-switch';
  sw.innerHTML=`<button class="aswitch ${AREA==='python'?'on':''}" data-a="python">&gt;&gt;&gt; Python</button><button class="aswitch ${AREA==='lean'?'on':''}" data-a="lean">\u25BF LEAN</button><button class="aswitch ${AREA==='agile'?'on':''}" data-a="agile">\u25C6 Agile</button>`;
  nav.appendChild(sw);
  sw.querySelectorAll('.aswitch').forEach(b=>b.addEventListener('click',()=>switchArea(b.dataset.a)));
  const list=areaLessons(AREA), groups=[];
  list.forEach((l,i)=>{ let g=groups.find(x=>x.track===l.track); if(!g){g={track:l.track,items:[]};groups.push(g);} g.items.push({l,i}); });
  groups.forEach(g=>{
    const gd=document.createElement('div'); gd.className='track-group t-'+g.track.replace(/[^A-Za-z]/g,'');
    gd.innerHTML='<div class="track-label">'+g.track+'</div>';
    g.items.forEach(({l,i})=>{
      const b=document.createElement('button');
      b.className='lnav'+(i===IDX?' active':'')+(state.completed[l.id]?' done':'');
      b.innerHTML='<span class="lcode">'+l.id.toUpperCase()+'</span><span class="tick">\u2713</span>'+l.title;
      b.addEventListener('click',()=>{ IDX=i; state.last[AREA]=i; save(); render(); if(window.innerWidth<=880) document.getElementById('sidebar').classList.remove('open'); });
      gd.appendChild(b);
    });
    nav.appendChild(gd);
  });
}
function switchArea(a){ if(a===AREA) return; AREA=a; state.area=a; IDX=state.last[a]||0; save(); render(); }

/* ---- render ---- */
function render(){
  relabelChrome(); buildSidebar(); updateProgress();
  document.getElementById('refBtn').style.display=''; // reference available in both areas
  const lesson=areaLessons(AREA)[IDX];
  const c=document.getElementById('content'); c.innerHTML=''; window.scrollTo(0,0);
  const eyebrow=document.createElement('div'); eyebrow.className='eyebrow';
  eyebrow.innerHTML=lesson.id.toUpperCase()+' <span class="dot">/</span> '+lesson.track; c.appendChild(eyebrow);
  const h=document.createElement('h1'); h.className='l-title'; h.textContent=lesson.title; c.appendChild(h);
  const sub=document.createElement('div'); sub.className='l-sub'; sub.innerHTML='<span>~'+lesson.min+' '+t('min')+'</span>';
  const mark=document.createElement('button'); mark.className='mark'+(state.completed[lesson.id]?' done':''); mark.textContent=state.completed[lesson.id]?t('completed'):t('markComplete');
  mark.addEventListener('click',()=>{ state.completed[lesson.id]=!state.completed[lesson.id]; save(); render(); });
  sub.appendChild(mark); c.appendChild(sub);
  if(lesson.deep){
    const seg=document.createElement('div'); seg.className='depth-switch';
    const bBeg=document.createElement('button'); bBeg.className='dseg'; bBeg.textContent=t('beginner');
    const bDeep=document.createElement('button'); bDeep.className='dseg'; bDeep.textContent=t('deepDive');
    seg.appendChild(bBeg); seg.appendChild(bDeep); c.appendChild(seg);
    const begDiv=document.createElement('div'); begDiv.className='concept'; begDiv.innerHTML=lesson.concept; c.appendChild(begDiv);
    const deepDiv=document.createElement('div'); deepDiv.className='concept deep'; deepDiv.innerHTML=lesson.deep; c.appendChild(deepDiv);
    const setDepth=d=>{ state.depth=d; save(); const dp=d==='deep'; bDeep.classList.toggle('on',dp); bBeg.classList.toggle('on',!dp); deepDiv.style.display=dp?'block':'none'; begDiv.style.display=dp?'none':'block'; };
    bBeg.addEventListener('click',()=>setDepth('beginner')); bDeep.addEventListener('click',()=>setDepth('deep'));
    setDepth(state.depth==='deep'?'deep':'beginner');
  } else {
    const concept=document.createElement('div'); concept.className='concept'; concept.innerHTML=lesson.concept; c.appendChild(concept);
  }
  if(lesson.visual){ attachSvg(c, chartSVG(lesson.visual), lesson.id+'-'+lesson.visual.type, {caption:lesson.visual.caption}); }
  if(AREA==='python') renderPython(lesson,c); else renderLean(lesson,c);
  const list=areaLessons(AREA), foot=document.createElement('div'); foot.className='lfoot';
  const prev=document.createElement('button'); prev.className='navbtn'; prev.disabled=IDX===0;
  prev.innerHTML='<small>'+t('prev')+'</small>'+(IDX>0?list[IDX-1].title:t('none'));
  prev.addEventListener('click',()=>{ IDX--; state.last[AREA]=IDX; save(); render(); });
  const next=document.createElement('button'); next.className='navbtn next'; next.disabled=IDX===list.length-1;
  next.innerHTML='<small>'+t('next')+'</small>'+(IDX<list.length-1?list[IDX+1].title:t('none'));
  next.addEventListener('click',()=>{ IDX++; state.last[AREA]=IDX; save(); render(); });
  foot.appendChild(prev); foot.appendChild(next); c.appendChild(foot);
}

/* ---- python body ---- */
function renderPython(lesson,c){
  const isData=lesson.track==='Data', isViz=lesson.track==='Visualize';
  const need = isViz?'viz':(isData?'data':'');
  if(isData||isViz){ const dn=document.createElement('div'); dn.className='data-note'; dn.innerHTML=isViz?t('vizNote'):t('dataNote'); c.appendChild(dn); }
  if(lesson.example){
    const blk=document.createElement('div'); blk.className='block';
    blk.innerHTML='<div class="block-head"><span class="tag"><span class="prompt">&gt;&gt;&gt;</span> '+t('exampleTag').replace('>>> ','')+'</span></div>';
    const ed=makeEditor(lesson.example); blk.appendChild(ed);
    const act=document.createElement('div'); act.className='block-actions';
    const run=document.createElement('button'); run.className='run'; if(need) run.dataset.needsData='1'; run.disabled=!pyReady; run.innerHTML=t('run');
    const rh=document.createElement('span'); rh.className='run-hint'; rh.textContent=t('runHint');
    const out=document.createElement('div'); out.className='console';
    run.addEventListener('click',()=>isViz?doRunViz(run,ed,out,need):doRun(run,ed,out,need));
    ed.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); run.click(); } });
    act.appendChild(run); act.appendChild(rh); blk.appendChild(act); blk.appendChild(out); c.appendChild(blk);
  }
  lesson.exercises.forEach((ex,i)=>{
    const key=lesson.id+'-'+i;
    const blk=document.createElement('div'); blk.className='block';
    blk.innerHTML='<div class="block-head"><span class="tag">'+t('exercise')+' '+(i+1)+(state.solved[key]?' \u2713':'')+'</span></div><div class="ex-prompt">'+ex.prompt+'</div>';
    const ed=makeEditor(state.code[key]!=null?state.code[key]:ex.starter);
    ed.addEventListener('input',()=>{ state.code[key]=ed.value; save(); }); blk.appendChild(ed);
    const hint=document.createElement('div'); hint.className='hintbox'; hint.innerHTML='<b>'+t('showHint').replace(/^Show |^Ver /,'')+':</b> <code>'+ex.hint+'</code>'; blk.appendChild(hint);
    const act=document.createElement('div'); act.className='block-actions';
    const run=document.createElement('button'); run.className='run check'; if(need) run.dataset.needsData='1'; run.disabled=!pyReady; run.innerHTML=t('check');
    const hbtn=document.createElement('button'); hbtn.className='ghost'; hbtn.textContent=t('showHint');
    hbtn.addEventListener('click',()=>{ hint.classList.toggle('show'); hbtn.textContent=hint.classList.contains('show')?t('hideHint'):t('showHint'); });
    const res=document.createElement('div'); res.className='result'; const out=document.createElement('div'); out.className='console';

function shortLabel(str){ str=String(str); return str.length>16?str.slice(0,15)+'\u2026':str; }

function paretoSVG(data){
  const items=data.slice().sort(function(a,b){return b.value-a.value;});
  const W=580,H=300,mL=46,mR=46,mT=18,mB=66, pw=W-mL-mR, ph=H-mT-mB;
  const total=items.reduce(function(s,d){return s+d.value;},0)||1;
  const maxV=Math.max.apply(null,items.map(function(d){return d.value;}))||1;
  const n=items.length, gap=pw/n, bw=gap*0.6;
  var bars='',labels='',pts=[],cum=0;
  items.forEach(function(d,i){
    var x=mL+gap*i+(gap-bw)/2, h=ph*(d.value/maxV), y=mT+ph-h;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="#3b6fb5"/>';
    bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#46526a">'+d.value+'</text>';
    cum+=d.value; var cy=mT+ph-ph*(cum/total);
    pts.push([mL+gap*i+gap/2,cy]);
    labels+='<text x="'+(mL+gap*i+gap/2).toFixed(1)+'" y="'+(mT+ph+16).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#69748a">'+shortLabel(d.label)+'</text>';
  });
  var line='<polyline fill="none" stroke="#cc9f00" stroke-width="2.5" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
  var dots=pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="#cc9f00"/>';}).join('');
  var y80=mT+ph-ph*0.8;
  var ref='<line x1="'+mL+'" y1="'+y80.toFixed(1)+'" x2="'+(W-mR)+'" y2="'+y80.toFixed(1)+'" stroke="#d65a5a" stroke-dasharray="5 4" stroke-width="1.3"/><text x="'+(W-mR)+'" y="'+(y80-5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#d65a5a">80% line</text>';
  var axis='<line x1="'+mL+'" y1="'+mT+'" x2="'+mL+'" y2="'+(mT+ph)+'" stroke="#cbd3df"/><line x1="'+mL+'" y1="'+(mT+ph)+'" x2="'+(W-mR)+'" y2="'+(mT+ph)+'" stroke="#cbd3df"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+axis+ref+bars+line+dots+labels+'</svg>';
}

function fishboneSVG(problem, cats){
  cats = cats || ['Manpower','Machine','Method','Material','Measurement','Environment'];
  var W=600,H=300,midY=150,headX=430,x0=40;
  function wrap(str){ str=String(str); var words=str.split(' '),lines=[],cur=''; words.forEach(function(w){ if((cur+' '+w).trim().length>16){ lines.push(cur.trim()); cur=w; } else cur+=' '+w; }); if(cur.trim())lines.push(cur.trim()); return lines.slice(0,2); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+x0+'" y1="'+midY+'" x2="'+headX+'" y2="'+midY+'" stroke="#11141b" stroke-width="2.5"/>';
  s+='<polygon points="'+headX+','+(midY-7)+' '+(headX+13)+','+midY+' '+headX+','+(midY+7)+'" fill="#11141b"/>';
  s+='<rect x="'+(headX+15)+'" y="'+(midY-32)+'" width="146" height="64" rx="8" fill="#11141b"/>';

  var top=cats.slice(0,3), bot=cats.slice(3,6), slots=[0.26,0.5,0.74];

  top.forEach(function(c,i){ s+=bone(x0+(headX-x0)*slots[i],-1,c); });

  s+='</svg>'; return s;

function chartSVG(spec){
  if(!spec) return '';
  if(spec.type==='pareto') return paretoSVG(spec.data);
  if(spec.type==='fishbone') return fishboneSVG(spec.problem,spec.categories);
  if(spec.type==='vsm') return vsmSVG(spec.steps,spec);
  if(spec.type==='barTakt') return barTaktSVG(spec.items,spec.takt);
  if(spec.type==='control') return controlChartSVG(spec);
  if(spec.type==='matrix') return matrixSVG(spec.items);
  if(spec.type==='burndown') return burndownSVG(spec);
  if(spec.type==='sprintcycle') return sprintCycleSVG();
  if(spec.type==='cfd') return cfdSVG(spec);
  if(spec.type==='velocity') return barsSVG(spec.items,{});
  if(spec.type==='waterfall') return ganttSVG(spec.phases);

}

function renderLean(lesson,c){
  lesson.exercises.forEach(function(ex,i){
    var key=lesson.id+'-'+i;
    var blk=document.createElement('div'); blk.className='block';
    var tag = ex.type==='worksheet'?t('template'):(ex.type==='mcq'?t('quiz'):(ex.type==='classify'?t('exercise'):t('calc')));
    blk.innerHTML='<div class="block-head"><span class="tag">'+tag+' '+(i+1)+(isGradable(ex)&&state.solved[key]?' \u2713':'')+'</span></div><div class="ex-prompt">'+ex.prompt+'</div>';
    var body=document.createElement('div'); body.style.padding='4px 16px 0';
    if(ex.table){ var tb=document.createElement('div'); tb.innerHTML=ex.table; body.appendChild(tb); }
    var vis=buildVisual(ex); if(vis){ attachSvg(body, vis, lesson.id+'-'+i); }

    if(ex.type==='worksheet'){
      var ws=buildWorksheet(ex.template,key); body.appendChild(ws.el); blk.appendChild(body);
      var actw=document.createElement('div'); actw.className='block-actions';
