      var dlw=document.createElement('button'); dlw.className='ghost'; dlw.textContent='\u2193 '+t('download'); dlw.addEventListener('click',function(){ downloadText(worksheetMarkdown(ws.el, lesson.title), lesson.id+'-worksheet-'+i+'.md','text/markdown'); });
      var note=document.createElement('div'); note.className='ws-note'; note.textContent=t('wsNote');
      actw.appendChild(clr); actw.appendChild(dlw); actw.appendChild(note); blk.appendChild(actw); c.appendChild(blk); return;
    }

    var getResult;
    if(ex.type==='classify'){
      var rows=[];
      ex.items.forEach(function(it,ii){
        var row=document.createElement('div'); row.className='classify-row';
        var lab=document.createElement('div'); lab.className='cl-label'; lab.innerHTML=it.text;
        var sel=document.createElement('select'); sel.className='cl-select';
        var ph=document.createElement('option'); ph.value=''; ph.textContent='\u2014 choose \u2014'; sel.appendChild(ph);
        ex.categories.forEach(function(cat,ci){ var o=document.createElement('option'); o.value=String(ci); o.textContent=cat; sel.appendChild(o); });
        var sk='lean:'+key+':c'+ii; if(state.code[sk]!=null) sel.value=state.code[sk];
        sel.addEventListener('change',function(){ state.code[sk]=sel.value; save(); sel.classList.remove('ok','no'); });
        var mk=document.createElement('div'); mk.className='fmark';
        row.appendChild(lab); row.appendChild(sel); row.appendChild(mk);
        body.appendChild(row); rows.push({it:it,sel:sel,mk:mk});
      });
      getResult=function(){ var ok=true; rows.forEach(function(r){ var ans=typeof r.it.answer==='number'?r.it.answer:ex.categories.indexOf(r.it.answer); var good=r.sel.value!==''&&parseInt(r.sel.value)===ans; r.sel.classList.remove('ok','no'); r.sel.classList.add(good?'ok':'no'); r.mk.className='fmark '+(good?'ok':'no'); r.mk.textContent=good?'\u2713':'\u2717'; if(!good) ok=false; }); return ok; };
    } else if(ex.type==='numeric'){
      var inputs=[];
      ex.fields.forEach(function(f){
        var row=document.createElement('div'); row.className='field';
        var lab=document.createElement('div'); lab.className='flabel'; lab.innerHTML=f.label;
        var inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal';
        var sk='lean:'+key+':'+f.key; if(state.code[sk]!=null) inp.value=state.code[sk];
        inp.addEventListener('input',function(){ state.code[sk]=inp.value; save(); });
        var unit=document.createElement('div'); unit.className='funit'; unit.textContent=f.unit||'';
        var mk=document.createElement('div'); mk.className='fmark';
        row.appendChild(lab); row.appendChild(inp); row.appendChild(unit); row.appendChild(mk);
        body.appendChild(row); inputs.push({f:f,inp:inp,mk:mk});
      });
      getResult=function(){ var ok=true; inputs.forEach(function(o){ var v=parseFloat(String(o.inp.value).replace(',','.')); var good=!isNaN(v)&&Math.abs(v-o.f.answer)<=(o.f.tol||1e-4); o.inp.classList.remove('ok','no'); o.inp.classList.add(good?'ok':'no'); o.mk.className='fmark '+(good?'ok':'no'); o.mk.textContent=good?'\u2713':'\u2717'; if(!good) ok=false; }); return ok; };
    } else {
      var qs=[];
      ex.questions.forEach(function(q,qi){
        var qd=document.createElement('div'); qd.className='mcq-q'; qd.innerHTML='<div class="qtext">'+(qi+1)+'. '+q.text+'</div>';
        var opts=document.createElement('div'); opts.className='mcq-opts';
        var sk='lean:'+key+':q'+qi; var sel=state.code[sk]!=null?parseInt(state.code[sk]):-1; var btns=[];
        q.options.forEach(function(o,oi){ var ob=document.createElement('button'); ob.className='mcq-opt'+(sel===oi?' sel':''); ob.textContent=o;
          ob.addEventListener('click',function(){ sel=oi; state.code[sk]=String(oi); save(); btns.forEach(function(b){b.classList.remove('sel','ok','no');}); ob.classList.add('sel'); });
          opts.appendChild(ob); btns.push(ob); });
        qd.appendChild(opts); body.appendChild(qd); qs.push({q:q,btns:btns,getSel:function(){return sel;}});
      });
      getResult=function(){ var ok=true; qs.forEach(function(o){ var sel=o.getSel(); o.btns.forEach(function(b,bi){ b.classList.remove('ok','no','sel'); if(bi===o.q.correct) b.classList.add('ok'); else if(bi===sel) b.classList.add('no'); }); if(sel!==o.q.correct) ok=false; }); return ok; };
    }
    blk.appendChild(body);
    var sol=document.createElement('div'); sol.className='solbox'; sol.innerHTML='<b>'+t('workedSolution')+'</b> '+ex.solution;
    var act=document.createElement('div'); act.className='block-actions';
    var check=document.createElement('button'); check.className='run check'; check.innerHTML=t('check');
    var sbtn=document.createElement('button'); sbtn.className='ghost'; sbtn.textContent=t('showSol');
    sbtn.addEventListener('click',function(){ sol.classList.toggle('show'); sbtn.textContent=sol.classList.contains('show')?t('hideSol'):t('showSol'); });
    var res=document.createElement('div'); res.className='result';
    check.addEventListener('click',function(){ var ok=getResult(); res.className='result '+(ok?'ok':'no'); res.textContent=ok?t('allCorrect'):t('someOff');
      if(ok){ markSolved(key,15); maybeComplete(lesson); save(); buildSidebar(); updateProgress(); var head=blk.querySelector('.tag'); if(head&&!/\u2713/.test(head.textContent)) head.textContent+=' \u2713'; } });
    act.appendChild(check); act.appendChild(sbtn); act.appendChild(res); blk.appendChild(act); blk.appendChild(sol); c.appendChild(blk);
  });
}

async function replRun(){
  const code=replIn.value; if(!code.trim()) return;
  const echo=document.createElement('div'); echo.className='in'; echo.textContent='>>> '+code.replace(/\n/g,'\n... '); replOut.appendChild(echo);
  if(!pyReady){ const e=document.createElement('div'); e.className='err'; e.textContent=pyFailed?t('pyOffline'):t('pyLoading'); replOut.appendChild(e); replOut.scrollTop=replOut.scrollHeight; return; }
  if(!replNs) replNs=pyodide.runPython('dict()');
  let buf=''; pyodide.setStdout({batched:s=>buf+=s}); pyodide.setStderr({batched:s=>buf+=s});
  try{ const val=await pyodide.runPythonAsync(code,{globals:replNs});
    if(buf){ const o=document.createElement('div'); o.textContent=buf; replOut.appendChild(o); }
    if(val!==undefined&&val!==null){ const o=document.createElement('div'); o.textContent=String(val); replOut.appendChild(o); if(val&&val.destroy) try{val.destroy();}catch(e){} }
  }catch(e){ if(buf){ const o=document.createElement('div'); o.textContent=buf; replOut.appendChild(o);} const er=document.createElement('div'); er.className='err'; er.textContent=cleanErr(e.message||e); replOut.appendChild(er); }
  replIn.value=''; replOut.scrollTop=replOut.scrollHeight;
}
document.getElementById('replRun').addEventListener('click',replRun);
replIn.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); replRun(); } });

function _clampScore(n){ n=parseInt(n); if(isNaN(n))n=3; return Math.max(1,Math.min(5,n)); }
function normalizeUC(o){ o=o||{}; return { title:String(o.title||'Untitled use case'), waste:String(o.waste||'\u2014'), agents:String(o.agents||''), orchestration:String(o.orchestration||''), mapCurrent:String(o.mapCurrent||o.current||''), mapFuture:String(o.mapFuture||o.future||''), outcomes:(Array.isArray(o.outcomes)?o.outcomes:[]).slice(0,3).map(String), effortScore:_clampScore(o.effortScore), valueScore:_clampScore(o.valueScore) }; }
function pickFallback(proc){
  var q=String(proc||'').toLowerCase();
  var scored=USE_CASE_LIB.map(function(u){ var sc=0; (u.tags||[]).forEach(function(t){ if(q.indexOf(t)>=0) sc++; }); return {u:u,sc:sc}; });
  scored.sort(function(a,b){ return b.sc-a.sc; });
  if(scored[0].sc===0) return [USE_CASE_LIB[0],USE_CASE_LIB[1],USE_CASE_LIB[4],USE_CASE_LIB[3]].map(normalizeUC);
  return scored.slice(0,4).map(function(x){return normalizeUC(x.u);});
}
async function generateUseCases(proc){
  var prompt='You are a Lean Six Sigma + AI transformation expert in pharma commercial operations. For the business process: "'+proc+'", produce a JSON array of exactly 4 AI agent use cases that apply Lean thinking. Each object keys: title, waste (the single Lean waste it targets), agents (<=22 words on agent roles), orchestration (<=14 words: single-agent | multi-agent+orchestrator | human-in-the-loop), mapCurrent (<=12 words current pain), mapFuture (<=14 words future state with agents), outcomes (array of 3 short KPI strings), effortScore (integer 1-5), valueScore (integer 1-5). Output ONLY the JSON array \u2014 no markdown fences, no commentary.';
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  var data=await r.json();
  var text=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').trim();
  text=text.replace(/```json/gi,'').replace(/```/g,'').trim();
  var a=text.indexOf('['), b=text.lastIndexOf(']'); if(a>=0&&b>a) text=text.slice(a,b+1);
  var arr=JSON.parse(text);
  if(!Array.isArray(arr)||!arr.length) throw new Error('empty');
  return arr.slice(0,4).map(normalizeUC);
}
function buildPlan(uc){
  return [
    {p:'0 \u00B7 Discovery (2\u20134 wks)', d:'Map the current-state VSM, quantify the baseline ('+(uc.outcomes[0]||'lead time / quality')+'), define CTQs and success metrics, assess data readiness & feasibility, complete the AI use-case canvas.'},
    {p:'1 \u00B7 Pilot / PoC (4\u20138 wks)', d:'Build a minimal version \u2014 '+(uc.agents||'the agent')+' Keep humans in the loop; run on one team / therapy area and measure against the baseline.'},
    {p:'2 \u00B7 Scale (1\u20132 quarters)', d:'Productionise with '+(uc.orchestration||'orchestration')+' Add guardrails & monitoring (the Jidoka layer that halts on low confidence), MLOps and change management; roll out by class of service.'},
    {p:'3 \u00B7 Run & Control (ongoing)', d:'SPC on business KPIs and model metrics, standardised work, a named owner, and a kaizen loop to keep improving. Control is what makes the gain stick.'}
  ];
}
function pipelineMarkdown(items, proc){
  var L=['# AI Transformation Pipeline','','**Process:** '+proc,'_Generated in PyQuest \u2014 Lean \u00D7 AI_',''];
  items.forEach(function(uc,i){
    L.push('## '+(i+1)+'. '+uc.title);
    L.push('- **Lean waste:** '+uc.waste);
    L.push('- **Current:** '+uc.mapCurrent);
    L.push('- **Future (with agents):** '+uc.mapFuture);
    L.push('- **Agents:** '+uc.agents);
    L.push('- **Orchestration:** '+uc.orchestration);
    L.push('- **Value / outcomes:** '+uc.outcomes.join('; '));
    L.push('- **Value score:** '+uc.valueScore+'/5  ·  **Effort score:** '+uc.effortScore+'/5');
    L.push('');
    L.push('**Transformation plan**');
    buildPlan(uc).forEach(function(ph){ L.push('- *'+ph.p+'* \u2014 '+ph.d); });
    L.push('');
  });
  return L.join('\n');
}
function pipelineCSV(items){
  var rows=['Title,Lean waste,Value (1-5),Effort (1-5),Orchestration,Outcomes'];
  items.forEach(function(uc){ rows.push('"'+uc.title+'","'+uc.waste+'",'+uc.valueScore+','+uc.effortScore+',"'+uc.orchestration+'","'+uc.outcomes.join(' | ')+'"'); });
  return rows.join('\n');
}

var GUIDE_HTML='<div class="guide-body">'
 +'<div class="hero"><h2>PyQuest \u2014 learn it, then run it</h2><p>A hands-on Python course, a deep Lean curriculum, and a working <b>Lean \u00D7 AI Studio</b> to plan, prioritise and actually <b>run</b> optimisation programs \u2014 from value-stream map to AI agent pipeline to a live program cockpit and a board-ready deck.</p></div>'
 +'<h3>What\u2019s inside</h3><div class="pillars">'
 +'<div class="pillar"><b>\u{1F40D} Python</b><p>30 hands-on lessons that run in your browser (real Python via Pyodide), each with an under-the-hood deep dive.</p></div>'
 +'<div class="pillar"><b>\u{1F4D0} LEAN</b><p>23 modules from the House of Lean to DMAIC \u2014 beginner + expert depth, with real VSM, Pareto, control-chart and Yamazumi diagrams.</p></div>'
 +'<div class="pillar"><b>\u{1F501} Agile / PM</b><p>16 lessons — Scrum, Kanban, ceremonies, user stories, prioritisation, waterfall, SAFe and Agile\u00D7AI — with quizzes and cases, from a PM / PdM view.</p></div>'+'<div class="pillar"><b>\u2726 Lean \u00D7 AI Studio</b><p>An operating system to run programs: VSM builder, AI portfolio, prioritisation, execution and a program cockpit.</p></div>'
 +'</div>'
 +'<h3>Run a program in 6 steps</h3><div class="steps">'
 +'<div class="step"><div class="stepnum">1</div><div><b>Map</b> <span class="tab">VSM Builder</span><p>Model the current value stream and design a future state \u2014 eliminate steps and cut wait. See PCE, lead time, WIP and the bottleneck live.</p></div></div>'
 +'<div class="step"><div class="stepnum">2</div><div><b>Build</b> <span class="tab">AI Portfolio</span><p>Generate or add AI / agent use cases that attack the waste \u2014 each mapped to a Lean waste and an orchestration pattern.</p></div></div>'
 +'<div class="step"><div class="stepnum">3</div><div><b>Prioritise</b> <span class="tab">AI Portfolio</span><p>Score with RICE, see the value-vs-effort matrix, and quantify each business case (benefit, ROI, payback).</p></div></div>'
 +'<div class="step"><div class="stepnum">4</div><div><b>Execute</b> <span class="tab">Run / execute</span><p>Open an initiative: set owner & status, track milestones, run PDCA actions, and monitor KPIs with sparklines vs target.</p></div></div>'
 +'<div class="step"><div class="stepnum">5</div><div><b>Manage</b> <span class="tab">Cockpit</span><p>One Obeya view: portfolio value, roadmap Gantt, RAG status and KPI roll-ups across every initiative.</p></div></div>'
 +'<div class="step"><div class="stepnum">6</div><div><b>Cadence & report</b> <span class="tab">Cadence \u00B7 Export</span><p>Take a weekly snapshot, read \u201Cwhat changed\u201D, watch the trends \u2014 then export a McKinsey-style PowerPoint deck.</p></div></div>'
 +'</div>'
 +'<h3>The weekly cadence loop</h3><div class="loop"><b>Snapshot \u2192 review deltas \u2192 act.</b> In the Cadence tab, take a weekly snapshot. The Cockpit then shows \u0394 vs last week on every tile, and Cadence auto-summarises what moved \u2014 stage changes, milestones closed, KPI movements and value gained.</div>'
 +'<h3>Everywhere you go</h3><div class="feats"><span class="feat">\u2193 SVG / PNG diagrams</span><span class="feat">\u2193 CSV & Markdown</span><span class="feat">16 printable templates</span><span class="feat">PowerPoint export</span><span class="feat">EN / ES</span><span class="feat">Beginner / Expert depth</span><span class="feat">Auto-saved on device</span><span class="feat">Works offline once loaded</span></div>'

 +'</div>';
