/* ---- sidebar ---- */
function buildSidebar(){
  const nav=document.getElementById('sidebar'); nav.innerHTML='';
  const sw=document.createElement('div'); sw.className='area-switch';
  sw.innerHTML=`<button class="aswitch ${AREA==='python'?'on':''}" data-a="python">&gt;&gt;&gt; Python</button><button class="aswitch ${AREA==='lean'?'on':''}" data-a="lean">\u25BF LEAN</button>`;
  nav.appendChild(sw);
  sw.querySelectorAll('.aswitch').forEach(b=>b.addEventListener('click',()=>switchArea(b.dataset.a)));
  const list=areaLessons(AREA), groups=[];
  list.forEach((l,i)=>{ let g=groups.find(x=>x.track===l.track); if(!g){g={track:l.track,items:[]};groups.push(g);} g.items.push({l,i}); });
  groups.forEach(g=>{
    const gd=document.createElement('div'); gd.className='track-group t-'+g.track.replace(/[^A-Za-z]/g,'');
    gd.innerHTML='<div class="track-label">'+g.track+'</div>';
    g.items.forEach(({l,i})=>{
      const b=document.createElement('button');
      b.className='lnav'+(i===IDX?' active':'')+(state.completed[l.id]?' done':'');
      b.innerHTML='<span class="lcode">'+l.id.toUpperCase()+'</span><span class="tick">\u2713</span>'+l.title;
      b.addEventListener('click',()=>{ IDX=i; state.last[AREA]=i; save(); render(); if(window.innerWidth<=880) document.getElementById('sidebar').classList.remove('open'); });
      gd.appendChild(b);
    });
    nav.appendChild(gd);
  });
}
function switchArea(a){ if(a===AREA) return; AREA=a; state.area=a; IDX=state.last[a]||0; save(); render(); }

/* ---- render ---- */
function render(){
  relabelChrome(); buildSidebar(); updateProgress();
  document.getElementById('refBtn').style.display=''; // reference available in both areas
  const lesson=areaLessons(AREA)[IDX];
  const c=document.getElementById('content'); c.innerHTML=''; window.scrollTo(0,0);
  const eyebrow=document.createElement('div'); eyebrow.className='eyebrow';
  eyebrow.innerHTML=lesson.id.toUpperCase()+' <span class="dot">/</span> '+lesson.track; c.appendChild(eyebrow);
  const h=document.createElement('h1'); h.className='l-title'; h.textContent=lesson.title; c.appendChild(h);
  const sub=document.createElement('div'); sub.className='l-sub'; sub.innerHTML='<span>~'+lesson.min+' '+t('min')+'</span>';
  const mark=document.createElement('button'); mark.className='mark'+(state.completed[lesson.id]?' done':''); mark.textContent=state.completed[lesson.id]?t('completed'):t('markComplete');
  mark.addEventListener('click',()=>{ state.completed[lesson.id]=!state.completed[lesson.id]; save(); render(); });
  sub.appendChild(mark); c.appendChild(sub);
  if(lesson.deep){
    const seg=document.createElement('div'); seg.className='depth-switch';
    const bBeg=document.createElement('button'); bBeg.className='dseg'; bBeg.textContent=t('beginner');
    const bDeep=document.createElement('button'); bDeep.className='dseg'; bDeep.textContent=t('deepDive');
    seg.appendChild(bBeg); seg.appendChild(bDeep); c.appendChild(seg);
    const begDiv=document.createElement('div'); begDiv.className='concept'; begDiv.innerHTML=lesson.concept; c.appendChild(begDiv);
    const deepDiv=document.createElement('div'); deepDiv.className='concept deep'; deepDiv.innerHTML=lesson.deep; c.appendChild(deepDiv);
    const setDepth=d=>{ state.depth=d; save(); const dp=d==='deep'; bDeep.classList.toggle('on',dp); bBeg.classList.toggle('on',!dp); deepDiv.style.display=dp?'block':'none'; begDiv.style.display=dp?'none':'block'; };
    bBeg.addEventListener('click',()=>setDepth('beginner')); bDeep.addEventListener('click',()=>setDepth('deep'));
    setDepth(state.depth==='deep'?'deep':'beginner');
  } else {
    const concept=document.createElement('div'); concept.className='concept'; concept.innerHTML=lesson.concept; c.appendChild(concept);
  }
  if(AREA==='python') renderPython(lesson,c); else renderLean(lesson,c);
  const list=areaLessons(AREA), foot=document.createElement('div'); foot.className='lfoot';
  const prev=document.createElement('button'); prev.className='navbtn'; prev.disabled=IDX===0;
  prev.innerHTML='<small>'+t('prev')+'</small>'+(IDX>0?list[IDX-1].title:t('none'));
  prev.addEventListener('click',()=>{ IDX--; state.last[AREA]=IDX; save(); render(); });
  const next=document.createElement('button'); next.className='navbtn next'; next.disabled=IDX===list.length-1;
  next.innerHTML='<small>'+t('next')+'</small>'+(IDX<list.length-1?list[IDX+1].title:t('none'));
  next.addEventListener('click',()=>{ IDX++; state.last[AREA]=IDX; save(); render(); });
  foot.appendChild(prev); foot.appendChild(next); c.appendChild(foot);
}

/* ---- python body ---- */
function renderPython(lesson,c){
  const isData=lesson.track==='Data', isViz=lesson.track==='Visualize';
  const need = isViz?'viz':(isData?'data':'');
  if(isData||isViz){ const dn=document.createElement('div'); dn.className='data-note'; dn.innerHTML=isViz?t('vizNote'):t('dataNote'); c.appendChild(dn); }
  if(lesson.example){
    const blk=document.createElement('div'); blk.className='block';
    blk.innerHTML='<div class="block-head"><span class="tag"><span class="prompt">&gt;&gt;&gt;</span> '+t('exampleTag').replace('>>> ','')+'</span></div>';
    const ed=makeEditor(lesson.example); blk.appendChild(ed);
    const act=document.createElement('div'); act.className='block-actions';
    const run=document.createElement('button'); run.className='run'; if(need) run.dataset.needsData='1'; run.disabled=!pyReady; run.innerHTML=t('run');
    const rh=document.createElement('span'); rh.className='run-hint'; rh.textContent=t('runHint');
    const out=document.createElement('div'); out.className='console';
    run.addEventListener('click',()=>isViz?doRunViz(run,ed,out,need):doRun(run,ed,out,need));
    ed.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); run.click(); } });
    act.appendChild(run); act.appendChild(rh); blk.appendChild(act); blk.appendChild(out); c.appendChild(blk);
  }
  lesson.exercises.forEach((ex,i)=>{
    const key=lesson.id+'-'+i;
    const blk=document.createElement('div'); blk.className='block';
    blk.innerHTML='<div class="block-head"><span class="tag">'+t('exercise')+' '+(i+1)+(state.solved[key]?' \u2713':'')+'</span></div><div class="ex-prompt">'+ex.prompt+'</div>';
    const ed=makeEditor(state.code[key]!=null?state.code[key]:ex.starter);
    ed.addEventListener('input',()=>{ state.code[key]=ed.value; save(); }); blk.appendChild(ed);
    const hint=document.createElement('div'); hint.className='hintbox'; hint.innerHTML='<b>'+t('showHint').replace(/^Show |^Ver /,'')+':</b> <code>'+ex.hint+'</code>'; blk.appendChild(hint);
    const act=document.createElement('div'); act.className='block-actions';
    const run=document.createElement('button'); run.className='run check'; if(need) run.dataset.needsData='1'; run.disabled=!pyReady; run.innerHTML=t('check');
    const hbtn=document.createElement('button'); hbtn.className='ghost'; hbtn.textContent=t('showHint');
    hbtn.addEventListener('click',()=>{ hint.classList.toggle('show'); hbtn.textContent=hint.classList.contains('show')?t('hideHint'):t('showHint'); });
    const res=document.createElement('div'); res.className='result'; const out=document.createElement('div'); out.className='console';
    run.addEventListener('click',()=>isViz?doCheckViz(run,ed,out,res,ex,key,lesson,need):doCheck(run,ed,out,res,ex,key,lesson,need));
    ed.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); run.click(); } });
    act.appendChild(run); act.appendChild(hbtn); act.appendChild(res); blk.appendChild(act); blk.appendChild(out); c.appendChild(blk);
  });
  if(!pyReady && !pyFailed){ const tmr=setInterval(()=>{ if(pyReady){ document.querySelectorAll('.run').forEach(b=>b.disabled=false); clearInterval(tmr);} if(pyFailed) clearInterval(tmr); },300); }
}
async function prepRun(out,need){
  if(!pyReady){ out.classList.add('show'); out.innerHTML='<span class="sys">'+(pyFailed?t('pyOffline'):t('pyLoading'))+'</span>'; return false; }
  if(need && !(need==='viz'?vizReady:dataReady)){ out.classList.add('show'); out.innerHTML='<span class="sys">'+t('dataPrep')+'</span>'; const ok=await (need==='viz'?ensureViz():ensureData()); if(!ok){ out.innerHTML='<span class="err">'+t('pyOffline')+'</span>'; return false; } }
  return true;
}
async function doRunViz(btn,ed,out,need){
  if(!(await prepRun(out,need))) return;
  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=t('running'); out.classList.add('show');
  const r=await pyRunViz(ed.value); out.innerHTML='';
  if(r.output) out.appendChild(document.createTextNode(r.output));
  if(r.error){ const e=document.createElement('span'); e.className='err'; e.textContent=(r.output?'\n':'')+r.error; out.appendChild(e); }
  renderImgs(out,r.imgs);
  if(!r.output && !r.error && !(r.imgs&&r.imgs.length)) out.innerHTML='<span class="sys">'+t('noOutput')+'</span>';
  btn.disabled=false; btn.innerHTML=old;
}
async function doCheckViz(btn,ed,out,res,ex,key,lesson,need){
  if(!(await prepRun(out,need))) return;
  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=t('checking'); res.textContent='';
  const r=await pyCheckViz(ed.value,ex);
  res.className='result '+(r.ok?'ok':'no'); res.textContent=r.ok?t('passed'):t('notYet');
  out.classList.add('show'); out.innerHTML='';
  if(r.output) out.appendChild(document.createTextNode(r.output));
  const m=document.createElement('span'); m.className=r.ok?'sys':'err'; m.textContent=(r.output?'\n':'')+(r.ok?'# ':'')+r.msg; out.appendChild(m);
  renderImgs(out,r.imgs);
  if(r.ok){ markSolved(key,12); maybeComplete(lesson); save(); buildSidebar(); updateProgress(); const head=btn.closest('.block').querySelector('.tag'); if(head&&!/\u2713/.test(head.textContent)) head.textContent+=' \u2713'; }
  btn.disabled=false; btn.innerHTML=old;
}
async function doRun(btn,ed,out,needsData){
  if(!(await prepRun(out,needsData))) return;
  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=t('running'); out.classList.add('show');
  const r=await pyRun(ed.value); out.innerHTML='';
  if(r.output) out.appendChild(document.createTextNode(r.output));
  if(r.error){ const e=document.createElement('span'); e.className='err'; e.textContent=(r.output?'\n':'')+r.error; out.appendChild(e); }
  if(!r.output && !r.error) out.innerHTML='<span class="sys">'+t('noOutput')+'</span>';
  btn.disabled=false; btn.innerHTML=old;
}
async function doCheck(btn,ed,out,res,ex,key,lesson,needsData){
  if(!(await prepRun(out,needsData))) return;
  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=t('checking'); res.textContent='';
  const r=await pyCheck(ed.value,ex);
  res.className='result '+(r.ok?'ok':'no'); res.textContent=r.ok?t('passed'):t('notYet');
  out.classList.add('show'); out.innerHTML='';
  if(r.output) out.appendChild(document.createTextNode(r.output));
  const m=document.createElement('span'); m.className=r.ok?'sys':'err'; m.textContent=(r.output?'\n':'')+(r.ok?'# ':'')+r.msg; out.appendChild(m);
  if(r.ok){ markSolved(key,10); maybeComplete(lesson); save(); buildSidebar(); updateProgress(); const head=btn.closest('.block').querySelector('.tag'); if(head&&!/\u2713/.test(head.textContent)) head.textContent+=' \u2713'; }
  btn.disabled=false; btn.innerHTML=old;
}

function shortLabel(str){ str=String(str); return str.length>16?str.slice(0,15)+'\u2026':str; }

function paretoSVG(data){
  const items=data.slice().sort(function(a,b){return b.value-a.value;});
  const W=580,H=300,mL=46,mR=46,mT=18,mB=66, pw=W-mL-mR, ph=H-mT-mB;
  const total=items.reduce(function(s,d){return s+d.value;},0)||1;
  const maxV=Math.max.apply(null,items.map(function(d){return d.value;}))||1;
  const n=items.length, gap=pw/n, bw=gap*0.6;
  var bars='',labels='',pts=[],cum=0;
  items.forEach(function(d,i){
    var x=mL+gap*i+(gap-bw)/2, h=ph*(d.value/maxV), y=mT+ph-h;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="#3b6fb5"/>';
    bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#46526a">'+d.value+'</text>';
    cum+=d.value; var cy=mT+ph-ph*(cum/total);
    pts.push([mL+gap*i+gap/2,cy]);
    labels+='<text x="'+(mL+gap*i+gap/2).toFixed(1)+'" y="'+(mT+ph+16).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#69748a">'+shortLabel(d.label)+'</text>';
  });
  var line='<polyline fill="none" stroke="#cc9f00" stroke-width="2.5" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
  var dots=pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="#cc9f00"/>';}).join('');
  var y80=mT+ph-ph*0.8;
  var ref='<line x1="'+mL+'" y1="'+y80.toFixed(1)+'" x2="'+(W-mR)+'" y2="'+y80.toFixed(1)+'" stroke="#d65a5a" stroke-dasharray="5 4" stroke-width="1.3"/><text x="'+(W-mR)+'" y="'+(y80-5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#d65a5a">80% line</text>';
  var axis='<line x1="'+mL+'" y1="'+mT+'" x2="'+mL+'" y2="'+(mT+ph)+'" stroke="#cbd3df"/><line x1="'+mL+'" y1="'+(mT+ph)+'" x2="'+(W-mR)+'" y2="'+(mT+ph)+'" stroke="#cbd3df"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+axis+ref+bars+line+dots+labels+'</svg>';
}

function fishboneSVG(problem, cats){
  cats = cats || ['Manpower','Machine','Method','Material','Measurement','Environment'];
  var W=600,H=300,midY=150,headX=430,x0=40;
  function wrap(str){ str=String(str); var words=str.split(' '),lines=[],cur=''; words.forEach(function(w){ if((cur+' '+w).trim().length>16){ lines.push(cur.trim()); cur=w; } else cur+=' '+w; }); if(cur.trim())lines.push(cur.trim()); return lines.slice(0,2); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+x0+'" y1="'+midY+'" x2="'+headX+'" y2="'+midY+'" stroke="#11141b" stroke-width="2.5"/>';
  s+='<polygon points="'+headX+','+(midY-7)+' '+(headX+13)+','+midY+' '+headX+','+(midY+7)+'" fill="#11141b"/>';
  s+='<rect x="'+(headX+15)+'" y="'+(midY-32)+'" width="146" height="64" rx="8" fill="#11141b"/>';
  var lines=wrap(problem||'Problem / effect');
  var ly = lines.length>1 ? midY-6 : midY+4;
  lines.forEach(function(ln,i){ s+='<text x="'+(headX+88)+'" y="'+(ly+i*16)+'" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-monospace,monospace">'+ln+'</text>'; });
  var top=cats.slice(0,3), bot=cats.slice(3,6), slots=[0.26,0.5,0.74];
  function bone(bx,dir,label){ var ex=bx-70, ey=midY+dir*92; var b='<line x1="'+bx.toFixed(0)+'" y1="'+midY+'" x2="'+ex.toFixed(0)+'" y2="'+ey.toFixed(0)+'" stroke="#3b6fb5" stroke-width="2"/>'; b+='<text x="'+ex.toFixed(0)+'" y="'+(ey+(dir<0?-6:14)).toFixed(0)+'" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#2c5a98">'+label+'</text>'; return b; }
  top.forEach(function(c,i){ s+=bone(x0+(headX-x0)*slots[i],-1,c); });
  bot.forEach(function(c,i){ s+=bone(x0+(headX-x0)*slots[i], 1,c); });
  s+='</svg>'; return s;
}

function buildVisual(ex){
  if(ex.diagram) return ex.diagram;
  if(ex.chart){ if(ex.chart.type==='pareto') return paretoSVG(ex.chart.data); if(ex.chart.type==='fishbone') return fishboneSVG(ex.chart.problem, ex.chart.categories); }
  return '';
}

function makeWs(key,name,ph,prefill){
  var ta=document.createElement('textarea'); ta.placeholder=ph||''; ta.rows=2;
  var sk='lean:'+key+':ws:'+name; ta.dataset.wskey=sk;
  ta.value = state.code[sk]!=null?state.code[sk]:(prefill||'');
  ta.addEventListener('input',function(){ state.code[sk]=ta.value; save(); });
  return ta;
}
function buildWorksheet(tpl,key){
  var el=document.createElement('div'); var kind=typeof tpl==='string'?tpl:tpl.kind;
  if(kind==='fivewhys'){
    el.className='ws';
    var pr=document.createElement('div'); pr.className='ws-row'; var pl=document.createElement('label'); pl.textContent='Problem statement'; pr.appendChild(pl); pr.appendChild(makeWs(key,'problem','What, where, when, how big', (tpl&&tpl.problem)||'')); el.appendChild(pr);
    for(var i=1;i<=5;i++){ var r=document.createElement('div'); r.className='ws-row'; var l=document.createElement('label'); l.textContent='Why #'+i; r.appendChild(l); r.appendChild(makeWs(key,'why'+i,i===5?'\u2026 likely root cause':'Why is that?')); el.appendChild(r); }
  } else if(kind==='sipoc'){
    el.className='ws-sipoc';
    [['s','Suppliers'],['i','Inputs'],['p','Process'],['o','Outputs'],['c','Customers']].forEach(function(pair){ var col=document.createElement('div'); col.className='ws-col'; var l=document.createElement('label'); l.textContent=pair[1]; col.appendChild(l); var ta=makeWs(key,pair[0],pair[1]+'\u2026'); ta.rows=5; col.appendChild(ta); el.appendChild(col); });
  } else if(kind==='a3'){
    el.className='a3-grid';
    [['background','Background',0],['current','Current condition',0],['goal','Goal / target',0],['analysis','Root-cause analysis',0],['countermeasures','Countermeasures',0],['plan','Plan (who/what/when)',0],['followup','Follow-up / results',1]].forEach(function(b){ var box=document.createElement('div'); box.className='a3-box'+(b[2]?' full':''); var l=document.createElement('label'); l.textContent=b[1]; box.appendChild(l); var ta=makeWs(key,b[0],b[1]+'\u2026'); ta.rows=3; box.appendChild(ta); el.appendChild(box); });
  } else if(kind==='fishbone'){
    el.className='ws';
    var cats=(tpl&&tpl.categories)||['Manpower','Machine','Method','Material','Measurement','Environment'];
    var grid=document.createElement('div'); grid.className='ws-cats';
    cats.forEach(function(cat,ci){ var col=document.createElement('div'); col.className='ws-col'; var l=document.createElement('label'); l.textContent=cat; col.appendChild(l); var ta=makeWs(key,'m'+ci,'Potential causes\u2026'); ta.rows=3; col.appendChild(ta); grid.appendChild(col); });
    el.appendChild(grid);
  }
  function clear(){ el.querySelectorAll('[data-wskey]').forEach(function(ta){ ta.value=''; state.code[ta.dataset.wskey]=''; }); save(); }
  return {el:el, clear:clear};
}

function renderLean(lesson,c){
  lesson.exercises.forEach(function(ex,i){
    var key=lesson.id+'-'+i;
    var blk=document.createElement('div'); blk.className='block';
    var tag = ex.type==='worksheet'?t('template'):(ex.type==='mcq'?t('quiz'):(ex.type==='classify'?t('exercise'):t('calc')));
    blk.innerHTML='<div class="block-head"><span class="tag">'+tag+' '+(i+1)+(isGradable(ex)&&state.solved[key]?' \u2713':'')+'</span></div><div class="ex-prompt">'+ex.prompt+'</div>';
    var body=document.createElement('div'); body.style.padding='4px 16px 0';
    if(ex.table){ var tb=document.createElement('div'); tb.innerHTML=ex.table; body.appendChild(tb); }
    var vis=buildVisual(ex); if(vis){ var vw=document.createElement('div'); vw.className='svgwrap'; vw.innerHTML=vis; body.appendChild(vw); }

    if(ex.type==='worksheet'){
      var ws=buildWorksheet(ex.template,key); body.appendChild(ws.el); blk.appendChild(body);
      var actw=document.createElement('div'); actw.className='block-actions';
      var clr=document.createElement('button'); clr.className='ghost'; clr.textContent=t('clear'); clr.addEventListener('click',ws.clear);
      var note=document.createElement('div'); note.className='ws-note'; note.textContent=t('wsNote');
      actw.appendChild(clr); actw.appendChild(note); blk.appendChild(actw); c.appendChild(blk); return;
    }

    var getResult;
    if(ex.type==='classify'){
      var rows=[];
      ex.items.forEach(function(it,ii){
        var row=document.createElement('div'); row.className='classify-row';
        var lab=document.createElement('div'); lab.className='cl-label'; lab.innerHTML=it.text;
        var sel=document.createElement('select'); sel.className='cl-select';
        var ph=document.createElement('option'); ph.value=''; ph.textContent='\u2014 choose \u2014'; sel.appendChild(ph);
        ex.categories.forEach(function(cat,ci){ var o=document.createElement('option'); o.value=String(ci); o.textContent=cat; sel.appendChild(o); });
        var sk='lean:'+key+':c'+ii; if(state.code[sk]!=null) sel.value=state.code[sk];
        sel.addEventListener('change',function(){ state.code[sk]=sel.value; save(); sel.classList.remove('ok','no'); });
        var mk=document.createElement('div'); mk.className='fmark';
        row.appendChild(lab); row.appendChild(sel); row.appendChild(mk);
        body.appendChild(row); rows.push({it:it,sel:sel,mk:mk});
      });
      getResult=function(){ var ok=true; rows.forEach(function(r){ var ans=typeof r.it.answer==='number'?r.it.answer:ex.categories.indexOf(r.it.answer); var good=r.sel.value!==''&&parseInt(r.sel.value)===ans; r.sel.classList.remove('ok','no'); r.sel.classList.add(good?'ok':'no'); r.mk.className='fmark '+(good?'ok':'no'); r.mk.textContent=good?'\u2713':'\u2717'; if(!good) ok=false; }); return ok; };
    } else if(ex.type==='numeric'){
      var inputs=[];
      ex.fields.forEach(function(f){
        var row=document.createElement('div'); row.className='field';
        var lab=document.createElement('div'); lab.className='flabel'; lab.innerHTML=f.label;
        var inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal';
        var sk='lean:'+key+':'+f.key; if(state.code[sk]!=null) inp.value=state.code[sk];
        inp.addEventListener('input',function(){ state.code[sk]=inp.value; save(); });
        var unit=document.createElement('div'); unit.className='funit'; unit.textContent=f.unit||'';
        var mk=document.createElement('div'); mk.className='fmark';
        row.appendChild(lab); row.appendChild(inp); row.appendChild(unit); row.appendChild(mk);
        body.appendChild(row); inputs.push({f:f,inp:inp,mk:mk});
      });
      getResult=function(){ var ok=true; inputs.forEach(function(o){ var v=parseFloat(String(o.inp.value).replace(',','.')); var good=!isNaN(v)&&Math.abs(v-o.f.answer)<=(o.f.tol||1e-4); o.inp.classList.remove('ok','no'); o.inp.classList.add(good?'ok':'no'); o.mk.className='fmark '+(good?'ok':'no'); o.mk.textContent=good?'\u2713':'\u2717'; if(!good) ok=false; }); return ok; };
    } else {
      var qs=[];
      ex.questions.forEach(function(q,qi){
        var qd=document.createElement('div'); qd.className='mcq-q'; qd.innerHTML='<div class="qtext">'+(qi+1)+'. '+q.text+'</div>';
        var opts=document.createElement('div'); opts.className='mcq-opts';
        var sk='lean:'+key+':q'+qi; var sel=state.code[sk]!=null?parseInt(state.code[sk]):-1; var btns=[];
        q.options.forEach(function(o,oi){ var ob=document.createElement('button'); ob.className='mcq-opt'+(sel===oi?' sel':''); ob.textContent=o;
          ob.addEventListener('click',function(){ sel=oi; state.code[sk]=String(oi); save(); btns.forEach(function(b){b.classList.remove('sel','ok','no');}); ob.classList.add('sel'); });
          opts.appendChild(ob); btns.push(ob); });
        qd.appendChild(opts); body.appendChild(qd); qs.push({q:q,btns:btns,getSel:function(){return sel;}});
      });
      getResult=function(){ var ok=true; qs.forEach(function(o){ var sel=o.getSel(); o.btns.forEach(function(b,bi){ b.classList.remove('ok','no','sel'); if(bi===o.q.correct) b.classList.add('ok'); else if(bi===sel) b.classList.add('no'); }); if(sel!==o.q.correct) ok=false; }); return ok; };
    }
    blk.appendChild(body);
    var sol=document.createElement('div'); sol.className='solbox'; sol.innerHTML='<b>'+t('workedSolution')+'</b> '+ex.solution;
    var act=document.createElement('div'); act.className='block-actions';
    var check=document.createElement('button'); check.className='run check'; check.innerHTML=t('check');
    var sbtn=document.createElement('button'); sbtn.className='ghost'; sbtn.textContent=t('showSol');
    sbtn.addEventListener('click',function(){ sol.classList.toggle('show'); sbtn.textContent=sol.classList.contains('show')?t('hideSol'):t('showSol'); });
    var res=document.createElement('div'); res.className='result';
    check.addEventListener('click',function(){ var ok=getResult(); res.className='result '+(ok?'ok':'no'); res.textContent=ok?t('allCorrect'):t('someOff');
      if(ok){ markSolved(key,15); maybeComplete(lesson); save(); buildSidebar(); updateProgress(); var head=blk.querySelector('.tag'); if(head&&!/\u2713/.test(head.textContent)) head.textContent+=' \u2713'; } });
    act.appendChild(check); act.appendChild(sbtn); act.appendChild(res); blk.appendChild(act); blk.appendChild(sol); c.appendChild(blk);
  });
}

/* ---- REPL ---- */
const drawer=document.getElementById('replDrawer'), replOut=document.getElementById('replOut'), replIn=document.getElementById('replInput');
let replNs=null;
function openRepl(){ drawer.classList.add('open'); document.getElementById('replBtn').classList.add('on'); replIn.focus(); }
function closeRepl(){ drawer.classList.remove('open'); document.getElementById('replBtn').classList.remove('on'); }
document.getElementById('replBtn').addEventListener('click',()=>drawer.classList.contains('open')?closeRepl():openRepl());
document.getElementById('replClose').addEventListener('click',closeRepl);
async function replRun(){
  const code=replIn.value; if(!code.trim()) return;
  const echo=document.createElement('div'); echo.className='in'; echo.textContent='>>> '+code.replace(/\n/g,'\n... '); replOut.appendChild(echo);
  if(!pyReady){ const e=document.createElement('div'); e.className='err'; e.textContent=pyFailed?t('pyOffline'):t('pyLoading'); replOut.appendChild(e); replOut.scrollTop=replOut.scrollHeight; return; }
  if(!replNs) replNs=pyodide.runPython('dict()');
  let buf=''; pyodide.setStdout({batched:s=>buf+=s}); pyodide.setStderr({batched:s=>buf+=s});
  try{ const val=await pyodide.runPythonAsync(code,{globals:replNs});
    if(buf){ const o=document.createElement('div'); o.textContent=buf; replOut.appendChild(o); }
    if(val!==undefined&&val!==null){ const o=document.createElement('div'); o.textContent=String(val); replOut.appendChild(o); if(val&&val.destroy) try{val.destroy();}catch(e){} }
  }catch(e){ if(buf){ const o=document.createElement('div'); o.textContent=buf; replOut.appendChild(o);} const er=document.createElement('div'); er.className='err'; er.textContent=cleanErr(e.message||e); replOut.appendChild(er); }
  replIn.value=''; replOut.scrollTop=replOut.scrollHeight;
}
document.getElementById('replRun').addEventListener('click',replRun);
replIn.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); replRun(); } });

function makeOverlay(id){ const ov=document.createElement('div'); ov.className='overlay'; ov.id=id; ov.addEventListener('click',e=>{ if(e.target===ov) ov.classList.remove('open'); }); document.body.appendChild(ov); return ov; }
const dashOv=makeOverlay('dashOverlay'), refOv=makeOverlay('refOverlay');
function areaStats(a){
  const lessons=DATA[a], tracks={}; let exTotal=0,exSolved=0,lDone=0;
  lessons.forEach(l=>{ const tr=tracks[l.track]||(tracks[l.track]={lt:0,ld:0,et:0,es:0}); tr.lt++; if(state.completed[l.id]){tr.ld++;lDone++;} l.exercises.forEach((ex,i)=>{ if(!isGradable(ex)) return; tr.et++; exTotal++; if(state.solved[l.id+'-'+i]){tr.es++;exSolved++;} }); });
  return {tracks,exTotal,exSolved,lDone,lTotal:lessons.length};
}
function openDash(){
  const py=areaStats('python'), ln=areaStats('lean');
  const totLessons=py.lTotal+ln.lTotal, totDone=py.lDone+ln.lDone, totEx=py.exTotal+ln.exTotal, totSolved=py.exSolved+ln.exSolved;
  const pct=totLessons?Math.round(totDone/totLessons*100):0;
  function areaBlock(title,st){
    let h='<div class="dash-area"><h3>'+title+' \u2014 '+st.lDone+'/'+st.lTotal+' '+nounFor(title.toLowerCase().includes('python')?'python':'lean')+'</h3>';
    Object.keys(st.tracks).forEach(tn=>{ const tr=st.tracks[tn]; const p=tr.et?Math.round(tr.es/tr.et*100):0;
      h+='<div class="trk"><div class="trk-row"><span>'+tn+'</span><span>'+tr.es+'/'+tr.et+' '+t('dashExercises')+'</span></div><div class="trk-bar"><i style="width:'+p+'%"></i></div></div>'; });
    return h+'</div>';
  }
  const now=new Date().toLocaleDateString(lang==='es'?'es-ES':'en-GB',{year:'numeric',month:'long',day:'numeric'});
  dashOv.innerHTML='<div class="modal"><div class="modal-head"><span class="prompt">&gt;&gt;&gt;</span> '+t('dashTitle')+'<button class="mclose" id="dashX">'+t('dashClose')+'</button></div><div class="modal-body">'+
    '<div class="dash-top">'+
      '<div class="dash-card"><div class="big">'+state.xp+'</div><div class="lbl">'+t('dashXP')+'</div></div>'+
      '<div class="dash-card"><div class="big">'+pct+'%</div><div class="lbl">'+t('dashOverall')+'</div></div>'+
      '<div class="dash-card"><div class="big">'+totSolved+'/'+totEx+'</div><div class="lbl">'+t('dashExercises')+'</div></div>'+
    '</div>'+
    areaBlock('Python',py)+areaBlock('LEAN',ln)+
    '<div class="cert"><div class="ct">'+t('dashCert')+'</div><div class="cb">'+totDone+' / '+totLessons+' '+t('lessons')+'</div>'+
      '<div>'+t('dashLine')+'</div><div style="margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted)">'+t('dashGen')+': '+now+'</div></div>'+
    '<div style="margin-top:18px"><button class="run dash-print" id="dashPrint">'+t('dashPrint')+'</button></div>'+
    '</div></div>';
  dashOv.classList.add('open');
  dashOv.querySelector('#dashX').addEventListener('click',()=>dashOv.classList.remove('open'));
  dashOv.querySelector('#dashPrint').addEventListener('click',()=>window.print());
}
