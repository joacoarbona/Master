  <p>It links the three things managers feel: how much is stuck in the system (WIP), how fast it comes out (throughput), and how long each item takes (lead time). Cut WIP and lead time falls proportionally — the quantitative case for limiting work-in-process.</p>
  <p>Using our stream: lead time = <b>1154 min</b>, throughput = 90 orders over the 450-min working day.</p>`,
  deep:`<p><b>What it actually says.</b> Little's Law (L = λW) states that the long-run average number of items in a stable system equals the average arrival/throughput rate times the average time an item spends in the system. Its power is its generality: it holds for <em>any</em> stable queue regardless of the arrival or service distribution, the order of service, or the number of steps — you only need consistent units and a system that isn't growing without bound. So the one lever you usually control directly, <em>WIP</em>, sets lead time. This is the mathematical justification for WIP caps, kanban and pull.</p>
  <p><b>Why small batches flow faster.</b> The classic demonstration: three tasks (fold, stuff, seal 10 letters). In a batch-and-queue approach you fold all 10, then stuff all 10, then seal all 10 — the first finished letter appears very late. In one-piece flow you fold-stuff-seal one letter at a time — the first finished letter appears almost immediately and total time is usually lower too, because items aren't waiting in piles. Large batches create long queues, which (by Little's Law) create long lead times and hide defects inside the batch.</p>
  <p><b>The utilisation trap.</b> Lead time does not rise gently as you load a system — it explodes. Kingman's equation (the VUT relationship) shows queue time scales with a <em>variability</em> factor times a <em>utilisation</em> factor of roughly ρ/(1−ρ) times the process time. As utilisation ρ approaches 100%, ρ/(1−ρ) shoots to infinity. That's why a service desk run at 95% utilisation has wild waits, and why deliberately keeping slack (and reducing variability) is not laziness but good flow design.</p>
  <p><b>Connections.</b> <em>Flow efficiency</em> = value-add time ÷ lead time is the same number as PCE. Cumulative flow diagrams visualise WIP, throughput and lead time over time for a team. And Little's Law is the bridge to the Theory of Constraints (Goldratt): throughput of the whole system is governed by its bottleneck, so you subordinate everything to the constraint rather than locally optimising.</p>`,
  exercises:[
    { type:'numeric', prompt:'Apply Little\u2019s Law to the order stream.',
      fields:[
        { key:'thru', label:'Throughput', unit:'orders/min', answer:0.2, tol:0.005 },
        { key:'wip', label:'Average WIP (orders in the system)', unit:'orders', answer:230.8, tol:3 },
        { key:'days', label:'Lead time in working days', unit:'days', answer:2.56, tol:0.1 },
      ],
      solution:`<p>Throughput = 90/450 = <b>0.2 orders/min</b>. WIP = 0.2 × 1154 = <b>≈ 231 orders</b>. Lead time = 1154/450 = <b>2.56 days</b>. Halve the queues and lead time roughly halves.</p>` },
    { type:'mcq', prompt:'Flow concepts.',
      questions:[
        { text:'Little\u2019s Law holds for…', options:['Only assembly lines','Any stable system, regardless of distribution','Only single-step processes','Only Six Sigma processes'], correct:1 },
        { text:'As a system approaches 100% utilisation, queue/lead time…', options:['Stays flat','Falls','Rises gently and linearly','Explodes towards infinity'], correct:3 },
        { text:'The most directly controllable lever to cut lead time is usually…', options:['Throughput','WIP','Demand','Price'], correct:1 },
      ],
      solution:`<p>Little's Law is distribution-free for stable systems; lead time explodes near 100% utilisation (Kingman); and WIP is the lever you control directly.</p>` },
  ]
},

/* ===== 7. PULL, KANBAN & WIP ===== */
{
  id:'l7', area:'lean', track:'Flow', title:'Pull, Kanban & WIP limits', min:40,
  concept:`<p>A <strong>pull system</strong> only makes what the next step has actually consumed — replacing forecasts and overproduction with real signals. <strong>Kanban</strong> cards (or bins, or digital cards) are those signals, and they physically cap work-in-process.</p>
  <pre class="cc">Number of kanban = (demand during lead time x (1 + safety)) / container size
WIP limit = number of kanban x container size</pre>
  <p>Fewer cards = tighter WIP = shorter lead time (Little's Law again), but too few risks starving the line. Sizing is the balance.</p>
  <p><b>Data:</b> demand 1200 units/day · replenishment lead time 0.5 day · safety factor 25% · container 60 units.</p>`,
  deep:`<p><b>Push vs pull.</b> <em>Push</em> schedules each step from a central forecast/plan (MRP); when the forecast is wrong, you get the wrong inventory in the wrong place. <em>Pull</em> triggers work only from downstream consumption, so the system self-regulates and WIP is capped by design. The supermarket analogy is exact: a shelf holds a set quantity; when a customer takes one, that's the signal to replenish exactly one.</p>
  <p><b>Kanban varieties.</b> A <em>withdrawal</em> kanban authorises moving parts; a <em>production</em> kanban authorises making them; a <em>signal</em> kanban triggers a batch when stock hits a reorder point. Pull can be a <em>supermarket</em> (replenish a held stock) or <em>sequential/FIFO</em> (a capped first-in-first-out lane for high-variety items you can't stock). A simple two-bin system is kanban at its most physical. <em>CONWIP</em> (constant WIP) caps total work across a whole line with a single loop of cards rather than per-step.</p>
  <p><b>Sizing, honestly.</b> The card formula bakes in a <em>safety factor</em> to absorb demand and lead-time variability — but a high safety factor is just inventory hiding instability; the real fix is reducing variability and lead time so you need fewer cards. Each card you remove tightens WIP and (Little's Law) shortens lead time, until you remove one too many and starve the line — which is precisely how Toyota deliberately exposes the next problem to solve.</p>
  <p><b>Two meanings of "Kanban" — important for delivery/PMO work.</b> Lean kanban (above) is a physical replenishment signal in repetitive production. The <em>Kanban Method</em> in knowledge work (David Anderson) borrows the WIP-limit idea: visualise the workflow on a board, set explicit <em>WIP limits</em> per column, manage flow, make policies explicit, and use classes of service. The shared DNA is "limit work-in-progress to improve flow"; the contexts differ. When demand is highly variable and low-volume, pure pull may not fit and teams use hybrids (e.g. MRP for planning + kanban for execution).</p>`,
  exercises:[
    { type:'numeric', prompt:'Size the kanban loop.',
      fields:[
        { key:'dlt', label:'Demand during lead time', unit:'units', answer:600, tol:1 },
        { key:'cards', label:'Number of kanban cards (round up)', unit:'cards', answer:13, tol:0 },
        { key:'wip', label:'Resulting WIP cap', unit:'units', answer:780, tol:1 },
      ],
      solution:`<p>Demand during LT = 1200 × 0.5 = 600. With safety: 600 × 1.25 = 750. Cards = 750/60 = 12.5 → <b>13</b>. WIP cap = 13 × 60 = <b>780 units</b>.</p>` },
    { type:'mcq', prompt:'Pull concepts.',
      questions:[
        { text:'A pull system is triggered by…', options:['A central forecast','Actual downstream consumption','The annual budget','Machine availability'], correct:1 },
        { text:'A high kanban safety factor mainly…', options:['Removes variability','Hides instability as extra inventory','Lowers WIP','Speeds changeovers'], correct:1 },
        { text:'The shared idea between Lean kanban and the knowledge-work Kanban Method is…', options:['Daily stand-ups','Limiting work-in-progress to improve flow','Story points','Gantt charts'], correct:1 },
      ],
      solution:`<p>Pull responds to real consumption; safety stock masks instability (reduce variability instead); and both flavours of kanban share the WIP-limiting principle.</p>` },
  ]
},

/* ===== 8. SMED ===== */
{
  id:'l8', area:'lean', track:'Setup & Quality', title:'SMED — fast changeovers', min:35,
  concept:`<p><strong>SMED</strong> (Single-Minute Exchange of Die) shrinks changeover time so smaller batches become economical — the key that unlocks flow and levelling. The method:</p>
  <ul>
    <li><b>Separate</b> internal setup (machine stopped) from external setup (can be done while running).</li>
    <li><b>Externalise</b> — move as much as possible to while the machine still runs.</li>
    <li><b>Convert</b> internal steps into external ones.</li>
    <li><b>Streamline</b> the remaining internal work.</li>
  </ul>
  <p><b>Current changeover = 50 min:</b> internal 35 min, external 15 min. Step 1 — externalise the 15 min. Step 2 — convert 20 min of internal to external. Step 3 — streamline the rest, cutting it 40%.</p>`,
  deep:`<p><b>Origin.</b> Shigeo Shingo developed SMED at Toyota across the 1950s–60s, famously taking a press die change from hours to minutes (his book: <em>A Revolution in Manufacturing: the SMED System</em>). "Single-minute" means the changeover fits in a single digit of minutes (under 10); <em>OTED</em> ("one-touch exchange of die") targets under one minute.</p>
  <p><b>The stages, precisely.</b> Stage 0: a baseline where internal and external work are tangled together. Stage 1 — <em>separate</em>: simply identifying which tasks could be done while the machine runs typically cuts stoppage 30–50% with no investment. Stage 2 — <em>convert</em> internal to external: pre-stage tools, pre-heat dies, use duplicate fixtures so the next job is ready offline. Stage 3 — <em>streamline both</em>: the biggest hidden cost is usually <em>adjustment and trial runs</em> — eliminate them with settings, stops and standardised dimensions; add functional (one-turn) clamps instead of bolts, intermediate jigs, and parallel operations (two people choreographed like a pit crew).</p>
  <p><b>Why it matters strategically.</b> The economic batch quantity (EOQ) logic says big batches amortise a big setup cost — so people run big batches and carry inventory. SMED attacks the <em>assumption</em>: if setup is near-zero, the economic batch shrinks toward one, which enables one-piece flow, levelled mix (heijunka), lower inventory and far greater responsiveness. SMED is therefore an enabler, not an end in itself.</p>
  <p><b>Pitfall.</b> Don't pour SMED effort into a machine that isn't the constraint — faster changeovers on a non-bottleneck just create more idle capacity and tempt overproduction. Improve changeover where it frees the system, i.e. at or feeding the bottleneck, or where it unlocks the levelling you actually need.</p>`,
  exercises:[
    { type:'numeric', prompt:'Track the machine-stopped (internal) time after each SMED step.',
      fields:[
        { key:'s1', label:'Stoppage after externalising', unit:'min', answer:35, tol:0.5 },
        { key:'s2', label:'Stoppage after converting 20 min', unit:'min', answer:15, tol:0.5 },
        { key:'s3', label:'Final stoppage after 40% streamline', unit:'min', answer:9, tol:0.5 },
        { key:'red', label:'Total reduction vs original 50 min', unit:'%', answer:82, tol:1 },
      ],
      solution:`<p>Externalise → 35; convert 20 → 15; streamline 40% → 15×0.6 = 9. Reduction = (50−9)/50 = <b>82%</b>. SMED counts the stoppage, not the total work.</p>` },
  ]
},

/* ===== 9. JIDOKA & POKA-YOKE ===== */
{
  id:'l9', area:'lean', track:'Setup & Quality', title:'Jidoka & Poka-Yoke', min:35,
  concept:`<p><strong>Jidoka</strong> — "automation with a human touch" (autonomation) — means a process <em>stops itself</em> the instant something goes wrong, so a defect never gets passed on and the problem becomes visible immediately. Any worker can pull the <em>andon</em> cord to stop the line. Counter-intuitively, stopping to fix problems increases output over time, because defects stop multiplying.</p>
  <p><strong>Poka-yoke</strong> — mistake-proofing — designs the work so an error is either impossible or caught instantly: a connector that only fits one way, a checklist that won't let you proceed with a missing item, a scale that flags a missing component.</p>
  <p>Together they "build quality in" rather than inspecting it in at the end.</p>`,
  deep:`<p><b>Roots.</b> Jidoka predates the rest of TPS: in 1924 Sakichi Toyoda built an automatic loom that <em>stopped</em> when a thread broke, so it never wove flawed cloth and one operator could mind many machines. That idea — separate human work from machine work, and let the machine signal abnormality — became the first pillar of TPS. The Jidoka loop is: detect the abnormality, stop, fix or contain it now, then investigate the root cause so it can't recur.</p>
  <p><b>The culture of stopping.</b> The andon cord embodies a radical norm: a frontline worker is empowered (expected) to halt a multi-million-dollar line to fix a small defect. Western managers find this backwards, but it is why quality is high and why problems get solved at source instead of accumulating. "Stop to fix" trades short-term output for long-term throughput and learning.</p>
  <p><b>Poka-yoke, by Shingo.</b> Shigeo Shingo classified mistake-proofing by detection method — <em>contact</em> (shape/size/physical interference), <em>fixed-value</em> (count checks: are all N parts present?), and <em>motion-step</em> (was each step done in sequence?) — and by response: <em>control</em> devices (prevent the error / stop the process) vs <em>warning</em> devices (alert a human). He also distinguished kinds of inspection: <em>judgment</em> inspection (sort good from bad after the fact — finds defects, prevents none), <em>informative</em> inspection (feed data back, e.g. SPC), and the gold standard <em>source</em> inspection (check conditions before the error happens). His provocative claim — <em>Zero Quality Control</em> — was that statistical sampling <em>accepts</em> a defect rate, whereas source inspection plus poka-yoke can drive defects to zero.</p>
  <p><b>Everyday and pharma examples.</b> The USB-A that only inserts one way, the SIM card's chamfered corner, the car that won't start unless it's in park, the microwave that stops when the door opens. In healthcare and pharma: surgical instrument counts, colour-and-shape-coded connectors that prevent wrong-route administration, syringe interlocks, barcode scanning that blocks a mismatched patient/medication. Each removes reliance on human vigilance — the least reliable control.</p>`,
  exercises:[
    { type:'mcq', prompt:'Built-in quality.',
      questions:[
        { text:'Jidoka fundamentally means…', options:['Full automation with no people','A process that stops itself when an abnormality occurs','Inspecting finished goods','Running machines unattended at all costs'], correct:1 },
        { text:'A connector designed so it physically cannot be plugged in the wrong way is a…', options:['Warning poka-yoke','Control (prevention) poka-yoke','Judgment inspection','Andon'], correct:1 },
        { text:'Shingo argued the highest-value inspection is…', options:['Final judgment inspection','Statistical sampling','Source inspection (check conditions before the error)','No inspection'], correct:2 },
        { text:'Pulling the andon cord to stop the line is encouraged because…', options:['It reduces paperwork','Stopping to fix problems raises long-run throughput and quality','It lowers takt time','It increases batch sizes'], correct:1 },
      ],
      solution:`<p>Jidoka = self-stopping on abnormality; a one-way connector is a control/prevention poka-yoke; source inspection beats end-of-line judgment; and "stop to fix" improves quality and throughput over time.</p>` },
  ]
},

/* ===== 10. OEE ===== */
{
  id:'l10', area:'lean', track:'Performance', title:'OEE — Overall Equipment Effectiveness', min:40,
  concept:`<p><strong>OEE</strong> condenses three loss buckets into one score:</p>
  <pre class="cc">OEE = Availability x Performance x Quality

Availability = Operating time / Planned time
Performance  = (Ideal cycle x Total count) / Operating time
Quality      = Good count / Total count</pre>
  <p>World-class is around <b>85%</b>; many lines sit near 60%. Because it multiplies, a weak factor drags the whole score.</p>
  <p><b>Shift data:</b> planned time 450 min · unplanned downtime 60 min · ideal cycle 1.0 min/unit · total produced 350 · good units 330.</p>`,
  deep:`<p><b>The Six Big Losses.</b> OEE comes from TPM (Total Productive Maintenance, JIPM/Nakajima) and maps six losses to the three factors. <em>Availability</em> losses: (1) breakdowns and (2) setup/adjustments. <em>Performance</em> losses: (3) idling and minor stops and (4) reduced speed. <em>Quality</em> losses: (5) process defects/rework and (6) start-up/yield rejects. The "world-class" 85% comes from roughly Availability 90% × Performance 95% × Quality 99%.</p>
  <p><b>Definitions that trip people up.</b> <em>Planned production time</em> excludes time the asset wasn't scheduled to run (lunch, no demand) — those go to schedule loss, captured by <em>TEEP</em> (Total Effective Equipment Performance = OEE × schedule utilisation against all calendar time). Performance uses the <em>ideal</em> cycle time, so choosing an over-generous ideal inflates the score — a common way OEE gets gamed.</p>
  <p><b>How to use it — and misuse it.</b> OEE is a <em>diagnostic of losses on one asset over time</em>, not a productivity stick to wave at operators and not a number to compare across different machines. Two further traps: optimising OEE on a <em>non-constraint</em> (you make a faster non-bottleneck, gaining nothing but overproduction), and treating high OEE as the goal when the goal is system throughput at takt. A useful cross-check: OEE also equals good units ÷ (planned time / ideal cycle) — the fraction of theoretically possible good output you actually achieved.</p>`,
  exercises:[
    { type:'numeric', prompt:'Compute each factor and the OEE.',
      fields:[
        { key:'a', label:'Availability', unit:'%', answer:86.7, tol:0.6 },
        { key:'p', label:'Performance', unit:'%', answer:89.7, tol:0.6 },
        { key:'q', label:'Quality', unit:'%', answer:94.3, tol:0.6 },
        { key:'oee', label:'OEE', unit:'%', answer:73.3, tol:0.8 },
      ],
      solution:`<p>Operating = 450−60 = 390. A = 390/450 = <b>86.7%</b>; P = (1×350)/390 = <b>89.7%</b>; Q = 330/350 = <b>94.3%</b>; OEE = <b>73.3%</b>. Cross-check: 330/450 = 73.3%. Biggest loss is availability.</p>` },
    { type:'mcq', prompt:'Loss mapping.',
      questions:[
        { text:'Reduced running speed is a loss under which factor?', options:['Availability','Performance','Quality','Schedule'], correct:1 },
        { text:'Comparing OEE between two different machine types is…', options:['A best practice','Misleading — OEE is for one asset over time','Required by TPM','How you set takt'], correct:1 },
        { text:'TEEP differs from OEE by also counting…', options:['Defects','Schedule loss / all calendar time','Setup time','Minor stops'], correct:1 },
      ],
      solution:`<p>Speed loss sits in Performance; OEE is meaningful for one asset's trend, not cross-machine league tables; TEEP extends OEE to all calendar time (schedule loss).</p>` },
  ]
},

/* ===== 11. 5S ===== */
{
  id:'l11', area:'lean', track:'Workplace', title:'5S & Visual Management', min:30,
  concept:`<p><strong>5S</strong> builds the stable, visual workplace every other Lean tool depends on. A place for everything, and problems visible at a glance.</p>
  <ul>
    <li><b>Sort (Seiri)</b> — remove what isn't needed.</li>
    <li><b>Set in order (Seiton)</b> — a place for everything, everything in its place.</li>
    <li><b>Shine (Seiso)</b> — clean, and inspect while cleaning.</li>
    <li><b>Standardise (Seiketsu)</b> — make the first three the documented norm.</li>
    <li><b>Sustain (Shitsuke)</b> — discipline and audits to hold the gains.</li>
  </ul>
  <p>The first three are actions; the last two stop the workplace sliding back.</p>`,
  deep:`<p><b>The point isn't tidiness.</b> 5S exists to <em>make abnormality instantly visible</em>. If every tool has a marked home, a missing or out-of-place tool is obvious in a glance — which is the precondition for standardised work, quick changeovers and Jidoka. Treating 5S as a cleaning or photo-op program is the classic cosmetic failure; the deeper purpose is surfacing problems.</p>
  <p><b>Mechanics.</b> <em>Sort</em> uses a red-tag process: tag questionable items, quarantine them in a red-tag area for a set period, and dispose of whatever goes unused. <em>Set in order</em> uses shadow boards, floor marking, point-of-use storage and labels. <em>Shine</em> doubles as inspection (cleaning a machine is when you spot the leak or loose bolt). <em>Standardise</em> turns the first three into visual standards and checklists. <em>Sustain</em> is the hard one — it needs leader standard work and <em>layered audits</em> (operators, supervisors, managers each audit on a cadence, e.g. via kamishibai cards). Some organisations add a sixth S for <em>Safety</em>.</p>
  <p><b>Visual management beyond 5S.</b> The broader aim is a workplace that communicates its own status: <em>andon</em> boards (normal/abnormal), <em>production-analysis boards</em> (plan vs actual by pitch), standard-work charts at the station, kanban, and kamishibai audit boards. A good test: could a visitor tell in 30 seconds whether the area is ahead or behind, and whether anything is abnormal? If yes, visual management is working.</p>`,
  exercises:[
    { type:'mcq', prompt:'Match each action to the correct S.',
      questions:[
        { text:'"Red-tag and remove tools not used in the last 90 days."', options:['Sort','Set in order','Shine','Sustain'], correct:0 },
        { text:'"Paint shadow boards so every tool has a marked home."', options:['Shine','Set in order','Standardise','Sort'], correct:1 },
        { text:'"Run a weekly layered audit and score each zone."', options:['Sustain','Shine','Sort','Set in order'], correct:0 },
        { text:'The deeper purpose of 5S is to…', options:['Look tidy for visitors','Make abnormality instantly visible','Reduce cleaning costs','Replace standardised work'], correct:1 },
      ],
      solution:`<p>Sort · Set in order · Sustain; and the real purpose is making problems visible — tidiness is a by-product, not the goal.</p>` },
  ]
},

/* ===== 12. KAIZEN / PDCA / A3 ===== */
{
  id:'l12', area:'lean', track:'Improvement', title:'Kaizen, PDCA & A3', min:35,
  concept:`<p><strong>Kaizen</strong> is continuous, incremental improvement owned by the people doing the work. Its engine is the <strong>PDCA</strong> cycle:</p>
  <ul>
    <li><b>Plan</b> — understand the problem; hypothesise a countermeasure.</li>
    <li><b>Do</b> — trial it small-scale.</li>
    <li><b>Check</b> — measure against the prediction.</li>
    <li><b>Act</b> — adopt, adjust or abandon; standardise; repeat.</li>
  </ul>
  <p>The <strong>A3</strong> (a paper size) forces a whole problem onto one page: background, current state, goal, root-cause analysis, countermeasures, plan and follow-up. The discipline of one page forces clear thinking.</p>`,
  deep:`<p><b>Kinds of kaizen.</b> <em>Point kaizen</em> fixes one step; a <em>kaizen event</em> (blitz) is a focused 3–5 day cross-functional improvement; <em>daily kaizen</em> is the steady drip of small ideas from the team; <em>flow/system kaizen</em> redesigns how the whole value stream connects and is a leadership responsibility. A program that's all events and no daily kaizen burns out; one that's all daily kaizen and no flow kaizen optimises locally while the stream stays slow.</p>
  <p><b>PDCA, and a nuance.</b> PDCA is the Shewhart cycle, popularised by Deming — who actually preferred <em>PDSA</em>, with "Study" replacing "Check", because "check" can mean a superficial tick rather than genuine reflection (hansei) on what the data taught you. Pair it with <em>SDCA</em>: after PDCA finds a better way, Standardise-Do-Check-Act <em>holds</em> the gain before the next PDCA cycle. Without the standardise-and-hold step, improvements quietly erode.</p>
  <p><b>Root cause before countermeasure.</b> The cardinal sin is jumping to a solution. Tools: <em>5 Whys</em> (keep asking why to move from symptom to cause), the <em>fishbone/Ishikawa</em> diagram (Man, Machine, Material, Method, Measurement, Environment), and Pareto analysis to focus on the vital few. A genuine root cause is one where, if you remove it, the problem cannot recur.</p>
  <p><b>A3 as a thinking and coaching tool.</b> The A3 isn't a form to fill in; it's the visible trace of a rigorous problem-solving conversation. In Toyota's mentoring model the manager asks questions and the owner does the thinking — the A3 develops people as much as it solves problems. Mike Rother's <em>Toyota Kata</em> distils the underlying routine: establish a challenge and a <em>target condition</em>, grasp the current condition, then iterate experiments toward the target (the Improvement Kata), with a structured Coaching Kata of questions. It reframes Lean from "apply tools" to "practise scientific thinking daily".</p>`,
  exercises:[
    { type:'mcq', prompt:'Improvement logic.',
      questions:[
        { text:'In PDCA, what immediately follows "Do"?', options:['Plan','Check','Act','Define'], correct:1 },
        { text:'Deming preferred "PDSA" because "Study" emphasises…', options:['Faster cycles','Genuine reflection on what the data taught','More paperwork','Larger trials'], correct:1 },
        { text:'After PDCA improves a process, what holds the gain?', options:['Another PDCA immediately','SDCA (standardise and sustain)','A kaizen event','An audit only'], correct:1 },
        { text:'The main purpose of constraining an A3 to one page is to…', options:['Save paper','Force clear, shared, rigorous thinking','Speed up printing','Avoid meetings'], correct:1 },
      ],
      solution:`<p>Check follows Do; PDSA stresses real study/reflection; SDCA locks in gains; and the one-page A3 forces rigour and a shared story while developing the problem-solver.</p>` },
  ]
},

/* ===== 13. DMAIC / SIX SIGMA ===== */
{
  id:'l13', area:'lean', track:'Improvement', title:'DMAIC, Six Sigma & Lean Six Sigma', min:40,
  visual:{type:'control', caption:'Defect-rate control chart (one special-cause point)', label:'defects / day', mean:5, ucl:11, lcl:0, values:[4,6,5,7,3,5,12,4,6,5,8,2]},
  concept:`<p>Lean removes <em>waste</em>; <strong>Six Sigma</strong> removes <em>variation</em>. Together: "Lean Six Sigma". Its improvement spine is <strong>DMAIC</strong>: <b>D</b>efine → <b>M</b>easure → <b>A</b>nalyse → <b>I</b>mprove → <b>C</b>ontrol. The Control phase is what makes gains stick.</p>
  <p>A common metric is <strong>DPMO</strong> (defects per million opportunities):</p>
  <pre class="cc">DPMO = (defects / (units x opportunities)) x 1,000,000
Yield = (1 - DPMO/1,000,000) x 100%</pre>
  <p><b>Audit data:</b> 5000 units inspected · 4 defect opportunities per unit · 60 defects found.</p>`,
  deep:`<p><b>Origin and the sigma scale.</b> Six Sigma was created at Motorola (Bill Smith, 1986) and popularised by GE under Jack Welch. "Six sigma" means the process spread fits six standard deviations between the mean and the nearest specification limit. Famously, 6σ is quoted as <em>3.4 DPMO</em> — but that includes a <em>1.5σ long-term shift</em> assumption (a much-debated convention): the "pure" 6σ would be ~2 defects per billion, while the 3.4 figure allows for the mean drifting ±1.5σ over time. Sigma levels are a shorthand for capability, not magic.</p>
  <p><b>Variation: the core idea.</b> Walter Shewhart and Deming distinguished <em>common-cause</em> variation (inherent, predictable noise of a stable process) from <em>special-cause</em> variation (an assignable, unusual event). The two management mistakes are symmetric: <em>tampering</em> — reacting to common-cause noise as if it were a signal (which Deming's funnel experiment shows makes things worse) — and <em>missing</em> a real special-cause signal. <em>Control charts</em> (SPC) tell them apart. Process capability is summarised by <em>Cp/Cpk</em> (how well the spread and centring fit the spec).</p>
  <p><b>DMAIC tools by phase.</b> Define: project charter, SIPOC, Voice of the Customer, CTQs. Measure: data-collection plan and Measurement System Analysis / Gage R&R (you must trust the gauge before the data). Analyse: hypothesis tests, regression, root-cause tools to find the vital-few drivers. Improve: design of experiments, piloting. Control: control plan, SPC, mistake-proofing and standard work so the improvement holds — the phase teams most often skip, which is why gains evaporate. For <em>new</em> designs the variant is DMADV / Design for Six Sigma.</p>
  <p><b>Lean vs Six Sigma — when to use which.</b> If the problem is slow flow, queues and obvious waste (like a stream that's 96% waiting), reach for Lean first — VSM, pull, batch reduction. If the problem is a hard-to-see defect or excessive variation in a capable-looking process, reach for Six Sigma's statistical tools. The integrated discipline uses Lean to make the process flow and Six Sigma to make it precise; the failure mode of "belt" programs is statistical bureaucracy aimed at problems that were really flow problems all along.</p>`,
  exercises:[
    { type:'numeric', prompt:'Compute the quality level.',
      fields:[
        { key:'opp', label:'Total opportunities', unit:'', answer:20000, tol:1 },
        { key:'dpmo', label:'DPMO', unit:'', answer:3000, tol:5 },
        { key:'yield', label:'Yield', unit:'%', answer:99.7, tol:0.05 },
      ],
      solution:`<p>Opportunities = 5000 × 4 = 20,000. DPMO = 60/20,000 × 1e6 = <b>3000</b>. Yield = 99.7% (≈ 4.2σ).</p>` },
    { type:'mcq', prompt:'Variation & method.',
      questions:[
        { text:'Correct DMAIC order?', options:['Define-Measure-Analyse-Improve-Control','Design-Make-Audit-Inspect-Close','Define-Map-Act-Improve-Check','Measure-Define-Improve-Analyse-Control'], correct:0 },
        { text:'Reacting to ordinary common-cause noise as if it were a signal is called…', options:['Tampering','Capability','Sustaining','Levelling'], correct:0 },
        { text:'A stream that is 96% waiting with few defects should be tackled first with…', options:['Six Sigma variation tools','Lean flow & waste removal','More inspection','Design of experiments'], correct:1 },
        { text:'The famous "3.4 DPMO" for 6σ assumes…', options:['No variation','A 1.5σ long-term mean shift','Zero opportunities','A normal yield of 50%'], correct:1 },
      ],
      solution:`<p>DMAIC = Define-Measure-Analyse-Improve-Control; over-reacting to noise is tampering; a wait-dominated stream is a Lean (flow) problem; and 3.4 DPMO bakes in the 1.5σ shift convention.</p>` },
  ]
},

/* ===== 14. APPLIED VSM (commercial) ===== */
{
  id:'l14', area:'lean', track:'Applied · Commercial', title:'Applied VSM: Medical Information request', min:45,
  visual:{type:'vsm', caption:'Medical Information request — value stream map', demand:'30 req', steps:[{name:'Intake & log',pt:5,wt:60},{name:'Triage',pt:8,wt:240},{name:'Literature research',pt:35,wt:480},{name:'Draft response',pt:25,wt:120},{name:'MLR review',pt:15,wt:960},{name:'Send to HCP',pt:4,wt:30}]},
  concept:`<p>The VSM lens on a <strong>commercial / medical-affairs</strong> process: handling a Medical Information (MI) request from a healthcare professional. Knowledge work has value streams too — usually dominated by queues and review handoffs.</p>
  <table class="dtable">
    <thead><tr><th>#</th><th>Step</th><th>Process time (min)</th><th>Wait before step (min)</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Intake &amp; log</td><td>5</td><td>60</td></tr>
      <tr><td>2</td><td>Triage</td><td>8</td><td>240</td></tr>
      <tr><td>3</td><td>Literature research</td><td>35</td><td>480</td></tr>
      <tr><td>4</td><td>Draft response</td><td>25</td><td>120</td></tr>
      <tr><td>5</td><td>MLR review</td><td>15</td><td>960</td></tr>
      <tr><td>6</td><td>Send to HCP</td><td>4</td><td>30</td></tr>
      <tr class="tot"><td></td><td>Totals</td><td>92</td><td>1890</td></tr>
    </tbody>
  </table>
  <p class="datanote">Working day = 450 min. Demand = <b>30 requests/day</b>. Treat process time as value-add.</p>`,
  deep:`<p><b>Mapping an office value stream.</b> The mechanics are the same as the factory, but the data lives in systems, not on the floor. Process time comes from time-in-system stamps or a quick time study; <em>wait time</em> is the gap between "arrived in queue" and "work started" — usually visible in the ticketing/CRM tool's status history. Add a <em>%C&amp;A</em> per handoff (how often the next person can use the work without clarification or rework) and a <em>rework loop</em> arrow wherever items bounce back (MLR is the obvious one). Always validate the map by following a handful of real requests end-to-end rather than trusting the SLA on paper.</p>
  <p><b>Reading this stream.</b> Lead time 1982 min for 92 min of work is a PCE of 4.6% — and the single biggest block is the 960-minute MLR queue, over 48% of the whole lead time. The bottleneck of <em>hands-on</em> time is literature research (35 min), but attacking that barely moves the needle; the lead-time prize is the review queue. This is the universal pattern in knowledge work: the constraint is almost always a <em>shared review/approval resource</em> that everything funnels through.</p>
  <p><b>Future-state moves for a review-bound stream.</b> (1) Cap WIP into MLR with a pull/kanban limit so the queue can't grow unbounded. (2) Create classes of service (fast-track simple, standard responses pre-approved once) so 80% of requests skip the deep queue. (3) Build a reusable, pre-approved response library (attack overprocessing and rework). (4) Pull the reviewer earlier / pair-review to cut the handoff wait. (5) Track %C&A into MLR so fewer items rework. The governing idea: in a stream that is mostly waiting, you manage the <em>queue</em>, not the worker.</p>`,
  exercises:[
    { type:'numeric', prompt:'Analyse the MI value stream.',
      fields:[
        { key:'lt', label:'Total lead time', unit:'min', answer:1982, tol:1 },
        { key:'pce', label:'Process Cycle Efficiency', unit:'%', answer:4.64, tol:0.3 },
        { key:'days', label:'Lead time in working days', unit:'days', answer:4.40, tol:0.1 },
        { key:'takt', label:'Takt time', unit:'min/req', answer:15, tol:0.1 },
        { key:'over', label:'Steps with process time ABOVE takt', unit:'steps', answer:2, tol:0 },
      ],
      solution:`<p>LT = 92 + 1890 = 1982 min; PCE = 4.64%; days = 1982/450 = 4.40; takt = 450/30 = 15; steps above 15 = research (35) and draft (25) → 2. The 960-min MLR queue is the dominant problem.</p>` },
    { type:'mcq', prompt:'Where is the leverage?',
      questions:[
        { text:'Which single change most reduces lead time?', options:['Cut intake from 5 to 3 min','Attack/cap the 960-min MLR review queue','Hire a faster typist','Print in colour'], correct:1 },
        { text:'Most of the elapsed time in this stream is…', options:['Value-adding work','Waiting in queues','Transportation','Inspection'], correct:1 },
        { text:'In knowledge-work streams, the constraint is most often…', options:['Typing speed','A shared review/approval resource','Email','Printing'], correct:1 },
      ],
      solution:`<p>The MLR queue is 48%+ of lead time; the stream is queue-dominated; and a shared approval gate is the usual knowledge-work constraint.</p>` },
  ]
},

/* ===== 15. MLR HIDDEN FACTORY ===== */
{
  id:'l15', area:'lean', track:'Applied · Commercial', title:'Quality & rework: the MLR \u201chidden factory\u201d', min:40,
  concept:`<p>Rework is invisible waste — the "hidden factory" that consumes capacity without adding value. <strong>First-Pass Yield (FPY)</strong> measures how much passes a gate cleanly the first time.</p>
  <pre class="cc">First-Pass Yield = passed first time / total submitted
Total review events = sum of submissions across all passes</pre>
  <p><b>Data:</b> 200 promotional pieces go to MLR review (15 min each). On pass 1, 120 are approved and 80 need rework. Of those 80, 60 clear pass 2 and 20 need a pass 3 (all then approved).</p>`,
  deep:`<p><b>Why it's "hidden".</b> A standard utilisation report shows the MLR team busy 100% of the time and looks healthy — but a large share of that effort is re-reviewing work that should have passed once. That re-review is a whole "factory" of capacity producing nothing new, and it's invisible unless you measure first-pass yield and count <em>review events</em> rather than items. The same logic gives <em>Rolled Throughput Yield</em> across multiple gates: multiply the first-pass yields of each step (0.9 × 0.9 × 0.9 = 0.73), which is often shockingly low across a multi-gate approval chain.</p>
  <p><b>The arithmetic of the example.</b> FPY = 120/200 = 60%. Review events = 200 (pass 1) + 80 (pass 2) + 20 (pass 3) = 300 → 4500 reviewer-minutes (75 hours). Raise FPY to 85% (only 30 pieces rework, once) and events fall to 230 → 3450 minutes: <b>1050 minutes (17.5 hours) of senior reviewer capacity freed</b> with no extra headcount — purely by getting it right the first time.</p>
  <p><b>Countermeasures that actually work.</b> The instinct is to add reviewers (treat the symptom). The Lean move is to raise input quality so fewer items fail: clear, worked <em>templates</em> and exemplars; a pre-approved claims/reference library; author self-check poka-yoke (a submission checklist that blocks incomplete packages — mistake-proofing the input); early/parallel reviewer involvement; and feeding the <em>top rejection reasons</em> back to authors (a Pareto of why things bounce). Tracking FPY and the rejection-reason Pareto turns an invisible drain into a managed, shrinking problem.</p>`,
  exercises:[
    { type:'numeric', prompt:'Quantify the hidden factory.',
      fields:[
        { key:'fpy', label:'First-Pass Yield', unit:'%', answer:60, tol:0.5 },
        { key:'events', label:'Total review events (all passes)', unit:'reviews', answer:300, tol:1 },
        { key:'mins', label:'Total reviewer time at 15 min each', unit:'min', answer:4500, tol:5 },
        { key:'save', label:'Minutes saved if FPY rose to 85% (30 rework, one extra pass each)', unit:'min', answer:1050, tol:5 },
      ],
      solution:`<p>FPY = 120/200 = 60%. Events = 200+80+20 = 300 → 4500 min. At 85% FPY: 200+30 = 230 → 3450 min. Saving = <b>1050 min</b> (17.5 h).</p>` },
    { type:'mcq', prompt:'Concept check.',
      questions:[
        { text:'The "hidden factory" refers to…', options:['A secret production line','Capacity consumed by rework and corrections','Overtime shifts','Outsourced work'], correct:1 },
        { text:'The best countermeasure for low FPY is usually…', options:['Add more reviewers','Raise input quality so fewer pieces fail','Skip the review','Batch reviews monthly'], correct:1 },
        { text:'Rolled Throughput Yield across three 90% gates is about…', options:['90%','73%','97%','30%'], correct:1 },
      ],
      solution:`<p>Rework is a hidden factory; raise input quality (templates, checklists, feedback) rather than adding reviewers; and 0.9³ ≈ 73% rolled throughput yield.</p>` },
  ]
},

/* ===== 16. CAPSTONE ===== */
{
  id:'l16', area:'lean', track:'Applied · Commercial', title:'Capstone: a patient-onboarding service desk', min:45,
  concept:`<p>Bring the toolkit together on a service operation — onboarding patients to a support programme. Flow, takt and Little's Law apply to people-in-a-queue exactly as to parts on a line.</p>
  <pre class="cc">Takt = available time / demand
Utilisation = cycle time / takt
Lead time = WIP / throughput        (Little's Law)</pre>
  <p><b>Data:</b> demand 48 onboardings/day · working time 420 min/day · handling time 7 min each · average WIP in the pipeline 96 requests.</p>`,
  deep:`<p><b>Putting the system together.</b> A service desk is a value stream: demand sets takt, handling time is the process/cycle time, the backlog is WIP, and the daily completion rate is throughput. Designing it well means choosing a target <em>utilisation</em> with deliberate slack (because of the utilisation trap from Little's-Law/Kingman), capping the backlog (WIP) to control lead time, levelling the intake where possible (heijunka of arrivals via scheduling/appointment slotting), standardising the handling work, and mistake-proofing intake so cases don't bounce (FPY again).</p>
  <p><b>The numbers and what they say.</b> Takt = 420/48 = 8.75 min/case; with 7-min handling, utilisation = 80% — healthy headroom, so queues stay stable. Lead time = WIP/throughput = 96/48 = 2 days; halving the 96-case backlog would halve the customer wait, no extra staff needed. If you instead pushed utilisation toward 100% to "be efficient", the same arithmetic that gives 2 days would blow out as variability hits a saturated system.</p>
  <p><b>Diagnosis discipline.</b> Match the tool to the symptom. A stream that's mostly waiting → Lean flow (cap WIP, level arrivals, remove handoffs). Excess variation in a capable-looking process → Six Sigma. Frequent rework → FPY / poka-yoke at intake. A bottleneck resource → Theory of Constraints (subordinate everything to it; don't locally optimise the rest). The mark of competence isn't knowing the tools — it's reaching for the <em>right</em> one given what the data shows.</p>`,
  exercises:[
    { type:'numeric', prompt:'Diagnose the service desk.',
      fields:[
        { key:'takt', label:'Takt time', unit:'min/req', answer:8.75, tol:0.1 },
        { key:'util', label:'Utilisation (cycle / takt)', unit:'%', answer:80, tol:1 },
        { key:'lt', label:'Lead time via Little\u2019s Law', unit:'days', answer:2, tol:0.1 },
      ],
      solution:`<p>Takt = 420/48 = 8.75; utilisation = 7/8.75 = 80%; lead time = 96/48 = 2 days. Cut the backlog and the wait falls with it.</p>` },
    { type:'mcq', prompt:'Final synthesis.',
      questions:[
        { text:'Per Little\u2019s Law, the fastest way to cut customer wait is to…', options:['Add staff only','Reduce WIP (the backlog)','Work longer hours','Raise prices'], correct:1 },
        { text:'Driving utilisation to ~100% typically…', options:['Eliminates queues','Makes queues and delays balloon','Has no effect','Improves quality'], correct:1 },
        { text:'A stream that is 95%+ waiting should be tackled first with…', options:['Six Sigma variation tools','Lean flow & waste removal','A new IT system','More inspection'], correct:1 },
        { text:'Frequent case bounce-backs at intake are best fixed with…', options:['More reviewers','Poka-yoke / higher first-pass yield at intake','Bigger batches','A longer SLA'], correct:1 },
      ],
      solution:`<p>Cut WIP to cut lead time; near-100% utilisation explodes queues; a wait-dominated stream is a Lean flow problem; and intake rework is fixed by mistake-proofing/raising FPY at the source.</p>` },
  ]
},

/* ===== 17. ROOT CAUSE: 5 WHYS & FISHBONE ===== */
{
  id:'l17', area:'lean', track:'Problem-Solving Tools', title:'Root Cause: 5 Whys & Fishbone (Ishikawa)', min:40,
  concept:`<p>Before fixing anything, find the <em>real</em> cause. Two classic tools do this.</p>
  <p><strong>5 Whys</strong> — keep asking "why?" (about five times) to walk from the symptom down to a root cause you can actually act on. Stop when the answer points to a process or system you control.</p>
  <p><strong>Fishbone (Ishikawa / cause-and-effect)</strong> — put the problem in the fish's head, then brainstorm causes along bones grouped into categories. The classic categories are the <em>6 Ms</em>: Manpower (people), Machine, Method, Material, Measurement and Environment (Mother Nature).</p>
  <p>Use them together: the fishbone spreads your thinking wide across categories; the 5 Whys drills deep on the most promising bones.</p>`,
  deep:`<p><b>Doing 5 Whys well.</b> The danger is a single, lazy chain that ends at "human error" or "they didn't try hard enough" — which is blame, not a root cause. Good practice: anchor each "why" in evidence (go to the gemba, look at data), allow the chain to <em>branch</em> (a problem can have several root causes), and test the logic in reverse with "therefore" — if "root cause → therefore → symptom" reads sensibly, the chain holds. A real root cause is one where a countermeasure prevents recurrence; if removing it wouldn't stop the problem, dig further. Beware stopping too early (you fix a symptom) or going too deep (you reach "the laws of physics").</p>
  <p><b>Doing the fishbone well.</b> Ishikawa created it at Kawasaki; it is one of the seven basic quality tools. Brainstorm causes per category with the team, then mark the few most likely to verify with data — the diagram <em>generates hypotheses</em>, it doesn't prove them. In services, the 6 Ms are often relabelled the <em>4 Ss</em> (Surroundings, Suppliers, Systems, Skills) or simply People / Process / Policy / Place. The categories are scaffolding to prevent tunnel vision, not a rigid taxonomy.</p>
  <p><b>How they fit the cycle.</b> Root-cause analysis is the "Analyse" heart of PDCA, A3 and DMAIC. The sequence is almost always: define the problem precisely → fishbone to map candidate causes → pick the likely few → 5 Whys to drill → verify with data → only then design countermeasures. Skipping straight to countermeasures (the universal temptation) is how teams "solve" the same problem repeatedly.</p>`,
  exercises:[
    { type:'classify',
      prompt:'Assign each candidate cause of <b>late MLR responses</b> to the correct fishbone category (6 Ms).',
      chart:{type:'fishbone', problem:'Late MLR responses'},
      categories:['Manpower','Machine','Method','Material','Measurement','Environment'],
      items:[
        { text:'Reviewers are split across many other duties', answer:0 },
        { text:'The approval software is slow and clunky', answer:1 },
        { text:'There is no standard response template', answer:2 },
        { text:'Author submissions arrive missing data', answer:3 },
        { text:'Queue age is never measured or visible', answer:4 },
        { text:'A noisy, interruption-heavy open office', answer:5 },
      ],
      solution:`<p>People → Manpower; software → Machine; missing template → Method; incomplete inputs → Material; unmeasured queue → Measurement; interruptions/surroundings → Environment. In practice a cause can plausibly sit in two categories — the value is the structured spread, then verifying with data.</p>` },
    { type:'mcq', prompt:'Root-cause reasoning.',
      questions:[
        { text:'A 5 Whys chain that ends at "the operator wasn\u2019t careful enough" is usually…', options:['A valid root cause','Blame, not a root cause \u2014 dig further into the system','The correct stopping point','A measurement error'], correct:1 },
        { text:'The fishbone diagram primarily…', options:['Proves the cause statistically','Generates and organises candidate causes (hypotheses)','Replaces data collection','Sets the takt time'], correct:1 },
        { text:'You know you\u2019ve reached a usable root cause when…', options:['You\u2019ve asked exactly five whys','A countermeasure there would prevent recurrence','It mentions a person','It sounds complicated'], correct:1 },
      ],
      solution:`<p>"Not careful enough" is blame; the fishbone generates hypotheses to verify; and the test of a root cause is that addressing it stops recurrence — not a fixed count of whys.</p>` },
    { type:'worksheet', prompt:'Template \u2014 run a 5 Whys on a problem of your own (saved on this device).',
      template:{ kind:'fivewhys', problem:'' } },
    { type:'worksheet', prompt:'Template \u2014 a blank fishbone (6 Ms) to brainstorm causes against.',
      template:{ kind:'fishbone' } },
  ]
},

/* ===== 18. PARETO & 7 QC TOOLS ===== */
{
  id:'l18', area:'lean', track:'Problem-Solving Tools', title:'Pareto Analysis & the 7 Basic Quality Tools', min:35,
  concept:`<p><strong>Pareto analysis</strong> applies the 80/20 rule: typically a <em>vital few</em> causes drive most of the problem. You count occurrences by cause, sort them descending as bars, and overlay the <em>cumulative %</em> line. Where the line crosses ~80% tells you the handful of causes to tackle first.</p>
  <p>It's one of the <strong>7 Basic Quality Tools</strong> (Ishikawa's set): <em>check sheet, histogram, Pareto chart, fishbone, control chart, scatter diagram,</em> and <em>flowchart/stratification</em>. Between them they cover almost all day-to-day data analysis on a shop floor or in an office.</p>
  <p>Below: MLR rejection reasons over one month. Read the chart, then answer.</p>`,
  deep:`<p><b>Why Pareto works.</b> The Pareto principle (Juran named it after the economist Vilfredo Pareto) observes that effects are unevenly distributed — a small number of causes usually dominate. Focusing improvement on the vital few gives the most return for effort and stops teams from spreading themselves thin across trivial many. A subtlety: choose the right <em>unit</em> for the bars — ranking by frequency vs by cost/impact can point at different priorities (50 cheap defects may matter less than 5 expensive ones), so a cost-weighted Pareto is often more honest.</p>
  <p><b>The seven tools, briefly.</b> <em>Check sheet</em>: a simple tally form to collect data consistently at the source. <em>Histogram</em>: shows the shape/spread of a measurement (is it centred? skewed? bimodal?). <em>Pareto</em>: ranks categories to find the vital few. <em>Fishbone</em>: organises candidate causes. <em>Control chart</em>: tracks a metric over time with control limits to separate common-cause noise from special-cause signals. <em>Scatter diagram</em>: reveals relationship/correlation between two variables. <em>Flowchart / stratification</em>: maps the process and splits data into meaningful sub-groups. Reach for them in roughly that order: define and collect (check sheet), describe (histogram/Pareto), diagnose (fishbone/scatter), monitor (control chart).</p>
  <p><b>Common misuse.</b> A Pareto on badly stratified data misleads — if "Other" is your biggest bar, your categories are wrong. And a Pareto is a snapshot: re-run it after improving, because once you remove the top cause, a new vital few emerges (the principle is recursive).</p>`,
  exercises:[
    { type:'numeric', prompt:'Read the Pareto of MLR rejection reasons.',
      chart:{type:'pareto', data:[
        {label:'Missing reference', value:45},
        {label:'Claim unsubstantiated', value:30},
        {label:'Fair balance', value:15},
        {label:'Formatting', value:6},
        {label:'Other', value:4}
      ]},
      fields:[
        { key:'vf', label:'How many reasons must you fix to exceed 80% of rejections?', unit:'reasons', answer:3, tol:0 },
        { key:'top2', label:'What % of rejections come from the top TWO reasons?', unit:'%', answer:75, tol:0.5 },
      ],
      solution:`<p>Cumulative: 45, 75, 90, 96, 100. The top two give <b>75%</b> — not yet 80% — so you need the top <b>three</b> (90%) to exceed 80%. Fixing "missing reference" and "unsubstantiated claim" alone clears three-quarters of all rejections.</p>` },
    { type:'mcq', prompt:'Pareto & the 7 tools.',
      questions:[
        { text:'The single biggest rejection reason here is…', options:['Formatting','Missing reference','Fair balance','Other'], correct:1 },
        { text:'If "Other" were your largest Pareto bar, it would mean…', options:['The analysis is finished','Your categories are poorly defined','You found the root cause','Quality is excellent'], correct:1 },
        { text:'Which of the 7 tools separates common-cause noise from special-cause signals over time?', options:['Histogram','Control chart','Scatter diagram','Check sheet'], correct:1 },
      ],
      solution:`<p>"Missing reference" dominates; a giant "Other" bar means poor stratification; and the control chart is the tool for distinguishing common- vs special-cause variation over time.</p>` },
  ]
},

/* ===== 19. SIPOC & PROCESS MAPPING ===== */
{
  id:'l19', area:'lean', track:'Problem-Solving Tools', title:'SIPOC & Process Mapping', min:35,
  concept:`<p>Before improving a process you must agree on what it <em>is</em>. <strong>SIPOC</strong> is a one-page, high-level scope: <em>Suppliers → Inputs → Process → Outputs → Customers</em>. You fill it right-to-left in practice (start from the customer and what they need), and the Process column is just 4–7 high-level steps — not the detail.</p>
  <p>From there you go deeper with <strong>process maps</strong>: a flowchart of steps and decisions, a <strong>swimlane</strong> map (who does what, across roles), or a <strong>spaghetti diagram</strong> (drawing the physical path of a person or item to expose transport and motion waste).</p>`,
  deep:`<p><b>Why SIPOC first.</b> Most improvement projects fail at the boundary: people argue because they each picture a different process. SIPOC forces a shared, bounded definition in 30 minutes — where the process starts and ends, who feeds it, who receives it, and what "good" inputs and outputs look like. It pairs naturally with Voice-of-the-Customer (the Outputs and Customers columns are where you attach CTQs — Critical-to-Quality requirements) and is the standard first artefact in DMAIC's Define phase.</p>
  <p><b>Levels of process map.</b> SIPOC is the 30,000-foot view; a flowchart is the 10,000-foot view; a swimlane adds <em>who</em> (rows = roles), which instantly reveals handoffs — and handoffs are where queues, rework and dropped balls live. A <em>spaghetti diagram</em> traces literal movement on a layout; a tangle of lines is a picture of motion and transport waste (just as common in an office's approval routing as on a factory floor). A <em>value-stream map</em> adds the timing data on top.</p>
  <p><b>Reading a map for waste.</b> Once mapped, hunt for: handoffs (each one risks a queue and a %C&A drop), loops back (rework), decision diamonds with unclear rules (variation), and steps that add no customer value (candidates to cut). The map is the canvas on which the eight wastes become visible — which is why mapping precedes nearly every kaizen.</p>`,
  exercises:[
    { type:'classify',
      prompt:'Classify each element of the Medical Information process into its SIPOC column.',
      diagram:'<table class="dtable"><thead><tr><th>S</th><th>I</th><th>P</th><th>O</th><th>C</th></tr></thead><tbody><tr><td>Suppliers</td><td>Inputs</td><td>Process</td><td>Outputs</td><td>Customers</td></tr></tbody></table>',
      categories:['Supplier','Input','Process','Output','Customer'],
      items:[
        { text:'Medical literature databases', answer:0 },
        { text:'The inbound question and product data', answer:1 },
        { text:'Triage \u2192 research \u2192 draft \u2192 review', answer:2 },
        { text:'The approved written response', answer:3 },
        { text:'The healthcare professional receiving the answer', answer:4 },
        { text:'Regulatory reference guidelines', answer:1 },
      ],
      solution:`<p>Databases & guidelines suppliers feed <em>inputs</em> (the question, product data, references); the <em>process</em> is the 4 high-level steps; the <em>output</em> is the approved response; the <em>customer</em> is the HCP. Note one supplier can provide several inputs.</p>` },
    { type:'mcq', prompt:'Mapping concepts.',
      questions:[
        { text:'A SIPOC\u2019s Process column should contain…', options:['Every detailed task','4\u20137 high-level steps','The org chart','The budget'], correct:1 },
        { text:'A swimlane map is especially good at exposing…', options:['Handoffs between roles','Machine speeds','Material cost','Takt time'], correct:0 },
        { text:'A spaghetti diagram primarily reveals which wastes?', options:['Defects and rework','Transportation and motion','Overproduction','Waiting only'], correct:1 },
      ],
      solution:`<p>SIPOC stays high-level (4\u20137 steps); swimlanes reveal role handoffs; spaghetti diagrams expose transport and motion.</p>` },
    { type:'worksheet', prompt:'Template \u2014 build a SIPOC for a process you own (saved on this device).',
      template:{ kind:'sipoc' } },
  ]
},

/* ===== 20. CASE A \u2014 A3 / PDCA ===== */
{
  id:'l20', area:'lean', track:'Case Walkthroughs', title:'Case A \u2014 MLR bottleneck, solved with A3 / PDCA', min:50,
  visual:{type:'vsm', caption:'Medical Information request — value stream map', demand:'30 req', steps:[{name:'Intake & log',pt:5,wt:60},{name:'Triage',pt:8,wt:240},{name:'Literature research',pt:35,wt:480},{name:'Draft response',pt:25,wt:120},{name:'MLR review',pt:15,wt:960},{name:'Send to HCP',pt:4,wt:30}]},
  concept:`<p>A full walkthrough of an <strong>A3 / PDCA</strong> improvement on the Medical Information stream. The A3 is a one-page story; PDCA is the cycle running underneath it. Follow every step.</p>
  <ol>
    <li><b>Background (Plan).</b> HCP questions take ~4.4 working days to answer; field teams complain; compliance risk if responses lapse.</li>
    <li><b>Current condition (Plan).</b> VSM shows lead time 1982 min, only 92 min of work \u2014 PCE 4.6%. The MLR review queue alone is 960 min (almost half the lead time).</li>
    <li><b>Goal / target (Plan).</b> Cut lead time to under 3 working days within one quarter, with no drop in compliance quality.</li>
    <li><b>Analysis (Plan).</b> Fishbone + 5 Whys point at the review queue: reviewers are shared, there is no fast-track for simple questions, and no pre-approved answer library, so everything waits in one queue.</li>
    <li><b>Countermeasures (Plan).</b> (a) WIP-cap the MLR queue; (b) create a fast-track class of service for standard questions answered from a pre-approved library; (c) make queue age visible on a board.</li>
    <li><b>Do.</b> Pilot on one therapy area for 4 weeks.</li>
    <li><b>Check.</b> Measure lead time and quality vs the target.</li>
    <li><b>Act.</b> Standardise what worked, roll out, and keep the board for control.</li>
  </ol>
  <p>Work the numbers, then capture your own version in the A3 template below.</p>`,
  deep:`<p><b>Facilitator's view.</b> The discipline of A3 is that the left side (Plan: background → current → goal → analysis) must be airtight <em>before</em> any countermeasure on the right. Most teams race to the right side; a good coach keeps asking "what does the data say?" on the left. The current-state must be quantified (the VSM), the goal must be measurable and time-bound, and the analysis must trace to a verified root cause (here: a single shared review queue), not a guess.</p>
  <p><b>Why these countermeasures.</b> They map straight to Lean principles: the WIP cap is pull/Little's Law (cap WIP → cap lead time); the fast-track is a <em>class of service</em> that stops simple work from queuing behind complex work; the pre-approved library attacks <em>overprocessing and rework</em> (re-deriving answers that already exist) and lifts first-pass yield. The visible board is visual management for the Control step. Notice none of them is "work harder" or "add reviewers" — they change the <em>system</em>.</p>
  <p><b>Check honestly, then Control.</b> The Check step compares actuals to the target <em>and</em> guards quality (you haven't won if speed rose but compliance fell). If results miss, you Adjust (it's PDCA, not PDC-done) and re-run. When it works, the Act step standardises the new method (standardised work) and the board sustains it \u2014 mirroring 5S-Sustain and DMAIC-Control. The A3 then becomes the baseline for the next cycle.</p>`,
  exercises:[
    { type:'numeric', prompt:'Quantify the current state and the proposed target.',
      fields:[
        { key:'pce', label:'Current PCE (92 work min, 1982 lead min)', unit:'%', answer:4.64, tol:0.3 },
        { key:'lt2', label:'New lead time if the MLR wait is cut 960 \u2192 240 min', unit:'min', answer:1262, tol:2 },
        { key:'days2', label:'New lead time in working days (450 min/day)', unit:'days', answer:2.80, tol:0.1 },
      ],
      solution:`<p>PCE = 92/1982 = <b>4.64%</b>. Cutting the MLR wait by 720 min: lead = 1982 \u2212 720 = <b>1262 min</b> = 1262/450 = <b>2.80 days</b> \u2014 under the 3-day target, achieved by attacking the queue, not the work.</p>` },
    { type:'mcq', prompt:'A3 / PDCA judgement.',
      questions:[
        { text:'In the A3, what must be solid before any countermeasure?', options:['The budget','The left side: background, current state, goal, root-cause analysis','The rollout plan','The org chart'], correct:1 },
        { text:'The WIP cap on the review queue is an application of…', options:['Six Sigma','Pull / Little\u2019s Law','OEE','SMED'], correct:1 },
        { text:'During Check, speed improved but compliance quality dropped. You should…', options:['Roll out anyway','Adjust and re-run (PDCA continues)','Abandon Lean','Hide the quality data'], correct:1 },
      ],
      solution:`<p>The Plan/left side must be airtight first; the WIP cap is pull/Little's Law; and a quality drop means Adjust and re-run \u2014 the cycle isn't done until the target is met without harming quality.</p>` },
    { type:'worksheet', prompt:'Template \u2014 your own A3 (saved on this device).',
      template:{ kind:'a3' } },
  ]
},

/* ===== 21. CASE B \u2014 KAIZEN EVENT ===== */
{
  id:'l21', area:'lean', track:'Case Walkthroughs', title:'Case B \u2014 onboarding backlog, solved with a Kaizen Event', min:45,
  concept:`<p>A <strong>Kaizen Event</strong> (a focused, ~5-day cross-functional blitz) on a patient-onboarding service desk. The desk handles 48 onboardings/day in 420 working minutes; handling time is 7 min; the backlog (WIP) sits at 96, so lead time is 2 days.</p>
  <p>The week, step by step:</p>
  <ol>
    <li><b>Mon \u2014 Prepare &amp; scope.</b> Charter the problem (2-day onboarding wait), set the target (1 day), agree the boundaries (SIPOC).</li>
    <li><b>Tue \u2014 Current state.</b> Go to the gemba, map the flow, compute takt, utilisation and WIP. Find work waiting in big batches.</li>
    <li><b>Wed \u2014 Root cause &amp; ideas.</b> Fishbone + 5 Whys; brainstorm countermeasures (level intake, cap WIP, standardise the handling steps, mistake-proof intake forms).</li>
    <li><b>Thu \u2014 Pilot.</b> Implement the top changes on the live desk and observe.</li>
    <li><b>Fri \u2014 Results &amp; control.</b> Measure the new lead time, standardise, set up a visual board, assign owners, plan the 30-day follow-up.</li>
  </ol>`,
  deep:`<p><b>What makes an event work (or fail).</b> A Kaizen Event concentrates a cross-functional team for a few days to implement \u2014 not just plan \u2014 improvement. Success factors: a tight, pre-scoped problem; the right people in the room <em>full-time</em> (including those who do the work); a measurable target; authority to change the process that week; and \u2014 the most-skipped \u2014 a <em>30/60/90-day follow-up</em> with an owner, because events that aren't sustained decay. The failure mode is the "event as theatre": a burst of energy, a wall of sticky notes, and no durable change. The event is one engine of kaizen, complementing daily kaizen and flow kaizen; on its own it's not a strategy.</p>
  <p><b>The countermeasures, in Lean terms.</b> Levelling intake (heijunka of arrivals via appointment slotting) attacks Mura; capping WIP applies Little's Law to cut lead time; standardising the handling steps reduces variation and enables training; mistake-proofing the intake form (poka-yoke) raises first-pass yield so cases stop bouncing. Together they change the system rather than asking staff to sprint.</p>
  <p><b>The arithmetic of the target.</b> Throughput is 48/day, so by Little's Law lead time = WIP/48. To hit a 1-day lead time you must hold the backlog at about 48 \u2014 which is exactly what a WIP cap enforces. The event's job is to get the desk to a stable state where that cap holds without starving or overwhelming the team (utilisation at 80% gives the slack to absorb variability).</p>`,
  exercises:[
    { type:'numeric', prompt:'Work the service-desk numbers.',
      fields:[
        { key:'takt', label:'Takt time (420 min / 48 per day)', unit:'min/req', answer:8.75, tol:0.1 },
        { key:'lt', label:'Current lead time (WIP 96, throughput 48/day)', unit:'days', answer:2, tol:0.1 },
        { key:'wip1', label:'WIP cap needed for a 1-day lead time', unit:'requests', answer:48, tol:0 },
      ],
      solution:`<p>Takt = 420/48 = 8.75 min. Lead = WIP/throughput = 96/48 = <b>2 days</b>. For a 1-day lead time: 1 = WIP/48 \u2192 cap WIP at <b>48</b>. The event installs and stabilises that cap.</p>` },
    { type:'mcq', prompt:'Kaizen-event judgement.',
      questions:[
        { text:'The most commonly skipped \u2014 and most important \u2014 part of a Kaizen Event is…', options:['The opening lunch','The 30/60/90-day follow-up with an owner','The slide deck','The sticky notes'], correct:1 },
        { text:'Levelling the intake by appointment slotting attacks which enemy?', options:['Muda only','Mura (unevenness)','Muri only','None'], correct:1 },
        { text:'Capping WIP to cut lead time is justified by…', options:['OEE','Little\u2019s Law','SMED','5S'], correct:1 },
      ],
      solution:`<p>Sustained follow-up is the make-or-break step; levelling intake attacks Mura; and the WIP cap rests on Little's Law.</p>` },
  ]
},

/* ===== 22. CASE C \u2014 DMAIC ===== */
{
  id:'l22', area:'lean', track:'Case Walkthroughs', title:'Case C \u2014 lab sample defects, solved with DMAIC', min:50,
  visual:{type:'control', caption:'Defect-rate control chart (one special-cause point)', label:'defects / day', mean:5, ucl:11, lcl:0, values:[4,6,5,7,3,5,12,4,6,5,8,2]},
  concept:`<p>A <strong>DMAIC</strong> project on sample-handling defects in a lab \u2014 the right approach when the problem is <em>defects and variation</em>, not just slow flow. Walk all five phases.</p>
  <ol>
    <li><b>Define.</b> Charter: reduce sample-handling defects. Scope with a SIPOC; capture the customer requirement (correct, on-spec samples).</li>
    <li><b>Measure.</b> Build a check sheet; over a month, 2000 samples with 2 defect opportunities each yield 100 defects. Compute the baseline DPMO and yield.</li>
    <li><b>Analyse.</b> Pareto the 100 defects by reason; fishbone + 5 Whys on the top reasons to find root causes.</li>
    <li><b>Improve.</b> Mistake-proof the top causes (barcode scan to prevent mislabelling; a fixed-volume dispenser).</li>
    <li><b>Control.</b> Put the key metric on a control chart, standardise, and assign an owner so the gain holds.</li>
  </ol>
  <p>Below is the Measure baseline and the Analyse Pareto.</p>`,
  deep:`<p><b>Define &amp; Measure done right.</b> Define bounds the project and ties it to a customer CTQ; the trap is a fuzzy scope that balloons. Measure must establish a <em>trustworthy</em> baseline \u2014 before trusting any defect data you'd run a Measurement System Analysis (Gage R&R) to confirm inspectors agree on what a defect is. DPMO normalises quality across processes of different complexity by counting <em>opportunities</em>, not just units, so you can compare a 2-opportunity step with a 10-opportunity one.</p>
  <p><b>Analyse with the basic tools.</b> This is where the 7 QC tools earn their keep: a Pareto to find the vital-few defect reasons, then fishbone + 5 Whys to reach root causes, with hypotheses verified against the data (a scatter or stratified histogram if a relationship is suspected). The point is to let data, not opinion, pick the targets.</p>
  <p><b>Improve &amp; Control \u2014 the Lean&times;Six-Sigma join.</b> The strongest Improve countermeasures here are <em>poka-yoke</em> (barcode scanning makes mislabelling impossible; a fixed-volume dispenser removes the wrong-volume error) \u2014 prevention beats inspection. Control is the phase teams skip and the reason gains evaporate: a control chart distinguishes real shifts from noise, standardised work locks the method, and an owner watches the metric. Note the symmetry across the toolkit \u2014 Control \u2261 PDCA-Act \u2261 5S-Sustain: every serious approach ends by making the improvement permanent.</p>`,
  exercises:[
    { type:'numeric', prompt:'Measure phase \u2014 compute the baseline.',
      fields:[
        { key:'opp', label:'Total defect opportunities (2000 samples \u00D7 2)', unit:'', answer:4000, tol:1 },
        { key:'dpmo', label:'DPMO (100 defects)', unit:'', answer:25000, tol:50 },
        { key:'yield', label:'Yield', unit:'%', answer:97.5, tol:0.1 },
      ],
      solution:`<p>Opportunities = 2000 \u00D7 2 = 4000. DPMO = 100/4000 \u00D7 1,000,000 = <b>25,000</b>. Yield = (1 \u2212 25,000/1,000,000) = <b>97.5%</b> (\u2248 3.5\u03C3).</p>` },
    { type:'numeric', prompt:'Analyse phase \u2014 read the Pareto of the 100 defects.',
      chart:{type:'pareto', data:[
        {label:'Mislabelled', value:52},
        {label:'Wrong volume', value:28},
        {label:'Late receipt', value:12},
        {label:'Wrong tube', value:5},
        {label:'Other', value:3}
      ]},
      fields:[
        { key:'vf', label:'How many reasons reach \u2265 80% cumulative (the vital few)?', unit:'reasons', answer:2, tol:0 },
        { key:'top2', label:'% of defects from the top two reasons', unit:'%', answer:80, tol:0.5 },
      ],
      solution:`<p>Cumulative: 52, 80, 92, 97, 100. The top <b>two</b> reasons \u2014 mislabelled and wrong volume \u2014 make up <b>80%</b>, so just two poka-yokes (barcode scan, fixed-volume dispenser) target the vast majority of defects.</p>` },
    { type:'mcq', prompt:'DMAIC judgement.',
      questions:[
        { text:'Why count "opportunities" in DPMO rather than just units?', options:['To inflate the number','To compare processes of different complexity fairly','It is required by law','To match takt time'], correct:1 },
        { text:'The strongest Improve countermeasure for mislabelling is…', options:['More end-of-line inspection','A barcode scan that prevents the error (poka-yoke)','A monthly reminder email','A bigger sample backlog'], correct:1 },
        { text:'The Control phase is equivalent in spirit to…', options:['PDCA-Act and 5S-Sustain','The Define phase','Takt time','A spaghetti diagram'], correct:0 },
      ],
      solution:`<p>Opportunities normalise complexity for fair comparison; prevention (poka-yoke) beats inspection; and Control mirrors PDCA-Act and 5S-Sustain \u2014 every approach ends by making gains stick.</p>` },
  ]
},

/* ===== 23. LEAN x AI: AGENTS & ORCHESTRATION ===== */
{
  id:'l23', area:'lean', track:'Lean \u00D7 AI', title:'Lean \u00D7 AI: Agents, Orchestration & Transformation', min:45,
  visual:{type:'matrix', caption:'Prioritising a pipeline \u2014 value vs effort', items:[{title:'MI agent',effortScore:3,valueScore:5},{title:'MLR pre-check',effortScore:2,valueScore:4},{title:'Analytics copilot',effortScore:3,valueScore:4},{title:'Order orchestration',effortScore:4,valueScore:4}]},
  concept:`<p>AI \u2014 especially <strong>agents</strong> and <strong>orchestration</strong> \u2014 is the most powerful new countermeasure in the Lean toolkit. The trick is to use Lean to aim it.</p>
  <p><strong>An agent</strong> is a digital worker that can take a task end-to-end (read a request, retrieve facts, draft a response). Think of it as an operator at a station. <strong>Orchestration</strong> is the layer that routes work between agents and humans and keeps the flow moving \u2014 the pull system and pacemaker of an "agentic value stream".</p>
  <p>Each Lean waste suggests an AI countermeasure: <em>Waiting</em> \u2192 an orchestrator removes handoff queues; <em>Defects</em> \u2192 a validation/poka-yoke agent; <em>Overprocessing</em> \u2192 a drafting agent working from a pre-approved library; <em>Non-utilised talent</em> \u2192 a copilot that frees experts for judgement work.</p>
  <p>The method: map the process, build a <em>pipeline</em> of candidate use cases, <em>prioritise</em> them by value vs effort, and run each as a transformation project (discovery \u2192 pilot \u2192 scale \u2192 control). The <b>\u2726 AI Pipeline</b> button at the top builds and prioritises a sample pipeline for you.</p>`,
  deep:`<p><b>Where agents fit on a value stream.</b> Not everything should be an agent. The strongest candidates sit where there is high <em>wait</em> time, reasonably structured inputs, meaningful <em>volume</em>, and a mix of rules and language judgement \u2014 exactly the steps a VSM flags as queue-bound (triage, research, drafting, status updates, first-pass review). Map the current state first; the agent goes where the waiting and rework are, not where the work is most visible.</p>
  <p><b>Three orchestration patterns.</b> <em>Single agent</em> \u2014 one task, one model call with tools (e.g. a meeting-prep brief). <em>Multi-agent + orchestrator</em> \u2014 a coordinator decomposes the work and routes sub-tasks to specialist agents (triage \u2192 retrieval \u2192 draft), recombining the result; this is the pull/pacemaker analogue. <em>Human-in-the-loop</em> \u2014 the agent prepares, a human approves at a control gate; essential anywhere quality or compliance is non-negotiable (MLR, pharmacovigilance).</p>
  <p><b>Lean principles map straight onto good agentic systems.</b> <em>Jidoka</em> (build quality in, stop on abnormality) becomes guardrails plus a confidence threshold that halts and escalates to a human \u2014 the AI andon cord. <em>Poka-yoke</em> becomes input/output validation that blocks bad data. <em>Standardised work</em> becomes prompts, tools and policies under version control. <em>Control</em> becomes SPC on both business KPIs and model metrics (drift, latency, accuracy), with a named owner and a kaizen loop. And <em>respect for people</em> stays central: agents should augment and free capacity, not be sold as headcount cuts \u2014 which is also what keeps the improvement engine (your people) intact.</p>
  <p><b>How transformation pipelines fail.</b> The big one is <em>paving the cow path</em> \u2014 automating a wasteful process instead of removing the waste first; you just make waste faster and lock it in. Others: PoC purgatory (pilots that never scale because there was no control/operating model); ignoring data readiness and feasibility in discovery; no prioritisation, so teams chase shiny "big bets" over quick wins; and no Control phase, so accuracy quietly drifts. The discipline is Lean's: fix flow, prove value on one stream, then scale with guardrails and an owner.</p>`,
  exercises:[
    { type:'classify',
      prompt:'Match each AI agent capability to the Lean waste it best attacks.',
      categories:['Defects','Waiting','Overprocessing','Non-utilised talent','Inventory'],
      items:[
        { text:'Validation / poka-yoke agent checks references & claims before MLR', answer:0 },
        { text:'Orchestrator routes tasks and removes approval-queue handoffs', answer:1 },
        { text:'Drafting agent generates answers from a pre-approved library', answer:2 },
        { text:'Self-serve analytics copilot frees experts from pulling reports', answer:3 },
        { text:'Demand-sensing agent triggers just-in-time replenishment', answer:4 },
      ],
      solution:`<p>Validation \u2192 Defects; orchestration/routing \u2192 Waiting; generate-from-library \u2192 Overprocessing; copilot \u2192 Non-utilised talent; demand-sensing replenishment \u2192 Inventory. Each agent is a countermeasure aimed at a specific waste \u2014 which is how you justify it.</p>` },
    { type:'mcq', prompt:'Lean \u00D7 AI judgement.',
      questions:[
        { text:'In an agentic value stream, "orchestration" is most analogous to which Lean concept?', options:['A single operator','The pacemaker / pull system coordinating flow','A defect','Takt time only'], correct:1 },
        { text:'Before automating a process with AI you should first\u2026', options:['Automate it exactly as-is for speed','Remove the waste / fix flow, then apply AI','Buy the largest model','Skip the VSM'], correct:1 },
        { text:'On a value-vs-effort matrix, "quick wins" are\u2026', options:['High effort, low value','High value, low effort','Low value, low effort','High effort, high value'], correct:1 },
        { text:'The AI equivalent of Jidoka (build quality in / stop on abnormality) is\u2026', options:['A bigger training set','Human-in-the-loop review + guardrails that halt on low confidence','Faster GPUs','Removing all humans'], correct:1 },
      ],
      solution:`<p>Orchestration is the pacemaker/pull layer; remove waste before automating (don\u2019t pave the cow path); quick wins are high-value/low-effort; and Jidoka maps to guardrails plus human-in-the-loop that stop on low confidence.</p>` },
    { type:'worksheet', prompt:'Template \u2014 scope your own AI use case (saved on this device).',
      template:{ kind:'aicanvas' } },
  ]
},
];
