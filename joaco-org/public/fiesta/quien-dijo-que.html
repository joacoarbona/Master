<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quién dijo qué? · Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff5fa2;--grape:#7b3ff2;--sun:#ffd23f;--mint:#26d7ae;--sky:#3fbdf2;--orange:#ff8c42;--ink:#2a1a4a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Fredoka',sans-serif;color:#fff6fb;min-height:100%;overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 12%, rgba(255,210,63,.3), transparent 42%),
      radial-gradient(circle at 85% 16%, rgba(255,95,162,.4), transparent 42%),
      radial-gradient(circle at 82% 92%, rgba(38,215,174,.35), transparent 46%),
      linear-gradient(135deg,#7b3ff2,#9d4edd 55%,#3fbdf2);}
  .wrap{max-width:1080px;margin:0 auto;padding:14px clamp(12px,3vw,28px) 34px;}
  header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
  header h1{font-family:'Baloo 2';font-weight:800;font-size:clamp(20px,4vw,42px);color:#fff;
    text-shadow:0 4px 0 rgba(123,63,242,.5),0 8px 22px rgba(0,0,0,.35);text-align:center;}
  button{font-family:'Fredoka';cursor:pointer;border:none;border-radius:14px;font-weight:600;transition:transform .08s,filter .15s;}
  button:active{transform:translateY(2px);}
  .btn{font-size:clamp(13px,1.9vw,17px);padding:10px 16px;color:#fff;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.32);}

  .scene{margin:14px auto;max-width:880px;background:#fff;color:var(--ink);border-radius:24px;
    padding:clamp(18px,3.5vw,32px);box-shadow:0 16px 44px rgba(0,0,0,.4);
    display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .tag{font-weight:700;letter-spacing:1.2px;font-size:clamp(12px,2vw,16px);text-transform:uppercase;padding:6px 16px;border-radius:999px;}
  .tag.a{background:#fff0f6;color:var(--pink);} .tag.b{background:#eef9ff;color:var(--sky);}
  .qbig{font-family:'Baloo 2';font-weight:800;font-size:clamp(21px,3.8vw,34px);line-height:1.12;}
  .qsmall{font-size:clamp(15px,2.4vw,20px);color:#6a5a8a;font-weight:600;}
  .bubble{font-family:'Baloo 2';font-weight:800;font-size:clamp(24px,4.4vw,40px);color:var(--grape);
    background:#f3edff;border:3px dashed #c9b6f2;border-radius:16px;padding:12px 26px;}
  .banner{font-weight:700;color:var(--orange);font-size:clamp(14px,2.2vw,19px);}

  .avatar{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;color:#fff;background:#bbb;flex:none;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .who{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .who .avatar{width:clamp(84px,15vw,124px);height:clamp(84px,15vw,124px);font-size:clamp(30px,6vw,46px);box-shadow:0 8px 20px rgba(0,0,0,.22);}
  .who .nm{font-family:'Baloo 2';font-weight:800;font-size:clamp(18px,3.2vw,26px);color:var(--ink);}

  /* opciones de respuesta (tipo A) */
  .answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%;}
  .aopt{padding:12px 10px;border-radius:14px;background:#faf7ff;border:2px solid #e7d9ff;font-weight:600;
    font-size:clamp(15px,2.4vw,20px);color:var(--ink);cursor:pointer;transition:.18s;}
  .aopt.sel{border-color:var(--sky);background:#eaf6ff;}
  .aopt.correct{background:#e6fff5;border-color:var(--mint);color:#0a8f6f;font-weight:700;transform:scale(1.03);}
  .aopt.wrong{background:#fff0f3;border-color:#ff7a98;color:#c43d78;text-decoration:line-through;}

  /* rejilla de 12 niñas (tipo B) */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:clamp(8px,1.3vw,12px);width:100%;max-width:780px;}
  .opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px;border-radius:14px;background:#faf7ff;border:2px solid #eadcff;transition:.22s;cursor:pointer;}
  .opt .avatar{width:clamp(54px,8.5vw,76px);height:clamp(54px,8.5vw,76px);font-size:clamp(19px,3.6vw,28px);}
  .opt .lbl{font-size:clamp(11px,1.8vw,14px);font-weight:600;color:#52427a;}
  .opt.sel{border-color:var(--sky);background:#eaf6ff;}
  .opt.correct{background:#e6fff5;border-color:var(--mint);transform:scale(1.06);box-shadow:0 6px 16px rgba(38,215,174,.4);}
  .opt.dim{opacity:.3;filter:grayscale(.6);}

  /* panel de marcar aciertos */
  .markpanel{width:100%;border-top:2px dashed #e2d4ff;padding-top:14px;margin-top:4px;}
  .markpanel h3{font-family:'Baloo 2';color:var(--grape);font-size:clamp(16px,2.8vw,22px);margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:999px;background:#f3eeff;border:2px solid #ddccff;
    font-weight:600;font-size:clamp(13px,2vw,17px);color:var(--ink);cursor:pointer;transition:.15s;}
  .chip .avatar{width:30px;height:30px;font-size:13px;}
  .chip.hit{background:#d6fff0;border-color:var(--mint);color:#08715a;box-shadow:0 3px 0 #109b78;}
  .chip.hit::after{content:" ✔";font-weight:800;}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .big{font-family:'Baloo 2';font-weight:800;font-size:clamp(17px,3vw,26px);padding:13px 28px;color:#fff;border-radius:18px;}
  .reveal{background:linear-gradient(180deg,#ffe17a,var(--sun));box-shadow:0 5px 0 #c79a14;color:#5b3d00;}
  .nav{background:linear-gradient(180deg,#ff7eb6,var(--pink));box-shadow:0 5px 0 #c43d78;}
  .big:active{transform:translateY(4px);} .big:disabled{filter:grayscale(.5) brightness(.85);cursor:default;}

  .controls2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .controls2 label{font-weight:600;font-size:14px;}
  select{font-family:'Fredoka';font-size:14px;padding:7px 11px;border-radius:11px;border:none;font-weight:600;color:var(--ink);}
  .progress{font-weight:700;font-size:clamp(13px,2vw,17px);opacity:.95;}

  /* ranking overlay */
  .overlay{position:fixed;inset:0;background:rgba(20,8,40,.82);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;}
  .overlay.show{display:flex;}
  .board{background:#fff;color:var(--ink);border-radius:24px;padding:24px;max-width:460px;width:100%;max-height:88vh;overflow:auto;}
  .board h2{font-family:'Baloo 2';color:var(--grape);text-align:center;font-size:clamp(24px,5vw,34px);margin-bottom:14px;}
  .rank{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;margin-bottom:7px;background:#f6f1ff;font-weight:600;font-size:clamp(15px,2.6vw,20px);}
  .rank .pos{font-family:'Baloo 2';font-size:1.3em;width:34px;text-align:center;}
  .rank .avatar{width:40px;height:40px;font-size:15px;}
  .rank .nm{flex:1;text-align:left;}
  .rank .sc{font-family:'Baloo 2';color:var(--pink);font-size:1.3em;}
  .rank.top1{background:linear-gradient(90deg,#fff5cc,#ffe699);}
  .board .cls{margin-top:14px;width:100%;}

  .hint-bar{text-align:center;margin-top:14px;font-size:13px;opacity:.85;}
  kbd{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:1px 8px;font-family:inherit;}
  .demo-tag{position:fixed;top:8px;right:8px;background:#ffd23f;color:#5b3d00;font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px;z-index:9;}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:55;}

.btn.on{background:var(--mint);border-color:var(--mint);color:#053b30;}
.chip.t0{background:#ffe3ef;border-color:#ff9bc3;color:#7a2247;}
.chip.t0.hit{background:#ffc2db;border-color:var(--pink);box-shadow:0 3px 0 #c43d78;}
.chip.t1{background:#e3f3ff;border-color:#9bd0ff;color:#0b4a6b;}
.chip.t1.hit{background:#bfe4ff;border-color:var(--sky);box-shadow:0 3px 0 #1f7fb0;}
.teamtot{display:flex;gap:10px;margin-bottom:14px;}
.teamtot .tt{flex:1;border-radius:16px;padding:12px;text-align:center;font-weight:700;font-size:1.05em;}
.teamtot .tt .n{font-family:'Baloo 2';font-size:1.7em;display:block;}
.teamtot .tt.win{box-shadow:0 0 0 3px #ffd23f;}
.teamtot .tt0{background:#ffe3ef;color:#7a2247;}
.teamtot .tt1{background:#e3f3ff;color:#0b4a6b;}
.winmsg{text-align:center;font-family:'Baloo 2';font-size:1.3em;color:#7b3ff2;margin-bottom:12px;}
.assign-tip{text-align:center;font-size:14px;color:#6a5a8a;margin-bottom:10px;}
.assign-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;}
.assign-chip{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;border:2px solid #ccc;font-family:'Fredoka';font-weight:600;font-size:15px;cursor:pointer;color:#2a1a4a;}
.assign-chip .avatar{width:30px;height:30px;font-size:13px;}
.assign-chip.t0{background:#ffe3ef;border-color:#ff9bc3;}
.assign-chip.t1{background:#e3f3ff;border-color:#9bd0ff;}

/* ===== Ajuste para pantalla de TV (sin scroll) ===== */
html,body{height:100%;}
body{overflow:hidden;}
.wrap{height:100vh;display:flex;flex-direction:column;padding:8px clamp(10px,2vw,22px) 8px;max-width:1120px;}
header{margin:0 0 4px;}
header h1{font-size:clamp(18px,3.2vh,32px);}
header span{font-size:clamp(18px,3.2vh,32px)!important;}
.scene{flex:1;min-height:0;overflow:auto;margin:6px auto;padding:clamp(10px,1.8vh,20px);gap:clamp(6px,1.2vh,12px);min-height:0;}
.tag{font-size:clamp(11px,1.7vh,15px);padding:4px 14px;}
.qbig{font-size:clamp(17px,2.9vh,30px);}
.qsmall{font-size:clamp(13px,2vh,18px);}
.who{gap:3px;}
.who .avatar{width:clamp(56px,10vh,96px);height:clamp(56px,10vh,96px);font-size:clamp(22px,4.4vh,38px);}
.who .nm{font-size:clamp(15px,2.4vh,24px);}
.answers{gap:6px;}
.aopt{padding:7px 8px;font-size:clamp(12px,1.9vh,18px);}
.bubble{font-size:clamp(18px,3vh,34px);padding:7px 18px;}
.grid{gap:7px;max-width:720px;}
.opt{padding:5px;}
.opt .avatar{width:clamp(42px,6.6vh,64px);height:clamp(42px,6.6vh,64px);font-size:clamp(16px,3vh,24px);}
.opt .lbl{font-size:clamp(10px,1.5vh,14px);}
.markpanel{padding-top:7px;margin-top:0;}
.markpanel h3{font-size:clamp(12px,1.9vh,17px);margin-bottom:5px;}
.chips{gap:6px;}
.chip{padding:4px 9px 4px 4px;font-size:clamp(11px,1.7vh,15px);}
.chip .avatar{width:24px;height:24px;font-size:11px;}
.actions{margin-top:2px;gap:10px;}
.big{font-size:clamp(14px,2.3vh,22px);padding:9px 22px;}
.controls2{margin-top:6px;gap:7px;}
.controls2 label,.btn,select{font-size:clamp(11px,1.7vh,16px)!important;}
.hint-bar{margin-top:4px;font-size:clamp(10px,1.5vh,13px);}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="demo-tag" id="demoTag">DATOS DE EJEMPLO</div>
<div class="wrap">
  <header><span style="font-size:clamp(20px,4vw,36px)">🕵️</span><h1 id="title">¿Quién dijo qué?</h1><span style="font-size:clamp(20px,4vw,36px)">🎂</span></header>

  <div class="scene" id="scene">
    <div class="qbig">Pulsa <b>¡EMPEZAR!</b> para jugar 🎉</div>
  </div>

  <div class="actions">
    <button class="big reveal" id="revealBtn" disabled>💡 Mostrar respuesta</button>
    <button class="big nav" id="nextBtn">▶ ¡EMPEZAR!</button>
  </div>

  <div class="controls2">
    <span class="progress" id="progress"></span>
    <button class="btn" id="boardBtn">📊 Ranking</button>
    <label><input type="checkbox" id="typeA" checked> 🗣️ Respuesta</label>
    <label><input type="checkbox" id="typeB" checked> 🕵️ Quién lo dijo</label>
    <select id="rounds"><option value="12">12 rondas</option><option value="18" selected>18 rondas</option><option value="24">24 rondas</option><option value="999">Todas</option></select>
    <button class="btn" id="teamsBtn">👥 2 equipos</button>
    <button class="btn" id="assignBtn" style="display:none">🎨 Asignar</button>
  </div>

  <div class="hint-bar">Mando/teclado: <kbd>Espacio</kbd> mostrar · <kbd>→</kbd> siguiente. Para marcar quién acertó, toca los nombres (mejor casteando desde móvil/portátil).</div>
</div>

<div class="overlay" id="overlay"><div class="board" id="board"></div></div>

var IS_DEMO = false; /*DEMO_FLAG*/

const PALETTE=['#ff5fa2','#7b3ff2','#26d7ae','#3fbdf2','#ff8c42','#9d4edd','#ef476f','#06d6a0','#f4a261','#118ab2','#e76f9e','#5e60ce'];
function colorFor(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return PALETTE[Math.abs(h)%PALETTE.length];}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function avatarHTML(g,cls){
  const inner=g.photo?'<img src="'+g.photo+'" alt="">':initials(g.name);
  const bg=g.photo?'':'background:'+colorFor(g.name)+';';
  return '<div class="avatar '+(cls||'')+'" style="'+bg+'">'+inner+'</div>';
}
function norm(s){return (s||'').trim().toLowerCase();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniqByNorm(arr){const seen={},out=[];arr.forEach(x=>{const k=norm(x);if(x&&!seen[k]){seen[k]=1;out.push(x);}});return out;}

let G=[], Q=[], rounds=[], cur=-1, stage='idle', scores=[];
let teamsMode=false, teamOf=[];
const scene=document.getElementById('scene');
const revealBtn=document.getElementById('revealBtn');
const nextBtn=document.getElementById('nextBtn');

function answerOptions(gi,qi){
  const correct=G[gi].answers[qi];
  const others=G.map((g,i)=>i!==gi?g.answers[qi]:null).filter(Boolean);
  const decoys=(Q[qi].decoys||[]);
  let pool=uniqByNorm(shuffle([...others,...decoys])).filter(a=>norm(a)!==norm(correct));
  let opts=uniqByNorm([correct,...pool]).slice(0,12);
  return shuffle(opts);
}
function buildRounds(){
  const useA=document.getElementById('typeA').checked;
  const useB=document.getElementById('typeB').checked;
  const limit=+document.getElementById('rounds').value;
  let A=[],B=[];
  if(useA) G.forEach((g,gi)=>Q.forEach((q,qi)=>{ if(norm(g.answers[qi])) A.push({type:'A',gi,qi}); }));
  if(useB) Q.forEach((q,qi)=>{
    const map={};
    G.forEach((g,gi)=>{const a=norm(g.answers[qi]); if(!a)return;(map[a]=map[a]||{text:g.answers[qi],girls:[]}).girls.push(gi);});
    Object.values(map).forEach(e=>{ if(e.girls.length<=3) B.push({type:'B',qi,answer:e.text,correct:e.girls}); });
  });
  shuffle(A);shuffle(B);
  rounds=[];let ia=0,ib=0;
  while(ia<A.length||ib<B.length){ if(ib<B.length)rounds.push(B[ib++]); if(ia<A.length)rounds.push(A[ia++]); }
  if(limit<999) rounds=rounds.slice(0,limit);
  cur=-1;
}

function renderRound(){
  stage='guess'; revealBtn.disabled=false;
  const r=rounds[cur];
  if(r.type==='A'){
    const g=G[r.gi];
    r._opts=answerOptions(r.gi,r.qi);
    scene.innerHTML=
      '<div class="tag a">🗣️ Adivina la respuesta</div>'+
      '<div class="who">'+avatarHTML(g)+'<div class="nm">'+g.name+'</div></div>'+
      '<div class="qbig">¿Cuál es '+Q[r.qi].text+'?</div>'+
      '<div class="answers" id="answers">'+r._opts.map((a,i)=>'<div class="aopt" data-i="'+i+'">'+a+'</div>').join('')+'</div>';
    scene.querySelectorAll('.aopt').forEach(o=>o.addEventListener('click',()=>{
      if(stage!=='guess')return; scene.querySelectorAll('.aopt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel');
    }));
  } else {
    scene.innerHTML=
      '<div class="tag b">🕵️ ¿Quién lo dijo?</div>'+
      '<div class="qsmall">Sobre '+Q[r.qi].text+'… alguien dijo:</div>'+
      '<div class="bubble">'+r.answer+'</div>'+
      '<div class="grid" id="grid">'+G.map((g,gi)=>'<div class="opt" data-gi="'+gi+'">'+avatarHTML(g)+'<div class="lbl">'+g.name+'</div></div>').join('')+'</div>';
    scene.querySelectorAll('#grid .opt').forEach(o=>o.addEventListener('click',()=>{
      if(stage!=='guess')return; scene.querySelectorAll('#grid .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel');
    }));
  }
  updateProgress();
}

function reveal(){
  if(cur<0||stage!=='guess')return; stage='reveal'; revealBtn.disabled=true;
  const r=rounds[cur];
  if(r.type==='A'){
    const correct=G[r.gi].answers[r.qi];
    scene.querySelectorAll('.aopt').forEach(o=>{
      const txt=r._opts[+o.dataset.i];
      if(norm(txt)===norm(correct)) o.classList.add('correct');
      else if(o.classList.contains('sel')) o.classList.add('wrong');
    });
  } else {
    const set=new Set(r.correct);
    scene.querySelectorAll('#grid .opt').forEach(o=>{ const gi=+o.dataset.gi; if(set.has(gi))o.classList.add('correct'); else o.classList.add('dim'); });
    if(r.correct.length>1){
      const b=document.createElement('div'); b.className='banner';
      b.textContent='✋ '+r.correct.length+' niñas dijeron lo mismo';
      scene.insertBefore(b, scene.querySelector('.grid'));
    }
    celebrate();
  }
  // panel de marcar aciertos (las dos rondas)
  const mp=document.createElement('div'); mp.className='markpanel';
  mp.innerHTML='<h3>✅ ¿Quién acertó? (toca los nombres — pueden ser varias)</h3>'+
    '<div class="chips">'+G.map((g,gi)=>'<button class="chip '+(teamsMode?('t'+teamOf[gi]):'')+'" data-gi="'+gi+'">'+avatarHTML(g)+g.name+'</button>').join('')+'</div>';
  scene.appendChild(mp);
  mp.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    const gi=+c.dataset.gi;
    if(c.classList.toggle('hit')) scores[gi]++; else scores[gi]=Math.max(0,scores[gi]-1);
  }));
}

function next(){
  if(cur===-1){ G=GAME_DATA.girls; Q=GAME_DATA.questions; scores=G.map(()=>0); if(teamOf.length!==G.length) teamOf=G.map((g,i)=>i%2); buildRounds(); cur=0; nextBtn.textContent='➡️ Siguiente'; renderRound(); return; }
  cur++;
  if(cur>=rounds.length){ finish(); return; }
  renderRound();
}
function finish(){
  stage='end'; revealBtn.disabled=true; nextBtn.textContent='🔄 Otra vez'; cur=-1;
  document.getElementById('progress').textContent='';
  showBoard(true);
}
function updateProgress(){ document.getElementById('progress').textContent='Ronda '+(cur+1)+' / '+rounds.length; }

function showBoard(isFinal){
  let html='<h2>'+(isFinal?'🏆 ¡Resultado final!':'📊 Ranking')+'</h2>';
  if(teamsMode){
    let t0=0,t1=0; scores.forEach((s,i)=>{ if(teamOf[i]===0) t0+=s; else t1+=s; });
    html+='<div class="teamtot">'+
      '<div class="tt tt0'+(t0>t1?' win':'')+'">🌸 Rosa<span class="n">'+t0+'</span></div>'+
      '<div class="tt tt1'+(t1>t0?' win':'')+'">💙 Azul<span class="n">'+t1+'</span></div></div>';
    if(isFinal){ const msg=t0===t1?'🤝 ¡Empate!':(t0>t1?'🌸 ¡Gana el equipo Rosa!':'💙 ¡Gana el equipo Azul!');
      html+='<p class="winmsg">'+msg+'</p>'; }
  }
  const order=G.map((g,i)=>({g,s:scores[i],t:teamOf[i]})).sort((a,b)=>b.s-a.s);
  const medals=['🥇','🥈','🥉'];
  order.forEach((o,i)=>{
    const pos = i<3?medals[i]:(i+1)+'.';
    const dot = teamsMode?('<span style="width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;background:'+(o.t===0?'#ff5fa2':'#3fbdf2')+'"></span>'):'';
    html+='<div class="rank '+(i===0&&o.s>0?'top1':'')+'"><span class="pos">'+pos+'</span>'+avatarHTML(o.g)+'<span class="nm">'+dot+o.g.name+'</span><span class="sc">'+o.s+'</span></div>';
  });
  html+='<button class="big nav cls" id="closeBoard">Cerrar</button>';
  document.getElementById('board').innerHTML=html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('closeBoard').addEventListener('click',()=>document.getElementById('overlay').classList.remove('show'));
  if(isFinal) celebrate();
}

revealBtn.addEventListener('click',reveal);
nextBtn.addEventListener('click',next);
document.getElementById('boardBtn').addEventListener('click',()=>{ if(!scores.length)scores=GAME_DATA.girls.map(()=>0); if(!G.length)G=GAME_DATA.girls; showBoard(false); });
document.getElementById('teamsBtn').addEventListener('click',e=>{ teamsMode=!teamsMode; e.target.classList.toggle('on',teamsMode); e.target.textContent=teamsMode?'👥 Equipos: ON':'👥 2 equipos'; document.getElementById('assignBtn').style.display=teamsMode?'':'none'; });
document.getElementById('assignBtn').addEventListener('click',renderAssign);
function renderAssign(){
  if(!G.length){G=GAME_DATA.girls;Q=GAME_DATA.questions;}
  if(teamOf.length!==G.length) teamOf=G.map((g,i)=>i%2);
  let html='<h2>👥 Equipos</h2><p class="assign-tip">Toca cada niña para cambiarla de equipo (🌸 Rosa / 💙 Azul)</p>';
  html+='<div class="assign-grid">'+G.map((g,gi)=>'<button class="assign-chip t'+teamOf[gi]+'" data-gi="'+gi+'">'+avatarHTML(g)+'<span>'+g.name+'</span></button>').join('')+'</div>';
  html+='<button class="big nav cls" id="closeBoard">Listo</button>';
  const board=document.getElementById('board'); board.innerHTML=html;
  document.getElementById('overlay').classList.add('show');
  board.querySelectorAll('.assign-chip').forEach(c=>c.addEventListener('click',()=>{ const gi=+c.dataset.gi; teamOf[gi]=1-teamOf[gi]; c.classList.toggle('t0'); c.classList.toggle('t1'); }));
  document.getElementById('closeBoard').addEventListener('click',()=>document.getElementById('overlay').classList.remove('show'));
}
['typeA','typeB','rounds'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{
  cur=-1; stage='idle'; nextBtn.textContent='▶ ¡EMPEZAR!'; revealBtn.disabled=true;
  scene.innerHTML='<div class="qbig">Pulsa <b>¡EMPEZAR!</b> para jugar 🎉</div>'; document.getElementById('progress').textContent='';
}));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();reveal();}
  else if(e.key==='ArrowRight'){e.preventDefault();next();}
  else if(e.code==='Enter'){e.preventDefault();next();}
});

const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
function rsz(){cv.width=innerWidth;cv.height=innerHeight;}rsz();addEventListener('resize',rsz);
let parts=[],cf=false;
function celebrate(){const c=['#ff5fa2','#ffd23f','#26d7ae','#3fbdf2','#9d4edd','#fff'];
  for(let i=0;i<150;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,c:c[i%c.length],r:Math.random()*6.28,vr:(Math.random()-.5)*.3});
  if(!cf)loop();}
function loop(){cf=true;cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30);
  if(parts.length)requestAnimationFrame(loop);else{cf=false;cx.clearRect(0,0,cv.width,cv.height);}}

G=GAME_DATA.girls; Q=GAME_DATA.questions; scores=G.map(()=>0); teamOf=G.map((g,i)=>i%2);
document.getElementById('title').textContent='¿Quién dijo qué? · '+GAME_DATA.birthday;
document.getElementById('demoTag').style.display=IS_DEMO?'block':'none';
</script>
</body>
