<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 Princesas · originales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff5fa2;--grape:#7b3ff2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Fredoka',sans-serif;color:#fff;min-height:100vh;padding:22px 16px 44px;
    background:linear-gradient(135deg,#7b3ff2,#9d4edd 55%,#ff5fa2);}
  header{text-align:center;margin-bottom:18px;}
  h1{font-family:'Baloo 2';font-weight:800;font-size:clamp(24px,5vw,42px);text-shadow:0 4px 0 rgba(123,63,242,.5),0 8px 22px rgba(0,0,0,.3);}
  .sub{opacity:.92;margin-top:6px;font-size:15px;}
  .bar{display:flex;justify-content:center;gap:12px;margin:14px 0 22px;flex-wrap:wrap;}
  button{font-family:'Fredoka';cursor:pointer;border:none;border-radius:14px;font-weight:700;transition:transform .08s;}
  button:active{transform:translateY(2px);}
  .all{font-size:18px;padding:13px 26px;color:#5b3d00;background:linear-gradient(180deg,#ffe17a,#ffd23f);box-shadow:0 5px 0 #c79a14;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;max-width:1100px;margin:0 auto;}
  .card{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:20px;padding:12px;text-align:center;}
  .card svg{width:100%;height:auto;display:block;border-radius:14px;}
  .card .dl{margin-top:10px;font-size:14px;padding:9px 14px;color:#fff;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);width:100%;}
  .num{font-weight:700;font-size:13px;opacity:.85;margin-top:6px;}
</style>
</head>
<body>
<header>
  <h1>👑 12 Princesas originales</h1>
  <div class="sub">Dibujos propios (sin derechos de autor) — listos para usar en los juegos</div>
</header>
<div class="bar"><button class="all" id="allBtn">⬇️ Descargar todas (PNG)</button></div>
<div class="grid" id="grid"></div>

<script>
const SETS=[
  {skin:'#ffe0bd',hair:'#6b4226',style:'long',dress:'#ff5fa2',gem:'#ff3b6b',bg:'#ffe3f1'},
  {skin:'#f1c27d',hair:'#1c1c1c',style:'bun',dress:'#7b3ff2',gem:'#26d7ae',bg:'#e9e0ff'},
  {skin:'#e0ac69',hair:'#3b2417',style:'braids',dress:'#3fbdf2',gem:'#ffd23f',bg:'#dff3ff'},
  {skin:'#c68642',hair:'#241308',style:'curls',dress:'#26d7ae',gem:'#ff8c42',bg:'#d7fff3'},
  {skin:'#ffdab9',hair:'#d6a25b',style:'ponytail',dress:'#ff8c42',gem:'#7b3ff2',bg:'#ffe9d6'},
  {skin:'#f1c27d',hair:'#a8423b',style:'long',dress:'#9d4edd',gem:'#ffd23f',bg:'#f1e2ff'},
  {skin:'#8d5524',hair:'#1c1c1c',style:'bun',dress:'#ef476f',gem:'#ffffff',bg:'#ffe0e8'},
  {skin:'#ffe0bd',hair:'#e7c27d',style:'braids',dress:'#06d6a0',gem:'#ff5fa2',bg:'#d8fff0'},
  {skin:'#e0ac69',hair:'#7a4a93',style:'curls',dress:'#ffd23f',gem:'#ef476f',bg:'#fff6cc'},
  {skin:'#f1c27d',hair:'#6b4226',style:'ponytail',dress:'#118ab2',gem:'#ffd23f',bg:'#d6f0fb'},
  {skin:'#c68642',hair:'#d6a25b',style:'long',dress:'#ff5fa2',gem:'#3fbdf2',bg:'#ffe3f1'},
  {skin:'#ffdab9',hair:'#3b2417',style:'bun',dress:'#5e60ce',gem:'#ffd23f',bg:'#e3e4ff'}
];

function darken(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*(1-f));g=Math.round(g*(1-f));b=Math.round(b*(1-f));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

function backHair(s){
  const h=s.hair;
  if(s.style==='ponytail') return '<ellipse cx="150" cy="120" rx="16" ry="38" fill="'+h+'"/>';
  if(s.style==='bun') return '<circle cx="100" cy="40" r="17" fill="'+h+'"/>';
  // long / braids / curls: melena trasera
  return '<path d="M48,96 Q40,160 62,188 L88,188 Q70,150 72,110 Z" fill="'+h+'"/>'+
         '<path d="M152,96 Q160,160 138,188 L112,188 Q130,150 128,110 Z" fill="'+h+'"/>';
}
function frontHair(s){
  const h=s.hair, hd=darken(h,.18);
  let extra='';
  if(s.style==='braids'){
    extra='<path d="M60,118 Q52,150 60,184 L74,184 Q68,150 72,122 Z" fill="'+h+'"/>'+
          '<path d="M140,118 Q148,150 140,184 L126,184 Q132,150 128,122 Z" fill="'+h+'"/>'+
          '<circle cx="67" cy="150" r="6" fill="'+hd+'"/><circle cx="133" cy="150" r="6" fill="'+hd+'"/>'+
          '<circle cx="67" cy="170" r="5" fill="'+hd+'"/><circle cx="133" cy="170" r="5" fill="'+hd+'"/>';
  }
  if(s.style==='curls'){
    extra='<g fill="'+h+'"><circle cx="56" cy="150" r="13"/><circle cx="66" cy="172" r="11"/>'+
          '<circle cx="144" cy="150" r="13"/><circle cx="134" cy="172" r="11"/></g>';
  }
  if(s.style==='ponytail'){
    extra='<path d="M138,86 Q150,92 150,104" stroke="'+hd+'" stroke-width="4" fill="none"/>';
  }
  // flequillo
  const fringe='<path d="M56,88 C56,58 144,58 144,88 C138,74 120,70 100,70 C80,70 60,74 56,88 Z" fill="'+h+'"/>'+
    '<path d="M56,88 C60,74 78,70 96,71" stroke="'+hd+'" stroke-width="2.5" fill="none" opacity=".5"/>';
  return extra+fringe;
}
function crown(s){
  const g='#ffd23f', gd='#e0a200';
  return '<path d="M66,60 L74,42 L86,56 L100,36 L114,56 L126,42 L134,60 Z" fill="'+g+'" stroke="'+gd+'" stroke-width="2" stroke-linejoin="round"/>'+
    '<rect x="66" y="58" width="68" height="8" rx="3" fill="'+g+'" stroke="'+gd+'" stroke-width="2"/>'+
    '<circle cx="100" cy="46" r="5" fill="'+s.gem+'" stroke="'+gd+'" stroke-width="1.5"/>'+
    '<circle cx="74" cy="56" r="3" fill="'+s.gem+'"/><circle cx="126" cy="56" r="3" fill="'+s.gem+'"/>';
}
function princessSVG(s){
  const cheek='#ff9bb3';
  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath></defs>'+
    '<circle cx="100" cy="100" r="96" fill="'+s.bg+'"/>'+
    '<g clip-path="url(#c)">'+
      // vestido
      '<path d="M40,200 Q42,150 72,140 L128,140 Q158,150 160,200 Z" fill="'+s.dress+'"/>'+
      '<path d="M84,138 Q100,150 116,138 L116,150 Q100,160 84,150 Z" fill="'+darken(s.dress,.12)+'"/>'+
      // pelo trasero
      backHair(s)+
      // cuello
      '<rect x="90" y="120" width="20" height="26" rx="9" fill="'+s.skin+'"/>'+
      // orejas
      '<circle cx="58" cy="102" r="9" fill="'+s.skin+'"/><circle cx="142" cy="102" r="9" fill="'+s.skin+'"/>'+
      '<circle cx="58" cy="110" r="3" fill="'+s.gem+'"/><circle cx="142" cy="110" r="3" fill="'+s.gem+'"/>'+
      // cara
      '<circle cx="100" cy="100" r="46" fill="'+s.skin+'"/>'+
      // pelo delantero
      frontHair(s)+
      // mejillas
      '<ellipse cx="74" cy="116" rx="8" ry="5" fill="'+cheek+'" opacity=".55"/>'+
      '<ellipse cx="126" cy="116" rx="8" ry="5" fill="'+cheek+'" opacity=".55"/>'+
      // cejas
      '<path d="M78,90 Q86,85 94,89" stroke="'+darken(s.hair,.1)+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
      '<path d="M106,89 Q114,85 122,90" stroke="'+darken(s.hair,.1)+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
      // ojos
      '<ellipse cx="85" cy="102" rx="6.5" ry="8.5" fill="#3a2b3f"/>'+
      '<ellipse cx="115" cy="102" rx="6.5" ry="8.5" fill="#3a2b3f"/>'+
      '<circle cx="87" cy="99" r="2.2" fill="#fff"/><circle cx="117" cy="99" r="2.2" fill="#fff"/>'+
      // pestañas
      '<path d="M78,98 l-5,-3 M92,98 l5,-3" stroke="#3a2b3f" stroke-width="2" stroke-linecap="round"/>'+
      '<path d="M108,98 l-5,-3 M122,98 l5,-3" stroke="#3a2b3f" stroke-width="2" stroke-linecap="round"/>'+
      // nariz + sonrisa
      '<path d="M98,112 Q100,115 102,112" stroke="'+darken(s.skin,.2)+'" stroke-width="2" fill="none" stroke-linecap="round"/>'+
      '<path d="M88,122 Q100,134 112,122" stroke="#c0506a" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      // corona
      crown(s)+
    '</g>'+
    '<circle cx="100" cy="100" r="94" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/>'+
  '</svg>';
}

const grid=document.getElementById('grid');
SETS.forEach((s,i)=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=princessSVG(s)+'<div class="num">Princesa '+(i+1)+'</div><button class="dl">⬇️ PNG</button>';
  card.querySelector('.dl').addEventListener('click',()=>download(card.querySelector('svg'),'princesa-'+(i+1)+'.png'));
  grid.appendChild(card);
});

function download(svgEl,filename){
  const xml=new XMLSerializer().serializeToString(svgEl);
  const blob=new Blob([xml],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=512; c.height=512;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,512,512);
    URL.revokeObjectURL(url);
    const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download=filename; a.click();
  };
  img.src=url;
}
document.getElementById('allBtn').addEventListener('click',()=>{
  const svgs=[...document.querySelectorAll('.card svg')];
  svgs.forEach((sv,i)=>setTimeout(()=>download(sv,'princesa-'+(i+1)+'.png'), i*350));
});
</script>
</body>
</html>
