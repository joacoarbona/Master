<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princesas Mágicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff5fa2;--grape:#7b3ff2;--sun:#ffd23f;--mint:#26d7ae;--sky:#3fbdf2;--ink:#2a1a4a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Fredoka',sans-serif;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column;
    padding:clamp(6px,1.4vh,16px) clamp(10px,2vw,26px);
    background:radial-gradient(circle at 12% 15%, rgba(255,210,63,.3), transparent 42%),
      radial-gradient(circle at 85% 16%, rgba(255,95,162,.4), transparent 42%),
      radial-gradient(circle at 82% 92%, rgba(38,215,174,.32), transparent 46%),
      linear-gradient(135deg,#7b3ff2,#9d4edd 55%,#3fbdf2);}
  header{text-align:center;flex:none;margin-bottom:4px;}
  h1{font-family:'Baloo 2';font-weight:800;font-size:clamp(20px,3.6vh,40px);line-height:1;text-shadow:0 4px 0 rgba(123,63,242,.5),0 8px 22px rgba(0,0,0,.35);}
  .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,14px);}
  .stage{position:relative;height:min(68vh,540px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#cfe8ff;box-shadow:0 16px 44px rgba(0,0,0,.45);}
  .stage svg.bg{position:absolute;inset:0;width:100%;height:100%;}
  .stage svg.fig{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);height:82%;width:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));}
  .caption{font-family:'Baloo 2';font-weight:700;font-size:clamp(16px,2.6vh,26px);text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.4);min-height:1.2em;}
  .controls{flex:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:4px;}
  button{font-family:'Fredoka';cursor:pointer;border:none;border-radius:16px;font-weight:700;transition:transform .08s;}
  button:active{transform:translateY(3px);}
  .big{font-family:'Baloo 2';font-weight:800;font-size:clamp(18px,3vh,28px);padding:clamp(10px,1.6vh,15px) clamp(26px,4vw,40px);color:#fff;
    background:linear-gradient(180deg,#ff7eb6,var(--pink));box-shadow:0 6px 0 #c43d78;border-radius:18px;}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 #c43d78;}
  .btn{font-size:clamp(13px,2vh,17px);padding:10px 16px;color:#fff;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.32);}
  .btn.on{background:var(--mint);border-color:var(--mint);color:#053b30;}
  .hint{flex:none;text-align:center;margin-top:4px;font-size:clamp(10px,1.5vh,13px);opacity:.85;}
  kbd{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:1px 7px;font-family:inherit;}
  canvas#sparkle{position:fixed;inset:0;pointer-events:none;z-index:55;}
  @media (max-width:760px){ body{height:auto;min-height:100vh;overflow:auto;} .stage{height:min(70vh,520px);} }
</style>
</head>
<body>
<canvas id="sparkle"></canvas>
<header><h1>👑✨ Princesas Mágicas</h1></header>

<div class="mid">
  <div class="stage" id="stage"></div>
  <div class="caption" id="caption"></div>
</div>

<div class="controls">
  <button class="big" id="nextBtn">🎲 ¡Otra combinación!</button>
  <button class="btn" id="autoBtn">▶ Automático</button>
  <button class="btn" id="saveBtn">📸 Guardar imagen</button>
</div>
<div class="hint">Mando/teclado: <kbd>Espacio</kbd> o <kbd>Enter</kbd> = nueva combinación · <kbd>A</kbd> = automático</div>

function darken(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r*(1-f));g=Math.round(g*(1-f));b=Math.round(b*(1-f));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function backHair(s){const h=s.hair;
  if(s.style==='ponytail')return '<ellipse cx="150" cy="120" rx="16" ry="38" fill="'+h+'"/>';
  if(s.style==='bun')return '<circle cx="100" cy="40" r="17" fill="'+h+'"/>';
  return '<path d="M48,96 Q40,160 62,188 L88,188 Q70,150 72,110 Z" fill="'+h+'"/><path d="M152,96 Q160,160 138,188 L112,188 Q130,150 128,110 Z" fill="'+h+'"/>';}
function frontHair(s){const h=s.hair,hd=darken(h,.18);let extra='';
  if(s.style==='braids'){extra='<path d="M60,118 Q52,150 60,184 L74,184 Q68,150 72,122 Z" fill="'+h+'"/><path d="M140,118 Q148,150 140,184 L126,184 Q132,150 128,122 Z" fill="'+h+'"/><circle cx="67" cy="150" r="6" fill="'+hd+'"/><circle cx="133" cy="150" r="6" fill="'+hd+'"/>';}
  if(s.style==='curls'){extra='<g fill="'+h+'"><circle cx="56" cy="150" r="13"/><circle cx="66" cy="172" r="11"/><circle cx="144" cy="150" r="13"/><circle cx="134" cy="172" r="11"/></g>';}
  const fringe='<path d="M56,86 C56,60 144,60 144,86 C138,74 120,70 100,70 C80,70 60,74 56,86 Z" fill="'+h+'"/>';
  return extra+fringe;}
function crown(s){const g='#ffd23f',gd='#e0a200';
  return '<path d="M66,58 L74,42 L86,56 L100,36 L114,56 L126,42 L134,58 Z" fill="'+g+'" stroke="'+gd+'" stroke-width="2" stroke-linejoin="round"/>'+

function figureSVG(si, face){

    '<path d="M40,200 Q42,150 72,140 L128,140 Q158,150 160,200 Z" fill="'+s.dress+'"/>'+

}

/* ---------- juego ---------- */
const stage=document.getElementById('stage');
const caption=document.getElementById('caption');
let bi=-1,pi=-1,gi=-1,auto=false,timer=null,curBg='',curFig='';
function rnd(n,not){let x;do{x=Math.floor(Math.random()*n);}while(n>1&&x===not);return x;}
function render(){
  bi=rnd(SCENES.length,bi); pi=rnd(SETS.length,pi); gi=rnd(FACES.length,gi);
  curBg=SCENES[bi].svg; curFig=figureSVG(pi,FACES[gi]);
  stage.innerHTML=curBg+curFig;
  caption.textContent='✨ '+NAMES[gi]+' princesa en '+SCENES[bi].name;
  sparkle();
}
function startAuto(){auto=true;document.getElementById('autoBtn').classList.add('on');document.getElementById('autoBtn').textContent='⏸ Pausar';render();timer=setInterval(render,2600);}
function stopAuto(){auto=false;clearInterval(timer);timer=null;const b=document.getElementById('autoBtn');b.classList.remove('on');b.textContent='▶ Automático';}
document.getElementById('nextBtn').addEventListener('click',()=>{ if(auto)stopAuto(); render(); });
document.getElementById('autoBtn').addEventListener('click',()=>auto?stopAuto():startAuto());
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(auto)stopAuto(); render();}
  else if(e.key.toLowerCase()==='a'){auto?stopAuto():startAuto();}
});

document.getElementById('saveBtn').addEventListener('click',()=>{
  const W=600,H=800,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const bgImg=new Image(),figImg=new Image();let done=0;
  function draw(){done++; if(done<2)return;
    try{ctx.drawImage(bgImg,0,0,W,H);}catch(e){}
    const fh=H*0.82,fw=fh,fx=(W-fw)/2,fy=H-fh-H*0.02;
    try{ctx.drawImage(figImg,fx,fy,fw,fh);}catch(e){}
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='princesa-magica.png';a.click();
  }
  bgImg.onload=draw;figImg.onload=draw;bgImg.onerror=draw;figImg.onerror=draw;
  bgImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(curBg);
  figImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(curFig);
});

/* destellos */
const cv=document.getElementById('sparkle'),cx=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);
let parts=[],cf=false;
function sparkle(){const c=['#ffd23f','#ff5fa2','#fff','#26d7ae','#9d4edd'];
  for(let i=0;i<50;i++)parts.push({x:Math.random()*cv.width,y:Math.random()*cv.height*0.6,vx:(Math.random()-.5)*2,vy:1+Math.random()*2,s:3+Math.random()*5,c:c[i%c.length],life:1});
  if(!cf)loop();}
function loop(){cf=true;cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.012;cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();});
  cx.globalAlpha=1; parts=parts.filter(p=>p.life>0);
  if(parts.length)requestAnimationFrame(loop);else{cf=false;cx.clearRect(0,0,cv.width,cv.height);}}

render();
</script>
